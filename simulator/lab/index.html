<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>WeiG Virtual qB Lab</title>
  <link rel="stylesheet" href="./lab.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <p class="eyebrow">WEIG VIRTUAL QB LAB</p>
      <h1>在浏览器里体验接近真实的 qBittorrent</h1>
      <p class="lead">不连接真实 BT 网络，不下载真实文件。原版 WeiG WebUI 将连接到浏览器中的 Virtual qB daemon。</p>
    </header>

    <section class="panel" aria-labelledby="launch-title">
      <div class="section-head">
        <div><p class="eyebrow">LAUNCH</p><h2 id="launch-title">创建模拟会话</h2></div>
        <span class="status" id="catalog-status">正在读取稳定版本…</span>
      </div>
      <form id="launch-form" class="grid">
        <label class="field"><span>WeiG 分支</span><select id="branch" name="branch"><option value="dev">dev</option><option value="main">main</option></select></label>
        <label class="field"><span>qBittorrent 稳定版</span><select id="qb-version" name="qb"></select></label>
        <label class="field"><span>Torrent 数量</span><input id="torrent-count" name="count" type="number" min="1" max="20000" step="1" value="5000"></label>
        <label class="field"><span>Scenario</span><select id="scenario" name="scenario"><option value="mixed">Mixed workload</option><option value="download-heavy">Download heavy</option><option value="seed-heavy">Seed heavy</option><option value="queue-stress">Queue stress</option><option value="poor-network">Poor network</option><option value="disk-bottleneck">Disk bottleneck</option></select></label>
        <label class="field"><span>Seed</span><input id="seed" name="seed" type="text" value="20260905" autocomplete="off"></label>
        <label class="field"><span>显示模式</span><select id="clean" name="clean"><option value="0">Lab：登录页预填 demo / demo</option><option value="1">Clean：原版登录页，不注入默认值</option></select></label>
        <div class="facts" id="version-facts" aria-live="polite"></div>
        <button class="primary" type="submit">启动 Virtual qB</button>
      </form>
    </section>

    <section class="panel compact">
      <p class="eyebrow">AUTH</p><h2>模拟登录</h2>
      <p>Virtual qB 接受任意用户名和密码。Lab 模式默认填入 <code>demo</code> / <code>demo</code>，只需点击登录；也可修改为任意值。退出后虚拟 Session 失效，受保护 API 返回 403。</p>
    </section>
  </main>
  <script type="module" src="./lab.js"></script>
</body>
</html>
