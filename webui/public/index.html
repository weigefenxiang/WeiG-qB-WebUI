<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="weig-build-sha" content="__WEIG_GIT_SHA__" />
  <meta name="weig-version" content="__WEIG_VERSION__" />
  <link rel="icon" href="assets/Wei.G.png?v=__WEIG_GIT_SHA__" />
  <title>WeiG qB WebUI · Login</title>
  <style>
    :root{font-family:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#e8edf7;background:#05070d;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 20% 15%,rgba(114,151,255,.12),transparent 32%),radial-gradient(circle at 85% 75%,rgba(129,111,255,.11),transparent 36%),#05070d}body:before,body:after{content:"";position:fixed;inset:-30%;pointer-events:none;background-image:radial-gradient(circle,rgba(255,255,255,.55) 0 1px,transparent 1.4px);background-size:53px 53px;opacity:.15;animation:drift 90s linear infinite}body:after{background-size:89px 89px;opacity:.08;animation-duration:130s;animation-direction:reverse}@keyframes drift{to{transform:translate3d(90px,60px,0)}}.card{position:relative;width:min(92vw,430px);padding:30px;border-radius:22px;background:linear-gradient(180deg,rgba(24,35,58,.82),rgba(10,15,28,.9));border:1px solid rgba(255,255,255,.09);box-shadow:0 30px 90px rgba(0,0,0,.48),inset 0 1px rgba(255,255,255,.07);backdrop-filter:blur(16px)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.mark{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;overflow:hidden;padding:2px;background:linear-gradient(135deg,rgba(114,151,255,.86),rgba(129,111,255,.78) 58%,rgba(56,214,255,.72));box-shadow:0 0 34px rgba(114,151,255,.28),inset 0 1px rgba(255,255,255,.18)}.mark img{display:block;width:100%;height:100%;object-fit:cover;border-radius:50%}.brand strong{font-size:18px}.brand small{display:block;color:#7f8aa5;margin-top:3px}.eyebrow{font-size:11px;letter-spacing:.15em;color:#7f8aa5;font-weight:800}.card h1{font-size:28px;margin:8px 0 8px}.lead{color:#b8c2d9;margin:0 0 24px}.field{display:grid;gap:8px;margin:16px 0;color:#b8c2d9;font-size:14px}.field input{width:100%;height:46px;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:rgba(5,7,13,.58);color:#e8edf7;padding:0 14px;font:inherit;outline:none;transition:160ms}.field input:hover{border-color:rgba(114,151,255,.34);background:rgba(13,20,36,.78)}.field input:focus{border-color:rgba(114,151,255,.82);background:rgba(15,24,43,.92);box-shadow:0 0 0 3px rgba(114,151,255,.13),0 10px 30px rgba(54,82,180,.12)}button{width:100%;height:46px;border:0;border-radius:10px;background:linear-gradient(135deg,#7297ff,#816fff 58%,#38d6ff);color:white;font-weight:750;font:inherit;cursor:pointer;box-shadow:0 12px 36px rgba(90,110,255,.22);transition:transform 160ms,filter 160ms}button:hover{transform:translateY(-1px);filter:brightness(1.05)}button:active{transform:scale(.985)}button:disabled{opacity:.6;cursor:wait}.error{min-height:22px;margin:14px 0 0;color:#ff8795;font-size:13px;line-height:1.5}.language-select{position:absolute;top:22px;right:22px;width:auto;max-width:132px;height:34px;padding:0 30px 0 10px;border:1px solid rgba(255,255,255,.12);border-radius:9px;background:rgba(8,13,25,.76);color:#cbd5ea;font:inherit;font-size:12px;outline:none;cursor:pointer}.language-select:hover{border-color:rgba(114,151,255,.48);background:rgba(15,24,43,.94)}.language-select:focus-visible{border-color:rgba(114,151,255,.82);box-shadow:0 0 0 3px rgba(114,151,255,.13)}.version-panel{display:grid;gap:7px;margin-top:22px;padding-top:17px;border-top:1px solid rgba(255,255,255,.06);font-size:12px;color:#7f8aa5}.version-row{display:flex;align-items:center;justify-content:space-between;gap:16px}.version-row strong{color:#b8c2d9;font-weight:650;font-variant-numeric:tabular-nums}.noscript{padding:12px;border-radius:10px;background:#37131a;color:#ffd7dc;margin-bottom:16px}@media(max-width:480px){.card{width:calc(100vw - 24px);padding:24px;border-radius:18px}}@media(prefers-reduced-motion:reduce){body:before,body:after{animation:none}button,.field input{transition:none}}
  </style>
</head>
<body>
  <main class="card">
    <noscript><div class="noscript">JavaScript is required to use this WebUI.</div></noscript>
    <select id="login-language" class="language-select" aria-label="Language"><option value="en">English</option><option value="zh-CN">简中</option><option value="zh-TW">繁中</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="es">Español</option><option value="pt-PT">Português</option><option value="ru">Русский</option></select>
    <div class="brand"><div class="mark"><img src="assets/Wei.G.png" alt="Wei.G" /></div><div><strong>WeiG qB WebUI</strong><small>Nebula Spatial Console</small></div></div>
    <div class="eyebrow">QBITTORRENT</div><h1 id="login-title">Welcome back</h1><p id="login-lead" class="lead">Sign in to your qBittorrent WebUI.</p>
    <form id="login-form" novalidate>
      <label class="field"><span id="username-label">Username</span><input id="username" name="username" type="text" autocomplete="username" required autofocus /></label>
      <label class="field"><span id="password-label">Password</span><input id="password" name="password" type="password" autocomplete="current-password" required /></label>
      <button id="login-btn" type="submit">Sign in</button><div id="error" class="error" role="alert" aria-live="polite"></div>
    </form>
    <div id="login-versions" class="version-panel" aria-label="Versions"><div class="version-row"><span>qBittorrent</span><strong id="login-qb-version">—</strong></div><div class="version-row"><span>WebAPI</span><strong id="login-api-version">—</strong></div><div class="version-row"><span>Wei.G WebUI</span><strong id="login-weig-version">—</strong></div></div>
  </main>
  <script src="storage-migration.js?v=__WEIG_GIT_SHA__"></script>
  <script src="scripts/entry-locale.js?v=__WEIG_GIT_SHA__"></script>
  <script src="session-contract.js?v=__WEIG_GIT_SHA__"></script>
  <script>
    (function(){
      var E=window.WeiGEntryLocale;if(!E)throw new Error('WeiG entry locale owner is unavailable.');var D=E.dictionary,norm=E.normalize;
      var SC=(window.WeiG||{}).SessionContract;if(!SC)throw new Error('WeiG SessionContract is unavailable.');if(SC.completePublicEntry)SC.completePublicEntry();
      function classifyLogin(x){return SC.loginKind(x.status,x.text);}
      var language=document.getElementById('login-language'),intent=SC.localeIntent&&norm(SC.localeIntent()),lang=intent||'en',list=navigator.languages||[navigator.language];if(!intent)for(var i=0;i<list.length;i++){var n=norm(list[i]);if(n){lang=n;break;}}
      var EN=D.en,L=D[lang]||EN;function tr(key,vars){var text=L[key]||EN[key]||key;Object.keys(vars||{}).forEach(function(k){text=text.replace('{'+k+'}',String(vars[k]));});return text;}function chooserLocale(value){return value==='zh-HK'?'zh-TW':value==='pt'?'pt-PT':value;}function applyCopy(){L=D[lang]||EN;document.documentElement.lang=lang;document.title='WeiG qB WebUI · '+tr('sign');document.getElementById('login-title').textContent=tr('title');document.getElementById('login-lead').textContent=tr('lead');document.getElementById('username-label').textContent=tr('user');document.getElementById('password-label').textContent=tr('pass');document.getElementById('login-btn').textContent=tr('sign');language.value=chooserLocale(lang);language.setAttribute('aria-label',tr('language'));}
      language.addEventListener('change',function(){var raw=language.value,next=norm(raw);if(!next)return;lang=next;if(SC.setLocaleIntent)SC.setLocaleIntent(raw);applyCopy();});applyCopy();var buildVersion=String(document.querySelector('meta[name="weig-version"]')?.content||'').trim();if(buildVersion&&buildVersion.indexOf('__WEIG_')!==0)document.getElementById('login-weig-version').textContent=buildVersion;
      var form=document.getElementById('login-form'),btn=document.getElementById('login-btn'),err=document.getElementById('error'),user=document.getElementById('username'),pwd=document.getElementById('password');
      function probeMessage(kind,status){if(kind==='session-missing')return tr('sessionLost');if(kind==='request-rejected')return tr('requestRejected',{status:status||'?'});if(kind==='offline')return tr('offline');return tr('unexpected',{status:status||'?'});}
      var previousFailure=SC.consumeFailure(),lostHandoff=SC.handoff&&SC.handoff();
      if(previousFailure)err.textContent=(previousFailure.kind==='navigation-mismatch')?tr('routeFallback'):((previousFailure.stage==='post-navigation'||previousFailure.stage==='post-reload')?probeMessage(previousFailure.kind,previousFailure.status):tr('reloadLost'));
      else if(lostHandoff){btn.disabled=true;SC.probe().then(function(probe){SC.clearHandoff();err.textContent=probe.kind==='authenticated'?tr('routeFallback'):probeMessage(probe.kind,probe.status);}).catch(function(){SC.clearHandoff();err.textContent=tr('offline');}).then(function(){btn.disabled=false;});}
      form.addEventListener('submit',function(e){
        e.preventDefault();err.textContent='';
        if(!user.value||!pwd.value){err.textContent=tr('bad');return;}
        btn.disabled=true;btn.textContent=tr('busy');
        var body='username='+encodeURIComponent(user.value)+'&password='+encodeURIComponent(pwd.value);
        fetch('api/v2/auth/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body,credentials:'same-origin',cache:'no-store'}).then(function(r){
          return r.text().then(function(t){return{status:r.status,ok:r.ok,text:String(t||'').trim()};});
        }).then(function(x){
          var kind=classifyLogin(x);
          if(kind==='accepted')return SC.probe().then(function(probe){
            if(probe.kind==='authenticated'){
              if(!SC.beginAuthenticatedHandoff())throw{kind:'storage',status:probe.status};
              return;
            }
            throw{kind:'session-probe',status:probe.status,probeKind:probe.kind};
          });
          if(kind==='login-blocked')throw{kind:'banned',status:x.status};
          if(kind==='login-rejected')throw{kind:'rejected',status:x.status};
          if(kind==='credentials-rejected')throw{kind:'bad',status:x.status};
          throw{kind:'unexpected',status:x.status};
        }).catch(function(ex){
          pwd.value='';pwd.focus();
          if(ex&&ex.kind==='bad')err.textContent=tr('bad');
          else if(ex&&ex.kind==='banned')err.textContent=tr('banned');
          else if(ex&&ex.kind==='rejected')err.textContent=tr('rejected',{status:ex.status||'?'});
          else if(ex&&ex.kind==='unexpected')err.textContent=tr('unexpected',{status:ex.status||'?'});
          else if(ex&&ex.kind==='session-probe')err.textContent=probeMessage(ex.probeKind,ex.status);
          else if(ex&&ex.kind==='storage')err.textContent=tr('storage');
          else err.textContent=tr('offline');
        }).then(function(){btn.disabled=false;btn.textContent=tr('sign');});
      });
    })();
  </script>
</body>
</html>
