<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <title>WeiG qB WebUI · 登录</title>
  <style>
    :root{font-family:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#e8edf7;background:#05070d;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 20% 15%,rgba(114,151,255,.12),transparent 32%),radial-gradient(circle at 85% 75%,rgba(129,111,255,.11),transparent 36%),#05070d}body:before,body:after{content:"";position:fixed;inset:-30%;pointer-events:none;background-image:radial-gradient(circle,rgba(255,255,255,.55) 0 1px,transparent 1.4px);background-size:53px 53px;opacity:.15;animation:drift 90s linear infinite}body:after{background-size:89px 89px;opacity:.08;animation-duration:130s;animation-direction:reverse}@keyframes drift{to{transform:translate3d(90px,60px,0)}}.card{position:relative;width:min(92vw,430px);padding:30px;border-radius:22px;background:linear-gradient(180deg,rgba(24,35,58,.82),rgba(10,15,28,.9));border:1px solid rgba(255,255,255,.09);box-shadow:0 30px 90px rgba(0,0,0,.48),inset 0 1px rgba(255,255,255,.07);backdrop-filter:blur(16px)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#7297ff,#816fff 60%,#38d6ff);box-shadow:0 0 34px rgba(114,151,255,.28);font-weight:800;color:white}.brand strong{font-size:18px}.brand small{display:block;color:#7f8aa5;margin-top:3px}.eyebrow{font-size:11px;letter-spacing:.15em;color:#7f8aa5;font-weight:800}.card h1{font-size:28px;margin:8px 0 8px}.lead{color:#b8c2d9;margin:0 0 24px}.field{display:grid;gap:8px;margin:16px 0;color:#b8c2d9;font-size:13px}.field input{width:100%;height:46px;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:rgba(5,7,13,.58);color:#e8edf7;padding:0 14px;font:inherit;outline:none;transition:160ms}.field input:focus{border-color:rgba(114,151,255,.72);box-shadow:0 0 0 3px rgba(114,151,255,.12)}button{width:100%;height:46px;border:0;border-radius:10px;background:linear-gradient(135deg,#7297ff,#816fff 58%,#38d6ff);color:white;font-weight:750;font:inherit;cursor:pointer;box-shadow:0 12px 36px rgba(90,110,255,.22);transition:transform 160ms,filter 160ms}button:hover{transform:translateY(-1px);filter:brightness(1.05)}button:active{transform:scale(.985)}button:disabled{opacity:.6;cursor:wait}.error{min-height:22px;margin:14px 0 0;color:#ff8795;font-size:13px}.hint{margin-top:22px;padding-top:18px;border-top:1px solid rgba(255,255,255,.06);font-size:12px;color:#7f8aa5}.noscript{padding:12px;border-radius:10px;background:#37131a;color:#ffd7dc;margin-bottom:16px}@media(max-width:480px){.card{width:calc(100vw - 24px);padding:24px;border-radius:18px}}@media(prefers-reduced-motion:reduce){body:before,body:after{animation:none}button{transition:none}}
  </style>
</head>
<body>
  <main class="card">
    <noscript><div class="noscript">需要启用 JavaScript 才能使用 WebUI。</div></noscript>
    <div class="brand"><div class="mark">W</div><div><strong>WeiG qB WebUI</strong><small>Nebula Noir</small></div></div>
    <div class="eyebrow">QBITTORRENT</div><h1>欢迎回来</h1><p class="lead">登录你的 qBittorrent WebUI。</p>
    <form id="login-form" novalidate>
      <label class="field"><span>用户名</span><input id="username" name="username" type="text" autocomplete="username" required autofocus /></label>
      <label class="field"><span>密码</span><input id="password" name="password" type="password" autocomplete="current-password" required /></label>
      <button id="login-btn" type="submit">登录</button><div id="error" class="error" role="alert" aria-live="polite"></div>
    </form>
    <div class="hint">兼容目标：qBittorrent 4.1.9 → 5.x。登录成功后自动进入控制台。</div>
  </main>
  <script>
    (function(){var form=document.getElementById('login-form'),btn=document.getElementById('login-btn'),err=document.getElementById('error'),pwd=document.getElementById('password');form.addEventListener('submit',function(e){e.preventDefault();err.textContent='';btn.disabled=true;btn.textContent='正在登录…';var body=new URLSearchParams(new FormData(form));fetch('api/v2/auth/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded; charset=UTF-8'},body:body.toString(),credentials:'same-origin'}).then(function(r){return r.text().then(function(t){if(!r.ok||t.trim()!=='Ok.')throw new Error(t||'用户名或密码错误');location.reload();});}).catch(function(ex){pwd.value='';pwd.focus();err.textContent=ex.message||'无法连接 qBittorrent';}).finally(function(){btn.disabled=false;btn.textContent='登录';});});})();
  </script>
</body>
</html>
