<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <link rel="icon" type="image/png" href="Wei.G.ico" />
  <title>WeiG qB WebUI · Login</title>
  <style>
    :root{font-family:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#e8edf7;background:#05070d;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 20% 15%,rgba(114,151,255,.12),transparent 32%),radial-gradient(circle at 85% 75%,rgba(129,111,255,.11),transparent 36%),#05070d}body:before,body:after{content:"";position:fixed;inset:-30%;pointer-events:none;background-image:radial-gradient(circle,rgba(255,255,255,.55) 0 1px,transparent 1.4px);background-size:53px 53px;opacity:.15;animation:drift 90s linear infinite}body:after{background-size:89px 89px;opacity:.08;animation-duration:130s;animation-direction:reverse}@keyframes drift{to{transform:translate3d(90px,60px,0)}}.card{position:relative;width:min(92vw,430px);padding:30px;border-radius:22px;background:linear-gradient(180deg,rgba(24,35,58,.82),rgba(10,15,28,.9));border:1px solid rgba(255,255,255,.09);box-shadow:0 30px 90px rgba(0,0,0,.48),inset 0 1px rgba(255,255,255,.07);backdrop-filter:blur(16px)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.mark{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;overflow:hidden;padding:2px;background:linear-gradient(135deg,rgba(114,151,255,.86),rgba(129,111,255,.78) 58%,rgba(56,214,255,.72));box-shadow:0 0 34px rgba(114,151,255,.28),inset 0 1px rgba(255,255,255,.18)}.mark img{display:block;width:100%;height:100%;object-fit:cover;border-radius:50%}.brand strong{font-size:18px}.brand small{display:block;color:#7f8aa5;margin-top:3px}.eyebrow{font-size:11px;letter-spacing:.15em;color:#7f8aa5;font-weight:800}.card h1{font-size:28px;margin:8px 0 8px}.lead{color:#b8c2d9;margin:0 0 24px}.field{display:grid;gap:8px;margin:16px 0;color:#b8c2d9;font-size:14px}.field input{width:100%;height:46px;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:rgba(5,7,13,.58);color:#e8edf7;padding:0 14px;font:inherit;outline:none;transition:160ms}.field input:hover{border-color:rgba(114,151,255,.34);background:rgba(13,20,36,.78)}.field input:focus{border-color:rgba(114,151,255,.82);background:rgba(15,24,43,.92);box-shadow:0 0 0 3px rgba(114,151,255,.13),0 10px 30px rgba(54,82,180,.12)}button{width:100%;height:46px;border:0;border-radius:10px;background:linear-gradient(135deg,#7297ff,#816fff 58%,#38d6ff);color:white;font-weight:750;font:inherit;cursor:pointer;box-shadow:0 12px 36px rgba(90,110,255,.22);transition:transform 160ms,filter 160ms}button:hover{transform:translateY(-1px);filter:brightness(1.05)}button:active{transform:scale(.985)}button:disabled{opacity:.6;cursor:wait}.error{min-height:22px;margin:14px 0 0;color:#ff8795;font-size:13px;line-height:1.5}.hint{margin-top:22px;padding-top:18px;border-top:1px solid rgba(255,255,255,.06);font-size:13px;color:#7f8aa5}.noscript{padding:12px;border-radius:10px;background:#37131a;color:#ffd7dc;margin-bottom:16px}@media(max-width:480px){.card{width:calc(100vw - 24px);padding:24px;border-radius:18px}}@media(prefers-reduced-motion:reduce){body:before,body:after{animation:none}button,.field input{transition:none}}
  </style>
</head>
<body>
  <main class="card">
    <noscript><div class="noscript">JavaScript is required to use this WebUI.</div></noscript>
    <div class="brand"><div class="mark"><img src="Wei.G.ico" alt="Wei.G" /></div><div><strong>WeiG qB WebUI</strong><small>Nebula Spatial Console</small></div></div>
    <div class="eyebrow">QBITTORRENT</div><h1 id="login-title">Welcome back</h1><p id="login-lead" class="lead">Sign in to your qBittorrent WebUI.</p>
    <form id="login-form" novalidate>
      <label class="field"><span id="username-label">Username</span><input id="username" name="username" type="text" autocomplete="username" required autofocus /></label>
      <label class="field"><span id="password-label">Password</span><input id="password" name="password" type="password" autocomplete="current-password" required /></label>
      <button id="login-btn" type="submit">Sign in</button><div id="error" class="error" role="alert" aria-live="polite"></div>
    </form>
    <div id="login-hint" class="hint">Compatibility target: qBittorrent 4.1.9 → current 5.x.</div>
  </main>
  <script>
    (function(){
      var D={
        en:{title:'Welcome back',lead:'Sign in to your qBittorrent WebUI.',user:'Username',pass:'Password',sign:'Sign in',busy:'Signing in…',bad:'Invalid username or password.',banned:'Too many failed login attempts. qBittorrent has temporarily blocked this client. On qBittorrent 4.1.x, restart qBittorrent to clear the in-memory ban, then verify the credentials before retrying.',rejected:'qBittorrent rejected the login request (HTTP {status}). Check reverse-proxy Host/Origin handling and WebUI security settings.',unexpected:'Unexpected response from qBittorrent (HTTP {status}).',offline:'Unable to connect to qBittorrent.',hint:'Compatibility target: qBittorrent 4.1.9 → current 5.x.'},
        'zh-CN':{title:'欢迎回来',lead:'登录你的 qBittorrent WebUI。',user:'用户名',pass:'密码',sign:'登录',busy:'正在登录…',bad:'用户名或密码错误。',banned:'登录失败次数过多，qBittorrent 已临时封禁当前客户端。qBittorrent 4.1.x 可通过重启 qBittorrent 清除内存中的封禁；重试前请先确认账号密码。',rejected:'qBittorrent 拒绝了登录请求（HTTP {status}）。请检查反向代理的 Host/Origin 转发以及 WebUI 安全设置。',unexpected:'qBittorrent 返回了非预期响应（HTTP {status}）。',offline:'无法连接 qBittorrent。',hint:'兼容目标：qBittorrent 4.1.9 → 当前 5.x。'},
        'zh-TW':{title:'歡迎回來',lead:'登入你的 qBittorrent WebUI。',user:'使用者名稱',pass:'密碼',sign:'登入',busy:'正在登入…',bad:'使用者名稱或密碼錯誤。',hint:'相容目標：qBittorrent 4.1.9 → 目前 5.x。'},
        ja:{title:'おかえりなさい',lead:'qBittorrent WebUI にサインインします。',user:'ユーザー名',pass:'パスワード',sign:'サインイン',busy:'サインイン中…',bad:'ユーザー名またはパスワードが正しくありません。',hint:'互換対象: qBittorrent 4.1.9 → 現行 5.x。'},
        ko:{title:'다시 오신 것을 환영합니다',lead:'qBittorrent WebUI에 로그인합니다.',user:'사용자 이름',pass:'비밀번호',sign:'로그인',busy:'로그인 중…',bad:'사용자 이름 또는 비밀번호가 올바르지 않습니다.',hint:'호환 대상: qBittorrent 4.1.9 → 현재 5.x.'}
      };
      function norm(v){v=String(v||'').toLowerCase();if(v.indexOf('zh-tw')===0||v.indexOf('zh-hk')===0||v.indexOf('zh-hant')===0)return'zh-TW';if(v.indexOf('zh')===0)return'zh-CN';if(v.indexOf('ja')===0)return'ja';if(v.indexOf('ko')===0)return'ko';if(v.indexOf('en')===0)return'en';return'';}
      var lang='en',list=navigator.languages||[navigator.language];for(var i=0;i<list.length;i++){var n=norm(list[i]);if(n){lang=n;break;}}
      var EN=D.en,L=D[lang]||EN;function tr(key,vars){var text=L[key]||EN[key]||key;Object.keys(vars||{}).forEach(function(k){text=text.replace('{'+k+'}',String(vars[k]));});return text;}
      document.documentElement.lang=lang;document.title='WeiG qB WebUI · '+tr('sign');document.getElementById('login-title').textContent=tr('title');document.getElementById('login-lead').textContent=tr('lead');document.getElementById('username-label').textContent=tr('user');document.getElementById('password-label').textContent=tr('pass');document.getElementById('login-btn').textContent=tr('sign');document.getElementById('login-hint').textContent=tr('hint');
      var form=document.getElementById('login-form'),btn=document.getElementById('login-btn'),err=document.getElementById('error'),user=document.getElementById('username'),pwd=document.getElementById('password');
      form.addEventListener('submit',function(e){
        e.preventDefault();err.textContent='';
        if(!user.value||!pwd.value){err.textContent=tr('bad');return;}
        btn.disabled=true;btn.textContent=tr('busy');
        var body='username='+encodeURIComponent(user.value)+'&password='+encodeURIComponent(pwd.value);
        fetch('api/v2/auth/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body,credentials:'same-origin',cache:'no-store'}).then(function(r){
          return r.text().then(function(t){return{status:r.status,ok:r.ok,text:String(t||'').trim()};});
        }).then(function(x){
          if(x.status===403)throw{kind:'banned',status:x.status};
          if(!x.ok)throw{kind:'rejected',status:x.status};
          if(x.text==='Ok.'){window.location.reload();return;}
          if(x.text==='Fails.')throw{kind:'bad',status:x.status};
          throw{kind:'unexpected',status:x.status};
        }).catch(function(ex){
          pwd.value='';pwd.focus();
          if(ex&&ex.kind==='bad')err.textContent=tr('bad');
          else if(ex&&ex.kind==='banned')err.textContent=tr('banned');
          else if(ex&&ex.kind==='rejected')err.textContent=tr('rejected',{status:ex.status||'?'});
          else if(ex&&ex.kind==='unexpected')err.textContent=tr('unexpected',{status:ex.status||'?'});
          else err.textContent=tr('offline');
        }).then(function(){btn.disabled=false;btn.textContent=tr('sign');});
      });
    })();
  </script>
</body>
</html>
