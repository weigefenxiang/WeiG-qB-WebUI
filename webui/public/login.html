<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <title>WeiG qB WebUI · Login</title>
  <style>
    :root{font-family:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#e8edf7;background:#05070d;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 20% 15%,rgba(114,151,255,.12),transparent 32%),radial-gradient(circle at 85% 75%,rgba(129,111,255,.11),transparent 36%),#05070d}body:before,body:after{content:"";position:fixed;inset:-30%;pointer-events:none;background-image:radial-gradient(circle,rgba(255,255,255,.55) 0 1px,transparent 1.4px);background-size:53px 53px;opacity:.15;animation:drift 90s linear infinite}body:after{background-size:89px 89px;opacity:.08;animation-duration:130s;animation-direction:reverse}@keyframes drift{to{transform:translate3d(90px,60px,0)}}.card{position:relative;width:min(92vw,430px);padding:30px;border-radius:22px;background:linear-gradient(180deg,rgba(24,35,58,.82),rgba(10,15,28,.9));border:1px solid rgba(255,255,255,.09);box-shadow:0 30px 90px rgba(0,0,0,.48),inset 0 1px rgba(255,255,255,.07);backdrop-filter:blur(16px)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#7297ff,#816fff 60%,#38d6ff);box-shadow:0 0 34px rgba(114,151,255,.28);font-weight:800;color:white}.brand strong{font-size:18px}.brand small{display:block;color:#7f8aa5;margin-top:3px}.eyebrow{font-size:11px;letter-spacing:.15em;color:#7f8aa5;font-weight:800}.card h1{font-size:28px;margin:8px 0 8px}.lead{color:#b8c2d9;margin:0 0 24px}.field{display:grid;gap:8px;margin:16px 0;color:#b8c2d9;font-size:14px}.field input{width:100%;height:46px;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:rgba(5,7,13,.58);color:#e8edf7;padding:0 14px;font:inherit;outline:none;transition:160ms}.field input:focus{border-color:rgba(114,151,255,.72);box-shadow:0 0 0 3px rgba(114,151,255,.12)}button{width:100%;height:46px;border:0;border-radius:10px;background:linear-gradient(135deg,#7297ff,#816fff 58%,#38d6ff);color:white;font-weight:750;font:inherit;cursor:pointer;box-shadow:0 12px 36px rgba(90,110,255,.22);transition:transform 160ms,filter 160ms}button:hover{transform:translateY(-1px);filter:brightness(1.05)}button:active{transform:scale(.985)}button:disabled{opacity:.6;cursor:wait}.error{min-height:22px;margin:14px 0 0;color:#ff8795;font-size:13px}.hint{margin-top:22px;padding-top:18px;border-top:1px solid rgba(255,255,255,.06);font-size:13px;color:#7f8aa5}.noscript{padding:12px;border-radius:10px;background:#37131a;color:#ffd7dc;margin-bottom:16px}@media(max-width:480px){.card{width:calc(100vw - 24px);padding:24px;border-radius:18px}}@media(prefers-reduced-motion:reduce){body:before,body:after{animation:none}button{transition:none}}
  </style>
</head>
<body>
  <main class="card">
    <noscript><div class="noscript">JavaScript is required to use this WebUI.</div></noscript>
    <div class="brand"><div class="mark">W</div><div><strong>WeiG qB WebUI</strong><small>Nebula Noir</small></div></div>
    <div class="eyebrow">QBITTORRENT</div><h1 id="login-title">Welcome back</h1><p id="login-lead" class="lead">Sign in to your qBittorrent WebUI.</p>
    <form id="login-form" novalidate>
      <label class="field"><span id="username-label">Username</span><input id="username" name="username" type="text" autocomplete="username" required autofocus /></label>
      <label class="field"><span id="password-label">Password</span><input id="password" name="password" type="password" autocomplete="current-password" required /></label>
      <button id="login-btn" type="submit">Sign in</button><div id="error" class="error" role="alert" aria-live="polite"></div>
    </form>
    <div id="login-hint" class="hint">Compatibility target: qBittorrent 4.1.9 → current 5.x.</div>
  </main>
  <script>
    (function(){
      var D={en:{title:'Welcome back',lead:'Sign in to your qBittorrent WebUI.',user:'Username',pass:'Password',sign:'Sign in',busy:'Signing in…',bad:'Invalid username or password',offline:'Unable to connect to qBittorrent',hint:'Compatibility target: qBittorrent 4.1.9 → current 5.x.'},'zh-CN':{title:'欢迎回来',lead:'登录你的 qBittorrent WebUI。',user:'用户名',pass:'密码',sign:'登录',busy:'正在登录…',bad:'用户名或密码错误',offline:'无法连接 qBittorrent',hint:'兼容目标：qBittorrent 4.1.9 → 当前 5.x。'},'zh-TW':{title:'歡迎回來',lead:'登入你的 qBittorrent WebUI。',user:'使用者名稱',pass:'密碼',sign:'登入',busy:'正在登入…',bad:'使用者名稱或密碼錯誤',offline:'無法連線 qBittorrent',hint:'相容目標：qBittorrent 4.1.9 → 目前 5.x。'},ja:{title:'おかえりなさい',lead:'qBittorrent WebUI にサインインします。',user:'ユーザー名',pass:'パスワード',sign:'サインイン',busy:'サインイン中…',bad:'ユーザー名またはパスワードが正しくありません',offline:'qBittorrent に接続できません',hint:'互換対象: qBittorrent 4.1.9 → 現行 5.x。'},ko:{title:'다시 오신 것을 환영합니다',lead:'qBittorrent WebUI에 로그인합니다.',user:'사용자 이름',pass:'비밀번호',sign:'로그인',busy:'로그인 중…',bad:'사용자 이름 또는 비밀번호가 올바르지 않습니다',offline:'qBittorrent에 연결할 수 없습니다',hint:'호환 대상: qBittorrent 4.1.9 → 현재 5.x.'}};
      function norm(v){v=String(v||'').toLowerCase();if(v.indexOf('zh-tw')===0||v.indexOf('zh-hk')===0||v.indexOf('zh-hant')===0)return'zh-TW';if(v.indexOf('zh')===0)return'zh-CN';if(v.indexOf('ja')===0)return'ja';if(v.indexOf('ko')===0)return'ko';if(v.indexOf('en')===0)return'en';return'';}var lang='en',list=navigator.languages||[navigator.language];for(var i=0;i<list.length;i++){var n=norm(list[i]);if(n){lang=n;break;}}var L=D[lang]||D.en;document.documentElement.lang=lang;document.title='WeiG qB WebUI · '+L.sign;document.getElementById('login-title').textContent=L.title;document.getElementById('login-lead').textContent=L.lead;document.getElementById('username-label').textContent=L.user;document.getElementById('password-label').textContent=L.pass;document.getElementById('login-btn').textContent=L.sign;document.getElementById('login-hint').textContent=L.hint;
      var form=document.getElementById('login-form'),btn=document.getElementById('login-btn'),err=document.getElementById('error'),pwd=document.getElementById('password');form.addEventListener('submit',function(e){e.preventDefault();err.textContent='';btn.disabled=true;btn.textContent=L.busy;var body=new URLSearchParams(new FormData(form));fetch('api/v2/auth/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded; charset=UTF-8'},body:body.toString(),credentials:'same-origin'}).then(function(r){return r.text().then(function(t){if(!r.ok||t.trim()!=='Ok.')throw new Error(L.bad);location.reload();});}).catch(function(ex){pwd.value='';pwd.focus();err.textContent=ex.message||L.offline;}).finally(function(){btn.disabled=false;btn.textContent=L.sign;});});
    })();
  </script>
</body>
</html>
