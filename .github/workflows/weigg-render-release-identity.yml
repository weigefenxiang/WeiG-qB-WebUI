name: Render Release identity hardening

on:
  push:
    branches: [dev]
    paths:
      - '.weigg-apply/release-identity.py'
      - '.github/workflows/weigg-render-release-identity.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify staging boundary and render patch
        shell: bash
        env:
          PRE_SHA: fed57c852c12c6ad40bc6a380a2c1086d7a09163
          PRE_TREE: bec1ac245df17229f1e2e4570e107d302812323f
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PRE_SHA" HEAD
          test "$(git rev-parse "$PRE_SHA^{tree}")" = "$PRE_TREE"
          mapfile -t changed < <(git diff --name-only "$PRE_SHA" HEAD)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | sort | diff -u <(printf '%s\n' '.github/workflows/weigg-render-release-identity.yml' '.weigg-apply/release-identity.py' | sort) -
          python3 .weigg-apply/release-identity.py
          git diff --check
          bash -n installers/install.sh
          bash -n tests/candidate-deployment.sh
          pwsh -NoProfile -Command '$null=[scriptblock]::Create((Get-Content "installers/install.ps1" -Raw)); Write-Host "PowerShell syntax parsed."'
          npm ci --no-audit --no-fund --prefer-offline
          node tests/platform-contract.mjs
          npm test
      - name: Create clean unattached final commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRE_TREE: bec1ac245df17229f1e2e4570e107d302812323f
        run: |
          set -euo pipefail
          create_blob() {
            local file="$1"
            local encoded payload
            encoded="$(base64 -w0 "$file")"
            payload="$(jq -n --arg content "$encoded" '{content:$content,encoding:"base64"}')"
            gh api --method POST "/repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq '.sha' <<<"$payload"
          }
          SH_BLOB="$(create_blob installers/install.sh)"
          PS_BLOB="$(create_blob installers/install.ps1)"
          CANDIDATE_BLOB="$(create_blob tests/candidate-deployment.sh)"
          PLATFORM_BLOB="$(create_blob tests/platform-contract.mjs)"
          TREE_PAYLOAD="$(jq -n \
            --arg base "$PRE_TREE" \
            --arg sh "$SH_BLOB" \
            --arg ps "$PS_BLOB" \
            --arg candidate "$CANDIDATE_BLOB" \
            --arg platform "$PLATFORM_BLOB" \
            '{base_tree:$base,tree:[
              {path:"installers/install.sh",mode:"100755",type:"blob",sha:$sh},
              {path:"installers/install.ps1",mode:"100644",type:"blob",sha:$ps},
              {path:"tests/candidate-deployment.sh",mode:"100755",type:"blob",sha:$candidate},
              {path:"tests/platform-contract.mjs",mode:"100644",type:"blob",sha:$platform}
            ]}')"
          FINAL_TREE="$(gh api --method POST "/repos/$GITHUB_REPOSITORY/git/trees" --input - --jq '.sha' <<<"$TREE_PAYLOAD")"
          COMMIT_PAYLOAD="$(jq -n --arg message 'fix: bind Release assets to tag identity' --arg tree "$FINAL_TREE" --arg parent "$GITHUB_SHA" '{message:$message,tree:$tree,parents:[$parent]}')"
          FINAL_COMMIT="$(gh api --method POST "/repos/$GITHUB_REPOSITORY/git/commits" --input - --jq '.sha' <<<"$COMMIT_PAYLOAD")"
          echo "FINAL_TREE=$FINAL_TREE"
          echo "FINAL_COMMIT=$FINAL_COMMIT"
          echo "Parent staging SHA=$GITHUB_SHA"
