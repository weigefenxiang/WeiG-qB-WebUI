name: CI

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      validation_mode:
        description: Validation depth
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - ui
          - candidate

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Semantic runtime, qB baselines and JavaScript syntax
        run: npm test
      - name: Linux installer syntax
        run: sh -n installers/install.sh
      - name: Live regression script syntax
        run: |
          sh -n tests/live.sh
          bash -n tests/live-api.sh
      - name: PowerShell installer syntax
        shell: pwsh
        run: |
          $null = [scriptblock]::Create((Get-Content 'installers/install.ps1' -Raw))
          Write-Host 'PowerShell installer syntax parsed.'

  ui_browser:
    name: Linux semantic UI regression
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'ui' && github.ref == 'refs/heads/dev') || (github.event_name == 'push' && github.ref == 'refs/heads/dev' && contains(github.event.head_commit.message, '[ui]')) }}
    runs-on: ubuntu-24.04
    needs: smoke
    env:
      WEIGG_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install browser test dependency
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Verify hosted Chrome runtime
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome >/dev/null || { echo 'Hosted Google Chrome Stable is missing.' >&2; exit 1; }
          google-chrome --version
          node -p "require('playwright/package.json').version"
          printf 'Runner image: %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          printf 'Git SHA: %s\n' "$GITHUB_SHA"
      - name: qB 4.1.9.1 and 5.2 semantic UI regressions
        run: |
          node tests/browser-runtime.mjs
          node tests/browser-theme.mjs
          node tests/browser-feedback.mjs
          node tests/browser-feature-parity.mjs
          node tests/browser-torrent-workspace.mjs
          node tests/browser-adaptive-ui.mjs

  release_compatibility:
    name: Full qB Release compatibility audit
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'candidate' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/dev' && contains(github.event.head_commit.message, '[candidate]')) }}
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Full fixture compatibility matrix
        run: node tests/release-compat.mjs
      - name: Checkout qBittorrent upstream with all release tags
        uses: actions/checkout@v4
        with:
          repository: qbittorrent/qBittorrent
          path: upstream-qb
          fetch-depth: 0
          filter: blob:none
      - name: Audit every official stable qB 4.x and 5.x tag from 4.1.9.1
        run: node tests/upstream-release-audit.mjs upstream-qb

  browser:
    name: Linux browser candidate
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'candidate' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/dev' && contains(github.event.head_commit.message, '[candidate]')) }}
    runs-on: ubuntu-24.04
    needs: smoke
    env:
      WEIGG_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install browser test dependency
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Verify hosted Chrome runtime
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome >/dev/null || { echo 'Hosted Google Chrome Stable is missing.' >&2; exit 1; }
          google-chrome --version
          node -p "require('playwright/package.json').version"
          printf 'Runner image: %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          printf 'Git SHA: %s\n' "$GITHUB_SHA"
      - name: Semantic runtime browser matrix
        run: |
          node tests/browser-runtime.mjs
          node tests/browser-theme.mjs
          node tests/browser-feedback.mjs
          node tests/browser-feature-parity.mjs
          node tests/browser-torrent-workspace.mjs
          node tests/browser-adaptive-ui.mjs

  windows_browser:
    name: Windows browser candidate
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'candidate' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/dev' && contains(github.event.head_commit.message, '[candidate]')) }}
    runs-on: windows-2025
    needs: smoke
    env:
      WEIGG_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install browser test dependency
        shell: pwsh
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Verify hosted Chrome runtime
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe"
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe"
          )
          $chrome = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $chrome) { throw 'Hosted Google Chrome Stable is missing.' }
          & $chrome --version
          node -p "require('playwright/package.json').version"
          Write-Host "Runner image: $env:ImageOS $env:ImageVersion"
          Write-Host "Git SHA: $env:GITHUB_SHA"
      - name: Windows contracts and installer syntax
        shell: pwsh
        run: |
          npm test
          $null = [scriptblock]::Create((Get-Content 'installers/install.ps1' -Raw))
          Write-Host 'Windows contracts passed.'
      - name: Semantic runtime browser matrix on Windows
        shell: pwsh
        run: |
          node tests/browser-runtime.mjs
          node tests/browser-theme.mjs
          node tests/browser-feedback.mjs
          node tests/browser-feature-parity.mjs
          node tests/browser-torrent-workspace.mjs
          node tests/browser-adaptive-ui.mjs

  release_candidate:
    name: release candidate
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'candidate' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/dev' && contains(github.event.head_commit.message, '[candidate]')) }}
    runs-on: ubuntu-latest
    needs:
      - smoke
      - release_compatibility
      - browser
      - windows_browser
    steps:
      - uses: actions/checkout@v4
      - name: Package exact-SHA release candidate
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release
          cp -a webui release/WeiG-qB-WebUI
          find release/WeiG-qB-WebUI -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.json' -o -name 'GIT_SHA' \) -exec sed -i "s/__WEIGG_GIT_SHA__/${GITHUB_SHA}/g" {} +
          printf '%s\n' "${GITHUB_SHA}" > release/WeiG-qB-WebUI/GIT_SHA
          cd release
          zip -r WeiG-qB-WebUI.zip WeiG-qB-WebUI
          sha256sum WeiG-qB-WebUI.zip > SHA256SUMS
          printf '%s\n' "${GITHUB_SHA}" > CANDIDATE_SHA
      - name: Upload reusable release candidate
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.sha }}
          path: |
            release/WeiG-qB-WebUI.zip
            release/SHA256SUMS
            release/CANDIDATE_SHA
          if-no-files-found: error
          retention-days: 90
