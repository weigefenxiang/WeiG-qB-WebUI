  windows_browser:
    name: Windows browser candidate
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'candidate' && github.ref == 'refs/heads/dev') || (github.event_name == 'push' && github.ref == 'refs/heads/test/A72' && contains(github.event.head_commit.message, '[A72-platform]')) }}
    runs-on: windows-2025
    needs: smoke
    env:
      WEIG_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install browser test dependency
        shell: pwsh
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Verify hosted Chrome runtime
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe"
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe"
          )
          $chrome = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $chrome) { throw 'Hosted Google Chrome Stable is missing.' }
          $chromeVersion = (Get-Item $chrome).VersionInfo.ProductVersion
          if ([string]::IsNullOrWhiteSpace($chromeVersion)) { throw 'Hosted Google Chrome Stable version is unavailable.' }
          Write-Host "Google Chrome $chromeVersion"
          node -p "require('playwright/package.json').version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Runner image: $env:ImageOS $env:ImageVersion"
          Write-Host "Git SHA: $env:GITHUB_SHA"
      - name: Windows platform, qB config encoding and installer syntax
        shell: pwsh
        run: |
          node tests/platform-contract.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/windows-distribution-artifact-contract.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $null = [scriptblock]::Create((Get-Content 'installers/install.ps1' -Raw))
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/windows-config-encoding.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host 'Windows platform contracts passed.'
      - name: Representative qB4/qB5 semantic browser matrix on Windows
        shell: pwsh
        run: |
          $tests = @(
            'tests/browser-runtime.mjs',
            'tests/browser-settings-fidelity.mjs'
          )
          foreach ($test in $tests) {
