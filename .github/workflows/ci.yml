          }

  release_candidate:
    name: release candidate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'candidate' && github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    needs:
      - smoke
      - browser
      - windows_browser
      - installer_lifecycle_linux
      - installer_lifecycle_busybox
      - installer_lifecycle_windows
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Package exact-SHA self-contained release candidate
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          rm -rf "$RUNNER_TEMP/candidate-dist" release
          node tools/build-webui-dist.mjs \
            --webui-root=webui \
            --out="$RUNNER_TEMP/candidate-dist" \
            --sha="$GITHUB_SHA" \
            --version="$VERSION"
          mkdir -p release
          cp "$RUNNER_TEMP/candidate-dist/weig-qb-webui.zip" release/weig-qb-webui.zip
          cp "$RUNNER_TEMP/candidate-dist/weig-qb-webui.tar.gz" release/weig-qb-webui.tar.gz
          cp "$RUNNER_TEMP/candidate-dist/manifest.json" release/manifest.json
          cp "$RUNNER_TEMP/candidate-dist/SHA256SUMS" release/SHA256SUMS
          cp "$RUNNER_TEMP/candidate-dist/install.sh" release/install.sh
          cp "$RUNNER_TEMP/candidate-dist/install.ps1" release/install.ps1
          chmod 0755 release/install.sh
          printf '%s\n' "$GITHUB_SHA" > release/CANDIDATE_SHA
          (cd release && sha256sum -c SHA256SUMS)
          test "$(unzip -p release/weig-qb-webui.zip weig-qb-webui/GIT_SHA | tr -d '\r\n')" = "$GITHUB_SHA"
          test "$(unzip -p release/weig-qb-webui.zip weig-qb-webui/VERSION | tr -d '\r\n')" = "$VERSION"
          test "$(tar -xOzf release/weig-qb-webui.tar.gz weig-qb-webui/GIT_SHA | tr -d '\r\n')" = "$GITHUB_SHA"
          test "$(tar -xOzf release/weig-qb-webui.tar.gz weig-qb-webui/VERSION | tr -d '\r\n')" = "$VERSION"
          unzip -Z1 release/weig-qb-webui.zip | grep -qE '^weig-qb-webui/private/data/qb-copy-routes/r[0-9a-f]{20}\.json\.gz$'
          unzip -Z1 release/weig-qb-webui.zip | grep -qE '^weig-qb-webui/private/data/qb-copy-bindings/b[0-9a-f]{20}\.txt$'
          unzip -Z1 release/weig-qb-webui.zip | grep -qE '^weig-qb-webui/private/data/qb-copy-fallback/p[0-9a-f]{20}\.json\.gz$'
          if unzip -Z1 release/weig-qb-webui.zip | grep -q '^weig-qb-webui/private/data/qb-copy-profiles/'; then
            echo 'Retired qB copy profile owner reappeared in candidate package.' >&2
            exit 1
          fi
          unzip -t release/weig-qb-webui.zip 'weig-qb-webui/translations/webui_*.qm' >/dev/null
          if unzip -Z1 release/weig-qb-webui.zip | grep -E '^weig-qb-webui/private/(scripts/release-profile\.js|data/qb-releases\.json|data/qb-release-profiles/)' > "$RUNNER_TEMP/retired-runtime-paths.txt"; then
            cat "$RUNNER_TEMP/retired-runtime-paths.txt" >&2
            echo 'Retired release-profile runtime reappeared in candidate package.' >&2
            exit 1
          fi
      - name: Upload reusable release candidate
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-${{ github.sha }}
          path: |
            release/weig-qb-webui.zip
            release/weig-qb-webui.tar.gz
            release/manifest.json
            release/SHA256SUMS
            release/CANDIDATE_SHA
            release/install.sh
            release/install.ps1
          if-no-files-found: error
          retention-days: 90
      - name: Dispatch isolated candidate deployment acceptance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -n --arg ref dev --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            '{ref:$ref,inputs:{candidate_sha:$sha,candidate_run_id:$run}}' \
            | gh api --method POST "/repos/$GITHUB_REPOSITORY/actions/workflows/candidate-deployment-only.yml/dispatches" --input -
          echo "Dispatched isolated deployment acceptance for candidate $GITHUB_SHA from CI run $GITHUB_RUN_ID."

  native_surface_source_base:
