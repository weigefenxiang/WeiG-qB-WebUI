    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && (inputs.validation_mode == 'native-surfaces' || inputs.validation_mode == 'change-aware')) || (github.event_name == 'push' && github.ref == 'refs/heads/dev' && contains(github.event.head_commit.message, '[native-surfaces]')) }}
    runs-on: ubuntu-latest
