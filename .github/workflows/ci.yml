name: CI

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      validation_mode:
        description: Validation depth
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - ui
          - candidate

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Semantic runtime, qB baselines and JavaScript syntax
        run: npm test
      - name: Linux installer syntax
        run: sh -n installers/install.sh
      - name: Live regression script syntax
        run: |
          sh -n tests/live.sh
          bash -n tests/live-api.sh
      - name: PowerShell installer syntax
        shell: pwsh
        run: |
          $null = [scriptblock]::Create((Get-Content 'installers/install.ps1' -Raw))
          Write-Host 'PowerShell installer syntax parsed.'

  ui_browser:
    name: Linux semantic UI regression
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'ui' && github.ref == 'refs/heads/dev') || (github.event_name == 'push' && github.ref == 'refs/heads/dev' && contains(github.event.head_commit.message, '[ui]')) }}
    runs-on: ubuntu-24.04
    needs: smoke
    env:
      WEIGG_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install browser test dependency
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Verify hosted Chrome runtime
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome >/dev/null || { echo 'Hosted Google Chrome Stable is missing.' >&2; exit 1; }
          google-chrome --version
          node -p "require('playwright/package.json').version"
          printf 'Runner image: %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          printf 'Git SHA: %s\n' "$GITHUB_SHA"
      - name: Representative qB4/qB5 semantic UI regressions
        run: |
          node tests/browser-runtime.mjs
          node tests/browser-theme.mjs
          node tests/browser-feedback.mjs
          node tests/browser-feature-parity.mjs
          node tests/browser-torrent-workspace.mjs
          node tests/browser-adaptive-ui.mjs
          node tests/browser-torrent-field-provenance.mjs
          node tests/browser-sidebar-capability-visual.mjs

  release_compatibility:
    name: Full qB Release compatibility audit
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'candidate' && github.ref == 'refs/heads/dev') || (github.event_name == 'push' && github.ref == 'refs/heads/dev' && contains(github.event.head_commit.message, '[candidate]')) }}
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Representative fixture compatibility matrix
        run: node tests/release-compat.mjs
      - name: Checkout qBittorrent upstream with all stable release tags
        uses: actions/checkout@v7
        with:
          repository: qbittorrent/qBittorrent
          path: upstream-qb
          fetch-depth: 0
          fetch-tags: true
          filter: blob:none
      - name: Generate source-derived qB 4.1.0 to latest stable catalog
        run: node tools/qb-release-catalog.mjs upstream-qb --output=qb-releases.json
      - name: Enrich exact qB WebUI locale and Settings translation source facts
        run: node tools/qb-locale-source.mjs upstream-qb qb-releases.json
      - name: Freeze reusable official qB Settings translation LKG
        run: |
          set -euo pipefail
          node tools/qb-settings-translation-lkg.mjs qb-releases.json tests/fixtures/qb-release-catalog.lkg.json qb-settings-translation-lkg.json
          sha256sum qb-settings-translation-lkg.json > qb-settings-translation-lkg.SHA256
          node tests/full-stable-locale-routing-contract.mjs qb-releases.json --require-mapped
          rm -rf "$RUNNER_TEMP/qb-materialized"
          mkdir -p "$RUNNER_TEMP/qb-materialized/private/data"
          node tools/qb-webui-catalog.mjs qb-releases.json "$RUNNER_TEMP/qb-materialized/private/data/qb-releases.json"
          test -s "$RUNNER_TEMP/qb-materialized/private/data/qb-settings-native.txt"
          find "$RUNNER_TEMP/qb-materialized/translations" -type f -name 'webui_*.qm' -print -quit | grep -q .
      - name: Audit every official stable qB release from 4.1.0
        run: node tests/upstream-release-audit.mjs upstream-qb
      - name: Full stable PRODUCT compatibility matrix
        run: node tests/full-stable-product-compat.mjs qb-releases.json
      - name: Upload exact stable release catalog
        uses: actions/upload-artifact@v7
        with:
          name: qb-release-catalog-${{ github.sha }}
          path: qb-releases.json
          if-no-files-found: error
          retention-days: 1
      - name: Upload certified qB Settings translation LKG
        uses: actions/upload-artifact@v7
        with:
          name: qb-settings-translation-lkg-${{ github.sha }}
          path: |
            qb-settings-translation-lkg.json
            qb-settings-translation-lkg.SHA256
          if-no-files-found: error
          retention-days: 90

  browser:
    name: Linux browser candidate
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'candidate' && github.ref == 'refs/heads/dev') || (github.event_name == 'push' && github.ref == 'refs/heads/dev' && contains(github.event.head_commit.message, '[candidate]')) }}
    runs-on: ubuntu-24.04
    needs: smoke
    env:
      WEIGG_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install browser test dependency
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Verify hosted Chrome runtime
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome >/dev/null || { echo 'Hosted Google Chrome Stable is missing.' >&2; exit 1; }
          google-chrome --version
          node -p "require('playwright/package.json').version"
          printf 'Runner image: %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          printf 'Git SHA: %s\n' "$GITHUB_SHA"
      - name: Representative qB4/qB5 semantic browser matrix
        run: |
          node tests/browser-runtime.mjs
          node tests/browser-theme.mjs
          node tests/browser-feedback.mjs
          node tests/browser-feature-parity.mjs
          node tests/browser-torrent-workspace.mjs
          node tests/browser-adaptive-ui.mjs
          node tests/browser-torrent-field-provenance.mjs
          node tests/browser-sidebar-capability-visual.mjs

  windows_browser:
    name: Windows browser candidate
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'candidate' && github.ref == 'refs/heads/dev') || (github.event_name == 'push' && github.ref == 'refs/heads/dev' && contains(github.event.head_commit.message, '[candidate]')) }}
    runs-on: windows-2025
    needs: smoke
    env:
      WEIGG_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install browser test dependency
        shell: pwsh
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Verify hosted Chrome runtime
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe"
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe"
          )
          $chrome = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $chrome) { throw 'Hosted Google Chrome Stable is missing.' }
          $chromeVersion = (Get-Item $chrome).VersionInfo.ProductVersion
          if ([string]::IsNullOrWhiteSpace($chromeVersion)) { throw 'Hosted Google Chrome Stable version is unavailable.' }
          Write-Host "Google Chrome $chromeVersion"
          node -p "require('playwright/package.json').version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Runner image: $env:ImageOS $env:ImageVersion"
          Write-Host "Git SHA: $env:GITHUB_SHA"
      - name: Windows contracts and installer syntax
        shell: pwsh
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $null = [scriptblock]::Create((Get-Content 'installers/install.ps1' -Raw))
          Write-Host 'Windows contracts passed.'
      - name: Representative qB4/qB5 semantic browser matrix on Windows
        shell: pwsh
        run: |
          $tests = @(
            'tests/browser-runtime.mjs',
            'tests/browser-theme.mjs',
            'tests/browser-feedback.mjs',
            'tests/browser-feature-parity.mjs',
            'tests/browser-torrent-workspace.mjs',
            'tests/browser-adaptive-ui.mjs',
            'tests/browser-torrent-field-provenance.mjs',
            'tests/browser-sidebar-capability-visual.mjs'
          )
          foreach ($test in $tests) {
            node $test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  release_candidate:
    name: release candidate
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'candidate' && github.ref == 'refs/heads/dev') || (github.event_name == 'push' && github.ref == 'refs/heads/dev' && contains(github.event.head_commit.message, '[candidate]')) }}
    runs-on: ubuntu-latest
    needs:
      - smoke
      - release_compatibility
      - browser
      - windows_browser
    steps:
      - uses: actions/checkout@v7
      - name: Download exact stable release catalog
        uses: actions/download-artifact@v8
        with:
          name: qb-release-catalog-${{ github.sha }}
          path: release-catalog
      - name: Package exact-SHA release candidate
        run: |
          set -euo pipefail
          test -s release-catalog/qb-releases.json
          mkdir -p webui/private/data
          node tools/qb-webui-catalog.mjs release-catalog/qb-releases.json webui/private/data/qb-releases.json
          rm -rf release
          mkdir -p release
          cp -a webui release/WeiG-qB-WebUI
          find release/WeiG-qB-WebUI -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.json' -o -name 'GIT_SHA' \) -exec sed -i "s/__WEIGG_GIT_SHA__/${GITHUB_SHA}/g" {} +
          printf '%s\n' "${GITHUB_SHA}" > release/WeiG-qB-WebUI/GIT_SHA
          test -s release/WeiG-qB-WebUI/private/data/qb-releases.json
          cd release
          zip -r WeiG-qB-WebUI.zip WeiG-qB-WebUI
          sha256sum WeiG-qB-WebUI.zip > SHA256SUMS
          printf '%s\n' "${GITHUB_SHA}" > CANDIDATE_SHA
      - name: Upload reusable release candidate
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-${{ github.sha }}
          path: |
            release/WeiG-qB-WebUI.zip
            release/SHA256SUMS
            release/CANDIDATE_SHA
          if-no-files-found: error
          retention-days: 90

  candidate_deployment:
    name: release candidate deployment acceptance
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'candidate' && github.ref == 'refs/heads/dev') || (github.event_name == 'push' && github.ref == 'refs/heads/dev' && contains(github.event.head_commit.message, '[candidate]')) }}
    runs-on: ubuntu-24.04
    needs: release_candidate
    env:
      WEIGG_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install browser test dependency
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Verify hosted Chrome runtime
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome >/dev/null || { echo 'Hosted Google Chrome Stable is missing.' >&2; exit 1; }
          google-chrome --version
          node -p "require('playwright/package.json').version"
          printf 'Git SHA: %s\n' "$GITHUB_SHA"
      - name: Download exact-SHA release candidate
        uses: actions/download-artifact@v8
        with:
          name: release-candidate-${{ github.sha }}
          path: candidate-artifact
      - name: Candidate deployment syntax
        run: |
          bash -n tests/candidate-deployment.sh
          node --check tests/installer-lifecycle-browser.mjs
      - name: Deploy exact candidate to official qB and Chrome
        shell: bash
        run: bash tests/candidate-deployment.sh candidate-artifact
      - name: Upload exact-SHA candidate deployment evidence
        uses: actions/upload-artifact@v7
        with:
          name: candidate-deployment-${{ github.sha }}
          path: artifacts/candidate-deployment/candidate.json
          if-no-files-found: error
          retention-days: 90
