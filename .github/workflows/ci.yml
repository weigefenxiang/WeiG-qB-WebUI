name: CI

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      validation_mode:
        description: Validation depth
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - linux
          - candidate

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: WebUI smoke, compatibility contracts and JavaScript syntax
        run: npm test
      - name: Compatibility matrix contract
        run: node tests/compat-matrix-v036.mjs
      - name: Release compatibility contract
        run: node tests/release-compat-v037.mjs
      - name: Windows and Linux platform contract
        run: node tests/platform-contract-v037.mjs
      - name: Browser test syntax
        run: |
          node --check tests/browser-logs-v033.mjs
          node --check tests/browser-settings-v034.mjs
          node --check tests/browser-ui-v036.mjs
          node --check tests/browser-mobile-v036.mjs
          node --check tests/browser-v037.mjs
          node --check tests/browser-ui-system-v037.mjs
          node --check tests/compat-matrix-v036.mjs
          node --check tests/release-compat-v037.mjs
          node --check tests/platform-contract-v037.mjs
      - name: Linux installer syntax
        run: sh -n installers/install.sh
      - name: Live regression script syntax
        run: |
          bash -n tests/live-qb52.sh
          sh -n tests/live-v036.sh
          sh -n tests/live-v037.sh
      - name: PowerShell installer syntax
        shell: pwsh
        run: |
          $null = [scriptblock]::Create((Get-Content 'installers/install.ps1' -Raw))
          Write-Host 'PowerShell installer syntax parsed.'

  browser:
    name: Linux browser matrix
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.validation_mode == 'linux' || inputs.validation_mode == 'candidate') }}
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Cross-version Logs browser regression
        run: node tests/browser-logs-v033.mjs
      - name: Cross-version Alternative WebUI settings regression
        run: node tests/browser-settings-v034.mjs
      - name: Mobile adaptive viewport and storage regression
        run: node tests/browser-mobile-v036.mjs
      - name: Unified v0.3.7 interaction and settings regression
        run: node tests/browser-v037.mjs
      - name: Shared responsive UI system regression
        run: node tests/browser-ui-system-v037.mjs
      - name: Full representative qB 4.x and 5.x interaction regression
        run: node tests/browser-ui-v036.mjs

  windows_browser:
    name: Windows browser matrix
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'candidate' }}
    runs-on: windows-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Windows compatibility and installer contracts
        shell: pwsh
        run: |
          npm test
          $null = [scriptblock]::Create((Get-Content 'installers/install.ps1' -Raw))
          Write-Host 'Windows compatibility contracts passed.'
      - name: Install Chromium test runtime
        shell: pwsh
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Representative qB 4.x and 5.x browser matrix on Windows
        shell: pwsh
        run: node tests/browser-ui-v036.mjs
      - name: Unified v0.3.7 Windows regression
        shell: pwsh
        run: node tests/browser-v037.mjs
      - name: Shared responsive UI Windows regression
        shell: pwsh
        run: node tests/browser-ui-system-v037.mjs

  release_candidate:
    name: release candidate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'candidate' }}
    runs-on: ubuntu-latest
    needs:
      - smoke
      - browser
      - windows_browser
    steps:
      - uses: actions/checkout@v4
      - name: Package exact-SHA release candidate
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release
          cp -a webui release/WeiG-qB-WebUI
          find release/WeiG-qB-WebUI -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.json' -o -name 'GIT_SHA' \) -exec sed -i "s/__WEIGG_GIT_SHA__/${GITHUB_SHA}/g" {} +
          printf '%s\n' "${GITHUB_SHA}" > release/WeiG-qB-WebUI/GIT_SHA
          cd release
          zip -r WeiG-qB-WebUI.zip WeiG-qB-WebUI
          sha256sum WeiG-qB-WebUI.zip > SHA256SUMS
          printf '%s\n' "${GITHUB_SHA}" > CANDIDATE_SHA
      - name: Upload reusable release candidate
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.sha }}
          path: |
            release/WeiG-qB-WebUI.zip
            release/SHA256SUMS
            release/CANDIDATE_SHA
          if-no-files-found: error
          retention-days: 90
