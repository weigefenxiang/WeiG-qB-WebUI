  native_surface_source:
    name: qB native surface source admission
    if: ${{ always() && ((github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'native-surfaces' && github.ref == 'refs/heads/dev') || (github.event_name == 'workflow_dispatch' && inputs.validation_mode == 'change-aware' && needs.native_surface_source_base.result == 'success' && needs.native_surface_preferences.result == 'success') || (github.event_name == 'push' && github.ref == 'refs/heads/dev' && contains(github.event.head_commit.message, '[native-surfaces]'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - native_surface_source_base
      - native_surface_preferences
    steps:
      - name: Require base and every Preferences shard
        env:
          BASE_RESULT: ${{ needs.native_surface_source_base.result }}
          SHARDS_RESULT: ${{ needs.native_surface_preferences.result }}
        run: |
          set -euo pipefail
          test "$BASE_RESULT" = success
          test "$SHARDS_RESULT" = success
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Checkout qBittorrent upstream for independent census
        uses: actions/checkout@v7
        with:
          repository: qbittorrent/qBittorrent
          path: upstream-qb
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Download shared native surface base
        uses: actions/download-artifact@v8
        with:
          name: native-surface-base-${{ github.sha }}
          path: native-base
      - name: Download all exact Preferences source shards
        uses: actions/download-artifact@v8
        with:
          pattern: native-surface-preferences-${{ github.sha }}-*
          path: preferences-shards
          merge-multiple: true
      - name: Aggregate exact Preferences shards
        shell: bash
        run: |
          set -euo pipefail
          node tools/qb-preferences-surface-source.mjs --merge native-base/qb-releases.json preferences-shards qb-preferences-source-catalog.json
      - name: Compile Preferences compact contract
        run: node tools/qb-preferences-compact.mjs qb-preferences-source-catalog.json settings-native-compat.json tests/fixtures/qb-release-catalog.lkg.json
      - name: Emit canonical Settings runtime materialization evidence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {packSettingsRuntime} from './tools/qb-compact-runtime.mjs';
          const source=JSON.parse(fs.readFileSync('settings-native-compat.json','utf8'));
          const rendered=JSON.stringify(packSettingsRuntime(source,source.catalogIdentity).manifest)+'\n';
          fs.writeFileSync('settings-runtime-materialized.json',rendered,'utf8');
          const encoded=Buffer.from(rendered,'utf8').toString('base64');
          console.log('@@SETTINGS_RUNTIME_META\t'+Buffer.byteLength(rendered)+'\t'+crypto.createHash('sha256').update(rendered).digest('hex')+'\t'+encoded.length);
          for(let offset=0,index=0;offset<encoded.length;offset+=4000,index++)console.log('@@SETTINGS_RUNTIME_B64\t'+index+'\t'+encoded.slice(offset,offset+4000));
          const rss=fs.readFileSync('native-base/rss-compat.json','utf8');
          const rssEncoded=Buffer.from(rss,'utf8').toString('base64');
          console.log('@@RSS_RUNTIME_META\t'+Buffer.byteLength(rss)+'\t'+crypto.createHash('sha256').update(rss).digest('hex')+'\t'+rssEncoded.length);
          for(let offset=0,index=0;offset<rssEncoded.length;offset+=4000,index++)console.log('@@RSS_RUNTIME_B64\t'+index+'\t'+rssEncoded.slice(offset,offset+4000));
          NODE
      - name: Verify every admitted stable Preferences source profile and independent census
        env:
          QB_PREFERENCES_CENSUS_OUTPUT: qb-preferences-census.json
        run: node audits/full-stable-preferences-source-contract.mjs qb-preferences-source-catalog.json native-base/qb-releases.json upstream-qb
      - name: Census qB WebUI QBT_TR entities across every admitted source SHA
        env:
          QB_QBT_ENTITY_CENSUS_OUTPUT: qb-qbt-entity-census.json
        run: node audits/full-stable-qbt-entity-source-contract.mjs native-base/qb-releases.json upstream-qb
      - name: Verify committed qB-owned copy runtime against admitted current source
        shell: bash
        run: |
          set -euo pipefail
          node tests/qb-runtime-copy-materialization-contract.mjs native-base/qb-releases.json webui/private/data
      - name: Collect exact native surface source artifacts
        shell: bash
        run: |
          set -euo pipefail
          cp native-base/qb-releases.json qb-releases.json
          cp native-base/qb-rss-source-catalog.json qb-rss-source-catalog.json
          cp native-base/rss-compat.json rss-compat.json
      - name: Upload exact native surface source artifacts
        uses: actions/upload-artifact@v7
        with:
          name: native-surface-source-${{ github.sha }}
          path: |
            qb-releases.json
            qb-rss-source-catalog.json
            rss-compat.json
            qb-preferences-source-catalog.json
            qb-preferences-census.json
            qb-qbt-entity-census.json
            settings-native-compat.json
            settings-runtime-materialized.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify canonical runtimes and delegate Settings materialization
        shell: bash
        run: |
          set -euo pipefail
          blocking_mismatch=0
          settings_runtime_stale=0
          node tools/qb-detail-runtime-rebind.mjs detail-runtime-materialized.json native-base/qb-releases.json
          cmp -s settings-runtime-materialized.json webui/private/data/settings-compat.json || {
            echo 'Committed Settings runtime is stale against the exact-SHA canonical materialization; the dedicated Settings source-runtime owner will materialize it.'
            sha256sum settings-runtime-materialized.json webui/private/data/settings-compat.json
            settings_runtime_stale=1
          }
          cmp -s native-base/rss-compat.json webui/private/data/rss-compat.json || {
            echo 'Committed RSS runtime does not match the exact-SHA canonical materialization.' >&2
            sha256sum native-base/rss-compat.json webui/private/data/rss-compat.json >&2
            blocking_mismatch=1
          }
          cmp -s detail-runtime-materialized.json webui/private/data/detail-compat.json || {
            echo 'Committed Detail runtime does not match the exact-SHA canonical materialization.' >&2
            sha256sum detail-runtime-materialized.json webui/private/data/detail-compat.json >&2
            blocking_mismatch=1
          }
          test "$blocking_mismatch" -eq 0
          if [ "$settings_runtime_stale" -eq 0 ]; then echo 'Committed Settings runtime already matches the exact-SHA canonical materialization.'; fi
          sha256sum settings-runtime-materialized.json native-base/rss-compat.json detail-runtime-materialized.json


  native_settings_runtime_materialize:
    name: qB Settings exact source runtime materialization
    if: ${{ always() && needs.native_surface_source.result == 'success' && github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    needs:
      - native_surface_source
    permissions:
      contents: write
      actions: write
    outputs:
      materialized_sha: ${{ steps.commit.outputs.materialized_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Download exact native Settings source runtime
        uses: actions/download-artifact@v8
        with:
          name: native-surface-source-${{ github.sha }}
          path: native-source
      - name: Stage and verify canonical Settings source runtime
        shell: bash
        run: |
          set -euo pipefail
          GENERATED="native-source/settings-runtime-materialized.json"
          TARGET="webui/private/data/settings-compat.json"
          test -s "$GENERATED"
          if cmp -s "$GENERATED" "$TARGET"; then echo "Committed Settings source runtime already matches exact source generation."; exit 0; fi
          cp "$GENERATED" "$TARGET"
          node tests/settings-contract.mjs
          node tests/qb-preferences-surface-source-contract.mjs
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$TARGET"
      - name: Commit canonical Settings source runtime if changed
        id: commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET="webui/private/data/settings-compat.json"
          git diff --quiet -- "$TARGET" && exit 0
          handoff_latest_native_surface() {
            local remote_sha="$1"
            echo "Settings source-runtime owner $GITHUB_SHA is stale; handing native-surface validation to latest dev $remote_sha."
            jq -n --arg ref dev '{ref:$ref,inputs:{validation_mode:"native-surfaces"}}' | gh api --method POST "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches" --input -
          }
          git fetch --no-tags origin dev
          REMOTE_DEV_SHA="$(git rev-parse origin/dev)"
          if [ "$REMOTE_DEV_SHA" != "$GITHUB_SHA" ]; then handoff_latest_native_surface "$REMOTE_DEV_SHA"; exit 0; fi
          git config user.name "WeiG CI"
          git config user.email "actions@users.noreply.github.com"
          git add "$TARGET"
          git commit -m "a57: materialize exact Settings source runtime [ui]"
          git fetch --no-tags origin dev
          REMOTE_DEV_SHA="$(git rev-parse origin/dev)"
          if [ "$REMOTE_DEV_SHA" != "$GITHUB_SHA" ]; then handoff_latest_native_surface "$REMOTE_DEV_SHA"; exit 0; fi
          git push origin HEAD:dev
          echo "materialized_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  materialized_validation_dispatch:
    name: Dispatch materialized exact-SHA validation
    if: ${{ always() && github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    needs:
      - torrent_runtime_materialize
      - settings_runtime_materialize
      - settings_bundle_materialize
      - stable_lkg_refresh
      - detail_runtime_materialize
      - native_settings_runtime_materialize
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch validation owners for generated dev head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TORRENT_RUNTIME_SHA: ${{ needs.torrent_runtime_materialize.outputs.materialized_sha }}
          SETTINGS_RUNTIME_SHA: ${{ needs.settings_runtime_materialize.outputs.materialized_sha }}
          SETTINGS_BUNDLE_SHA: ${{ needs.settings_bundle_materialize.outputs.materialized_sha }}
          STABLE_RUNTIME_SHA: ${{ needs.stable_lkg_refresh.outputs.materialized_sha }}
          DETAIL_RUNTIME_SHA: ${{ needs.detail_runtime_materialize.outputs.materialized_sha }}
          NATIVE_SETTINGS_RUNTIME_SHA: ${{ needs.native_settings_runtime_materialize.outputs.materialized_sha }}
        run: |
          set -euo pipefail
          shas=()
          for value in "$TORRENT_RUNTIME_SHA" "$SETTINGS_RUNTIME_SHA" "$SETTINGS_BUNDLE_SHA" "$STABLE_RUNTIME_SHA" "$DETAIL_RUNTIME_SHA" "$NATIVE_SETTINGS_RUNTIME_SHA"; do
            [ -n "$value" ] && shas+=("$value")
          done
          if [ "${#shas[@]}" -eq 0 ]; then
            echo "No generated dev commit was published; no materialized validation dispatch is needed."
            exit 0
          fi
          mapfile -t unique_shas < <(printf '%s\n' "${shas[@]}" | sort -u)
          if [ "${#unique_shas[@]}" -ne 1 ]; then
            echo "Multiple generated dev SHAs escaped one CI run: ${unique_shas[*]}" >&2
            exit 1
          fi
          TARGET_SHA="${unique_shas[0]}"
          REMOTE_DEV_SHA="$(gh api "/repos/$GITHUB_REPOSITORY/commits/dev" --jq '.sha')"
          if [ "$REMOTE_DEV_SHA" != "$TARGET_SHA" ]; then
            echo "Generated checkpoint $TARGET_SHA is stale; current dev is $REMOTE_DEV_SHA. A newer owner must dispatch validation."
            exit 0
          fi

          jq -n --arg ref dev '{ref:$ref,inputs:{validation_mode:"change-aware"}}' \
            | gh api --method POST "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches" --input -
          echo "Dispatched one change-aware CI owner for generated dev@$TARGET_SHA."

          if [ -n "$STABLE_RUNTIME_SHA" ]; then
            jq -n --arg ref dev '{ref:$ref,inputs:{validation_mode:"settings-evidence"}}' \
              | gh api --method POST "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches" --input -
            echo "Frozen LKG changed on $TARGET_SHA; retained the dedicated Settings source-evidence owner."
          fi

          jq -n --arg ref dev             '{ref:$ref,inputs:{mode:"change-aware"}}'             | gh api --method POST "/repos/$GITHUB_REPOSITORY/actions/workflows/pages-source.yml/dispatches" --input -
          echo "Dispatched change-aware Virtual qB Pages Source for dev@$TARGET_SHA."
