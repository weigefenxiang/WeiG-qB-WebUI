      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Checkout qBittorrent upstream with stable tags
        uses: actions/checkout@v7
        with:
          repository: qbittorrent/qBittorrent
          path: upstream-qb
          fetch-depth: 0
          fetch-tags: true
