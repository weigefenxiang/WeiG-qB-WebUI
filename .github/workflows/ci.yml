name: CI
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: WebUI smoke and JavaScript syntax
        run: npm test
      - name: Compatibility matrix contract
        run: node tests/compat-matrix-v036.mjs
      - name: Browser test syntax
        run: |
          node --check tests/browser-logs-v033.mjs
          node --check tests/browser-settings-v034.mjs
          node --check tests/browser-ui-v036.mjs
          node --check tests/compat-matrix-v036.mjs
      - name: Linux installer syntax
        run: sh -n installers/install.sh
      - name: Live regression script syntax
        run: bash -n tests/live-qb52.sh
      - name: PowerShell installer syntax
        shell: pwsh
        run: |
          $null = [scriptblock]::Create((Get-Content 'installers/install.ps1' -Raw))
          Write-Host 'PowerShell installer syntax parsed.'

  browser:
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Cross-version Logs browser regression
        run: node tests/browser-logs-v033.mjs
      - name: Cross-version Alternative WebUI settings regression
        run: node tests/browser-settings-v034.mjs
      - name: Full representative v0.3.6 interaction regression
        run: node tests/browser-ui-v036.mjs
