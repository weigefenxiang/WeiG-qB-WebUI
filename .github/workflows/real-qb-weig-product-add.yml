name: Real qB WeiG Product Add Torrent

# Automatic product-level proof on exact dev SHA; never touches a user's qB.
# This is an automated gate, not the later required human acceptance.
on:
  push:
    branches: [dev]
    paths:
      - tools/data/qb-stable-lkg.json
      - tests/fixtures/qb-release-catalog.lkg.json
      - .github/workflows/real-qb-weig-product-add.yml
      - webui/private/data/capabilities.json
      - webui/private/data/torrent-compat.json
      - webui/private/data/source-actions.json
      - webui/private/data/settings-compat.json
      - webui/private/data/detail-compat.json
      - webui/private/data/qb-copy-routes/**
      - webui/private/data/qb-copy-fallback/**
      - webui/private/data/qb-copy-bindings/**
      - webui/translations/webui_*.qm
      - webui/private/css/**
      - webui/private/bootstrap-plan.json
      - webui/private/scripts/runtime-assets.js
      - webui/private/scripts/navigation.js
      - tools/build-webui-dist.mjs
      - tools/css-bundle-materializer.mjs
      - tools/js-bundle-materializer.mjs
      - webui/public/styles/**
      - webui/private/scripts/capabilities.js
      - webui/private/scripts/qb-client.js
      - webui/private/scripts/app.js
      - webui/private/scripts/torrent-semantics.js
      - webui/private/scripts/transfer.js
      - webui/private/scripts/rss.js
      - webui/private/scripts/logs.js
      - webui/private/scripts/settings.js
      - webui/private/scripts/i18n.js
      - tests/real-qb-docker.sh
      - tests/real-qb-browser.mjs
      - audits/real-qb-full-matrix-contract.mjs
      - tests/real-qb-fast-aggregate-contract.mjs
      - VERSION
      - webui/VERSION
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-qb-weig-product-add-${{ github.sha }}
  cancel-in-progress: false

jobs:
  add_torrent:
    name: WeiG UI Add Torrent on newest Frozen-admitted real qB
    if: ${{ github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact dev
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify exact source SHA and isolated runners
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          command -v docker
          command -v google-chrome
          node audits/real-qb-full-matrix-contract.mjs
      - name: Install repository-locked browser dependencies
        run: |
          npm ci --no-audit --no-fund --prefer-offline
          node -e "console.log('Playwright ' + require('playwright/package.json').version)"
      - name: Real WeiG dialog -> HTTP POST -> persisted torrent
        shell: bash
        env:
          WEIG_REAL_QB_REQUIRE_ADD_TORRENT: '1'
          WEIG_REAL_QB_EVIDENCE_DIR: artifacts/real-qb-weig-add
        run: |
          set -euo pipefail
          qb_version="$(node -p "require('./tools/data/qb-stable-lkg.json').latestAdmittedStable")"
          bash tests/real-qb-docker.sh --version "$qb_version" --browser-smoke --allow-writes
          echo "Real qB ${qb_version}: verified WeiG UI Add Torrent with exact SHA ${GITHUB_SHA}; human acceptance remains outstanding." >> "$GITHUB_STEP_SUMMARY"
      - name: Retain product evidence even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: real-qb-weig-add-${{ github.sha }}
          path: artifacts/real-qb-weig-add/
          if-no-files-found: error
          retention-days: 14
