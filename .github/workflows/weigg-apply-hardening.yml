name: Apply verified Windows hardening payload

on:
  push:
    branches: [dev]
    paths:
      - '.weigg-apply/**'
      - '.github/workflows/weigg-apply-hardening.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "$GITHUB_SHA"

      - name: Reassemble and verify payload
        shell: bash
        run: |
          set -euo pipefail
          cat .weigg-apply/install.b64.* | base64 -d > installers/install.ps1
          cat .weigg-apply/test.b64.* | base64 -d > tests/windows-config-encoding.ps1
          echo "769ecace30402f913805f3beffa98ab11ba0ee0af129ea72adde70dee822b204  installers/install.ps1" | sha256sum -c -
          echo "b313eb3d161860c0469427811da71fcd41e8ca982c6fc8b380b49a6a9dc6653b  tests/windows-config-encoding.ps1" | sha256sum -c -
          rm -rf .weigg-apply
          rm .github/workflows/weigg-apply-hardening.yml
          git diff --check
          pwsh -NoProfile -File tests/windows-config-encoding.ps1

      - name: Commit exact verified payload
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "$GITHUB_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "fix: harden Windows qB config writes [candidate]"
          git push origin HEAD:dev
