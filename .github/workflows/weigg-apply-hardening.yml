name: Apply verified Windows hardening payload

on:
  push:
    branches: [dev]
    paths:
      - '.weigg-apply/**'
      - '.github/workflows/weigg-apply-hardening.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify source head
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin dev
          if ((git rev-parse origin/dev).Trim() -ne $env:GITHUB_SHA) { throw 'dev advanced before validation; refusing to apply.' }

      - name: Reassemble and validate exact payload with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          function Decode-Chunks([string]$Pattern,[string]$Destination) {
            $encoded = (Get-ChildItem $Pattern | Sort-Object Name | ForEach-Object { [IO.File]::ReadAllText($_.FullName) }) -join ''
            [IO.File]::WriteAllBytes($Destination,[Convert]::FromBase64String($encoded))
          }
          Decode-Chunks '.weigg-apply/install.b64.*' (Join-Path $PWD.Path 'installers\install.ps1')
          Decode-Chunks '.weigg-apply/test.b64.*' (Join-Path $PWD.Path 'tests\windows-config-encoding.ps1')
          if ((Get-FileHash 'installers\install.ps1' -Algorithm SHA256).Hash.ToLowerInvariant() -ne '769ecace30402f913805f3beffa98ab11ba0ee0af129ea72adde70dee822b204') { throw 'Installer SHA256 mismatch.' }
          if ((Get-FileHash 'tests\windows-config-encoding.ps1' -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'b313eb3d161860c0469427811da71fcd41e8ca982c6fc8b380b49a6a9dc6653b') { throw 'Windows safety test SHA256 mismatch.' }
          Remove-Item '.weigg-apply' -Recurse -Force
          Remove-Item '.github\workflows\weigg-apply-hardening.yml' -Force
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File 'tests\windows-config-encoding.ps1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit exact verified payload
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin dev
          if ((git rev-parse origin/dev).Trim() -ne $env:GITHUB_SHA) { throw 'dev advanced after validation; refusing to push.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw 'No changes to commit.' }
          git commit -m 'fix: harden Windows qB config writes [candidate]'
          git push origin HEAD:dev
