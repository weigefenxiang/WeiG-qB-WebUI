name: Phase D LKG Bootstrap

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/phase-d-lkg-bootstrap.yml'

permissions:
  contents: write

concurrency:
  group: phase-d-lkg-bootstrap-dev
  cancel-in-progress: false

jobs:
  seed_lkg:
    name: Seed exact Phase C frozen catalog
    if: ${{ github.repository == 'weigefenxiang/WeiG-qB-WebUI' && github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Checkout qBittorrent upstream with all stable tags
        uses: actions/checkout@v7
        with:
          repository: qbittorrent/qBittorrent
          path: upstream-qb
          fetch-depth: 0
          fetch-tags: true
          filter: blob:none
      - name: Rebuild exact Phase C catalog and verify frozen evidence
        shell: bash
        run: |
          set -euo pipefail
          test ! -e tests/fixtures/qb-release-catalog.lkg.json || { echo 'Frozen LKG catalog already exists; bootstrap is no longer needed.'; exit 0; }
          node tools/qb-release-catalog.mjs upstream-qb --output=qb-release-catalog.lkg.json
          printf '%s  %s\n' '8b91742ac8eee276b7994c84445c681913430f220325a10afc8c931c89645ddb' 'qb-release-catalog.lkg.json' | sha256sum -c -
          node tests/full-stable-product-compat.mjs qb-release-catalog.lkg.json
          mkdir -p tests/fixtures tools/data
          mv qb-release-catalog.lkg.json tests/fixtures/qb-release-catalog.lkg.json
          cat > tools/data/qb-stable-lkg.json <<'JSON'
          {
            "schemaVersion": 1,
            "supportFloor": "4.1.0",
            "latestAdmittedStable": "5.2.3",
            "profileCount": 65,
            "catalogPath": "tests/fixtures/qb-release-catalog.lkg.json",
            "catalogSha256": "8b91742ac8eee276b7994c84445c681913430f220325a10afc8c931c89645ddb",
            "seedEvidence": {
              "weiGCommit": "b14926b8d67b5919aa2c281762ed97c5cee46c21",
              "ciRunId": 34088574583,
              "artifactId": 10006069857,
              "artifactDigest": "sha256:499d3f4c6f54fa2f8d54628d3289d619c01e1d50152cc9cf1fc75a39041692d2",
              "verifiedDate": "2026-09-07"
            }
          }
          JSON
      - name: Safe fast-forward commit of one complete frozen catalog file
        shell: bash
        run: |
          set -euo pipefail
          test -s tests/fixtures/qb-release-catalog.lkg.json || { echo 'Frozen catalog was not created.' >&2; exit 1; }
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "$GITHUB_SHA" || { echo 'dev moved during bootstrap; refusing to write.' >&2; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/fixtures/qb-release-catalog.lkg.json tools/data/qb-stable-lkg.json
          git diff --cached --quiet && { echo 'Nothing to seed.'; exit 0; }
          git commit -m 'Phase D: seed frozen stable LKG catalog'
          git push origin HEAD:dev
