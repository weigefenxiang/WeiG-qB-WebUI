name: Release Prepare

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact current dev SHA to prepare; blank means current workflow SHA
        required: false
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: release-prepare
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Freeze exact dev release candidate
        id: freeze
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          SHA="${REQUESTED_SHA:-$GITHUB_SHA}"
          SHA="${SHA,,}"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = 'refs/heads/dev'
          REMOTE_DEV="$(gh api "/repos/$GITHUB_REPOSITORY/commits/dev" --jq '.sha')"
          test "$REMOTE_DEV" = "$SHA"
          test "$(git rev-parse HEAD)" = "$SHA"
          VERSION="$(tr -d '\r\n' < VERSION)"
          test "$(tr -d '\r\n' < webui/VERSION)" = "$VERSION"
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          test "$(node -p "require('./package-lock.json').version")" = "$VERSION"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Frozen release candidate: v$VERSION @ $SHA"

      - name: Release-note policy focused evidence
        run: node tests/release-notes-contract.mjs && node tests/release-prepare-contract.mjs && node tests/release-publish-contract.mjs

      - name: Cancel superseded release-prepare-owned validation
        uses: actions/github-script@v9
        env:
          SHA: ${{ steps.freeze.outputs.sha }}
        with:
          script: |
            const sha=process.env.SHA.toLowerCase();
            const {owner,repo}=context.repo;
            const managed=[
              'ci.yml',
              'pages-source.yml',
              'pages.yml',
              'session-handshake.yml',
              'real-qb-full.yml',
              'real-qb-locale.yml',
              'candidate-deployment-only.yml',
              'release-prepare.yml'
            ];
            const active=new Set(['queued','in_progress','pending','requested','waiting']);
            for(const workflow_id of managed){
              const runs=await github.paginate(github.rest.actions.listWorkflowRuns,{owner,repo,workflow_id,branch:'dev',per_page:100});
              for(const run of runs){
                if(run.id===context.runId)continue;
                if(run.event!=='workflow_dispatch')continue;
                if(run.head_sha?.toLowerCase()===sha)continue;
                if(!active.has(run.status))continue;
                core.info(`Cancel superseded ${workflow_id} run #${run.run_number} at ${run.head_sha}; current frozen SHA is ${sha}.`);
                await github.rest.actions.cancelWorkflowRun({owner,repo,run_id:run.id});
              }
            }

      - name: Dispatch exact-SHA release-grade validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.freeze.outputs.sha }}
        run: |
          set -euo pipefail
          dispatch() {
            local workflow="$1" payload="$2"
            printf '%s' "$payload" | gh api --method POST "/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/dispatches" --input -
            echo "Dispatched $workflow for $SHA"
          }
          dispatch ci.yml "$(jq -n --arg ref dev '{ref:$ref,inputs:{validation_mode:"candidate"}}')"
          dispatch pages-source.yml "$(jq -n --arg ref dev '{ref:$ref,inputs:{mode:"pages"}}')"
          dispatch session-handshake.yml "$(jq -n --arg ref dev '{ref:$ref}')"
          dispatch real-qb-full.yml "$(jq -n --arg ref dev --arg sha "$SHA" '{ref:$ref,inputs:{candidate_sha:$sha,confirmation:"RUN-FULL-FROZEN-65"}}')"
          dispatch real-qb-locale.yml "$(jq -n --arg ref dev '{ref:$ref}')"

      - name: Wait for exact-SHA release evidence
        id: evidence
        uses: actions/github-script@v9
        env:
          SHA: ${{ steps.freeze.outputs.sha }}
        with:
          script: |
            const sha=process.env.SHA.toLowerCase();
            const {owner,repo}=context.repo;
            const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
            const specs=[
              {key:'ordinary_ci',workflow:'ci.yml',event:'push'},
              {key:'candidate_ci',workflow:'ci.yml',event:'workflow_dispatch',artifact:`release-candidate-${sha}`},
              {key:'pages_source',workflow:'pages-source.yml',event:'workflow_dispatch'},
              {key:'pages',workflow:'pages.yml',event:'workflow_dispatch'},
              {key:'session',workflow:'session-handshake.yml',event:'workflow_dispatch'},
              {key:'full',workflow:'real-qb-full.yml',event:'workflow_dispatch',artifact:`real-qb-full-aggregate-${sha}`},
              {key:'locale',workflow:'real-qb-locale.yml',event:'workflow_dispatch',artifact:`real-qb-current-locale-aggregate-${sha}`},
              {key:'deployment',workflow:'candidate-deployment-only.yml',event:'workflow_dispatch',artifact:`candidate-deployment-${sha}`}
            ];
            async function runsFor(spec){
              const runs=await github.paginate(github.rest.actions.listWorkflowRuns,{owner,repo,workflow_id:spec.workflow,branch:'dev',per_page:100});
              return runs.filter(run=>run.head_sha?.toLowerCase()===sha&&run.event===spec.event);
            }
            async function artifactFor(run,name){
              if(!name)return true;
              const artifacts=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{owner,repo,run_id:run.id,per_page:100});
              return artifacts.find(item=>item.name===name&&!item.expired)||null;
            }
            const deadline=Date.now()+165*60*1000;
            const resolved={};
            while(Date.now()<deadline){
              const dev=await github.rest.repos.getBranch({owner,repo,branch:'dev'});
              if(dev.data.commit.sha.toLowerCase()!==sha){core.setFailed(`dev moved from frozen ${sha} to ${dev.data.commit.sha}; prepare is stale.`);return;}
              let all=true;
              for(const spec of specs){
                if(resolved[spec.key])continue;
                const runs=await runsFor(spec);
                let found=null;
                for(const run of runs.filter(run=>run.conclusion==='success')){
                  const artifact=await artifactFor(run,spec.artifact);
                  if(artifact){found={run,artifact};break;}
                }
                if(found){
                  resolved[spec.key]=found;
                  core.info(`${spec.key} PASS via run #${found.run.run_number}`);
                  continue;
                }
                const active=runs.some(run=>['queued','in_progress','pending','requested','waiting'].includes(run.status));
                const newest=runs[0];
                if(!active&&newest?.status==='completed'&&newest.conclusion&&newest.conclusion!=='success'&&newest.conclusion!=='skipped'){
                  core.setFailed(`${spec.key} failed on exact SHA ${sha}: ${newest.html_url}`);return;
                }
                all=false;
              }
              if(all)break;
              await sleep(15000);
            }
            for(const spec of specs){if(!resolved[spec.key]){core.setFailed(`Timed out waiting for ${spec.key} on ${sha}`);return;}}
            core.setOutput('candidate_run_id',String(resolved.candidate_ci.run.id));
            core.setOutput('candidate_artifact',`release-candidate-${sha}`);
            const summary=Object.fromEntries(specs.map(spec=>[spec.key,{runId:resolved[spec.key].run.id,runNumber:resolved[spec.key].run.run_number,url:resolved[spec.key].run.html_url}]));
            require('fs').writeFileSync('release-evidence.json',JSON.stringify({schemaVersion:1,kind:'weig-release-prepare',sha,summary},null,2)+'\n');

      - name: Download exact candidate identity
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.evidence.outputs.candidate_artifact }}
          path: candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.evidence.outputs.candidate_run_id }}

      - name: Generate exact-SHA release preview
        shell: bash
        env:
          SHA: ${{ steps.freeze.outputs.sha }}
          VERSION: ${{ steps.freeze.outputs.version }}
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < candidate/CANDIDATE_SHA)" = "$SHA"
          (cd candidate && sha256sum -c SHA256SUMS)
          PACKAGE_SHA="$(sha256sum candidate/weig-qb-webui.zip | awk '{print $1}')"
          TAR_SHA="$(sha256sum candidate/weig-qb-webui.tar.gz | awk '{print $1}')"
          MANIFEST_SHA="$(sha256sum candidate/manifest.json | awk '{print $1}')"
          node tools/release-notes.mjs \
            --to "$SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --image-ref "$SHA" \
            --out release-notes-preview.md
          {
            echo "# WeiG qB WebUI $VERSION · Release Preview"
            echo
            echo "- FINAL_DEV_SHA: \`$SHA\`"
            echo "- Candidate ZIP SHA256: \`$PACKAGE_SHA\`"
            echo "- Candidate tar.gz SHA256: \`$TAR_SHA\`"
            echo "- Candidate manifest SHA256: \`$MANIFEST_SHA\`"
            echo "- CI / Pages / Candidate / Deployment / Session / Full Frozen 65 / Locale 61: PASS"
            echo
            cat release-notes-preview.md
          } > release-preview.md

      - name: Upload release preview
        uses: actions/upload-artifact@v7
        with:
          name: release-preview-${{ steps.freeze.outputs.sha }}
          path: |
            release-preview.md
            release-notes-preview.md
            release-evidence.json
            candidate/SHA256SUMS
            candidate/CANDIDATE_SHA
          if-no-files-found: error
          retention-days: 90

      - name: Prepare summary
        run: |
          echo "Release preparation PASS for v${{ steps.freeze.outputs.version }} @ ${{ steps.freeze.outputs.sha }}"
          echo "No main, tag, or GitHub Release was changed. Human chat confirmation is still required before publish."
