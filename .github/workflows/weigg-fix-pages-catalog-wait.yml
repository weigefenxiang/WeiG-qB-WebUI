name: Fix Pages catalog readiness wait

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/weigg-fix-pages-catalog-wait.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    env:
      PRE_SHA: d3ea4080729c7812aae2e38f00107f08bcb19026
      PRE_TREE: cc4de70f3fa4e2467f7ece9b2b528bde209ea505
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Patch settled catalog readiness wait and validate
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PRE_SHA" HEAD
          test "$(git rev-parse "$PRE_SHA^{tree}")" = "$PRE_TREE"
          mapfile -t changed < <(git diff --name-only "$PRE_SHA" HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/weigg-fix-pages-catalog-wait.yml'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/pages-live-acceptance.mjs')
          s=p.read_text()
          old="    ()=>Boolean(window.WeiG?.AppState?.catalogReady||window.WeiG?.AppState?.catalogError),"
          new="    ()=>Boolean(window.WeiG?.AppState?.catalogError||(window.WeiG?.AppState?.catalogReady&&!window.WeiG?.AppState?.catalogBusy)),"
          if s.count(old) != 1:
              raise SystemExit(f'expected one catalog wait anchor, found {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          git diff --check
          node --check tests/pages-live-acceptance.mjs
          npm ci --no-audit --no-fund --prefer-offline
          npm test
      - name: Create clean final candidate commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          encoded="$(base64 -w0 tests/pages-live-acceptance.mjs)"
          payload="$(jq -n --arg content "$encoded" '{content:$content,encoding:"base64"}')"
          BLOB="$(gh api --method POST "/repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq '.sha' <<<"$payload")"
          tree_payload="$(jq -n --arg base "$PRE_TREE" --arg blob "$BLOB" '{base_tree:$base,tree:[{path:"tests/pages-live-acceptance.mjs",mode:"100644",type:"blob",sha:$blob}]}')"
          TREE="$(gh api --method POST "/repos/$GITHUB_REPOSITORY/git/trees" --input - --jq '.sha' <<<"$tree_payload")"
          commit_payload="$(jq -n --arg message 'test: wait for settled catalog readiness [candidate]' --arg tree "$TREE" --arg parent "$GITHUB_SHA" '{message:$message,tree:$tree,parents:[$parent]}')"
          COMMIT="$(gh api --method POST "/repos/$GITHUB_REPOSITORY/git/commits" --input - --jq '.sha' <<<"$commit_payload")"
          echo "FINAL_TREE=$TREE"
          echo "FINAL_COMMIT=$COMMIT"
