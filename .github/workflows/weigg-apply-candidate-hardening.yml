name: Apply candidate hardening and qB parallel CI

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/weigg-apply-candidate-hardening.yml'

permissions:
  contents: write

jobs:
  validate_linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Apply deterministic candidate patch
        run: |
          set -euo pipefail
          git show 680e28d3b8d34cc7634101c70890ae788fa19c9b:tools/qb-locale-source.mjs > tools/qb-locale-source.mjs
          python .weigg-apply/patch-candidate-hardening.py
          python - <<'PY'
          from pathlib import Path

          ci_path = Path('tests/ci-contract.mjs')
          ci = ci_path.read_text(encoding='utf-8')
          old = "releaseBase.includes('from 4.1.0')"
          new = "releaseBase.includes('4.1.0 to latest stable catalog')"
          if ci.count(old) != 1:
              raise SystemExit(f'expected one qB base-catalog wording assertion, found {ci.count(old)}')
          ci_path.write_text(ci.replace(old, new), encoding='utf-8')

          sh_path = Path('installers/install.sh')
          sh = sh_path.read_text(encoding='utf-8')
          old_header = "validate_qb_webui_config_file() {\n  cfg=$1\n  expected_root=${2-}\n  require_values=${3:-0}\n"
          new_header = "validate_qb_webui_config_file() {\n  validate_cfg=$1\n  validate_expected_root=${2-}\n  validate_require_values=${3:-0}\n"
          if sh.count(old_header) != 1:
              raise SystemExit(f'expected one Linux qB validator header, found {sh.count(old_header)}')
          sh = sh.replace(old_header, new_header)
          start = sh.index('validate_qb_webui_config_file() {')
          end = sh.index('\n}\n\nconfigure_qb_webui_file() {', start) + 3
          block = sh[start:end]
          block = block.replace('$expected_root', '$validate_expected_root')
          block = block.replace('$require_values', '$validate_require_values')
          block = block.replace('$cfg', '$validate_cfg')
          sh = sh[:start] + block + sh[end:]
          sh_path.write_text(sh, encoding='utf-8')

          platform_path = Path('tests/platform-contract.mjs')
          platform = platform_path.read_text(encoding='utf-8')
          old_platform = r"assert.match(sh,/WebUI\\\\RootFolder=%s/,'Linux installer must persist qB-visible RootFolder');"
          new_platform = r"assert.match(sh,/WebUI\\\\RootFolder=/,'Linux installer must persist qB-visible RootFolder');"
          if platform.count(old_platform) != 1:
              raise SystemExit(f'expected one legacy Linux RootFolder source-shape assertion, found {platform.count(old_platform)}')
          platform_path.write_text(platform.replace(old_platform, new_platform), encoding='utf-8')
          PY
          rm -f .weigg-apply/patch-candidate-hardening.py
          rm -f .github/workflows/weigg-fix-windows-fixture.yml
          rm -f .github/workflows/weigg-apply-candidate-hardening.yml
          git diff --check
      - name: Validate Linux, Node and CI contracts
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund --prefer-offline
          node --check tools/qb-locale-source.mjs
          node tests/qb-locale-source-contract.mjs
          node tests/ci-contract.mjs
          bash tests/linux-config-section.sh
          npm test

  validate_windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Apply the same deterministic candidate patch
        shell: bash
        run: |
          set -euo pipefail
          git show 680e28d3b8d34cc7634101c70890ae788fa19c9b:tools/qb-locale-source.mjs > tools/qb-locale-source.mjs
          python .weigg-apply/patch-candidate-hardening.py
          python - <<'PY'
          from pathlib import Path

          ci_path = Path('tests/ci-contract.mjs')
          ci = ci_path.read_text(encoding='utf-8')
          old = "releaseBase.includes('from 4.1.0')"
          new = "releaseBase.includes('4.1.0 to latest stable catalog')"
          if ci.count(old) != 1:
              raise SystemExit(f'expected one qB base-catalog wording assertion, found {ci.count(old)}')
          ci_path.write_text(ci.replace(old, new), encoding='utf-8')

          sh_path = Path('installers/install.sh')
          sh = sh_path.read_text(encoding='utf-8')
          old_header = "validate_qb_webui_config_file() {\n  cfg=$1\n  expected_root=${2-}\n  require_values=${3:-0}\n"
          new_header = "validate_qb_webui_config_file() {\n  validate_cfg=$1\n  validate_expected_root=${2-}\n  validate_require_values=${3:-0}\n"
          if sh.count(old_header) != 1:
              raise SystemExit(f'expected one Linux qB validator header, found {sh.count(old_header)}')
          sh = sh.replace(old_header, new_header)
          start = sh.index('validate_qb_webui_config_file() {')
          end = sh.index('\n}\n\nconfigure_qb_webui_file() {', start) + 3
          block = sh[start:end]
          block = block.replace('$expected_root', '$validate_expected_root')
          block = block.replace('$require_values', '$validate_require_values')
          block = block.replace('$cfg', '$validate_cfg')
          sh = sh[:start] + block + sh[end:]
          sh_path.write_text(sh, encoding='utf-8')

          platform_path = Path('tests/platform-contract.mjs')
          platform = platform_path.read_text(encoding='utf-8')
          old_platform = r"assert.match(sh,/WebUI\\\\RootFolder=%s/,'Linux installer must persist qB-visible RootFolder');"
          new_platform = r"assert.match(sh,/WebUI\\\\RootFolder=/,'Linux installer must persist qB-visible RootFolder');"
          if platform.count(old_platform) != 1:
              raise SystemExit(f'expected one legacy Linux RootFolder source-shape assertion, found {platform.count(old_platform)}')
          platform_path.write_text(platform.replace(old_platform, new_platform), encoding='utf-8')
          PY
          rm -f .weigg-apply/patch-candidate-hardening.py
          rm -f .github/workflows/weigg-fix-windows-fixture.yml
          rm -f .github/workflows/weigg-apply-candidate-hardening.yml
          git diff --check
      - name: Validate Windows PowerShell 5.1 qB safety contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File 'tests\windows-config-encoding.ps1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate Node contracts on Windows
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          npm.cmd ci --no-audit --no-fund --prefer-offline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/qb-locale-source-contract.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/ci-contract.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  commit:
    runs-on: ubuntu-24.04
    needs: [validate_linux, validate_windows]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reapply exact validated patch and commit
        run: |
          set -euo pipefail
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "$GITHUB_SHA"
          git show 680e28d3b8d34cc7634101c70890ae788fa19c9b:tools/qb-locale-source.mjs > tools/qb-locale-source.mjs
          python .weigg-apply/patch-candidate-hardening.py
          python - <<'PY'
          from pathlib import Path

          ci_path = Path('tests/ci-contract.mjs')
          ci = ci_path.read_text(encoding='utf-8')
          old = "releaseBase.includes('from 4.1.0')"
          new = "releaseBase.includes('4.1.0 to latest stable catalog')"
          if ci.count(old) != 1:
              raise SystemExit(f'expected one qB base-catalog wording assertion, found {ci.count(old)}')
          ci_path.write_text(ci.replace(old, new), encoding='utf-8')

          sh_path = Path('installers/install.sh')
          sh = sh_path.read_text(encoding='utf-8')
          old_header = "validate_qb_webui_config_file() {\n  cfg=$1\n  expected_root=${2-}\n  require_values=${3:-0}\n"
          new_header = "validate_qb_webui_config_file() {\n  validate_cfg=$1\n  validate_expected_root=${2-}\n  validate_require_values=${3:-0}\n"
          if sh.count(old_header) != 1:
              raise SystemExit(f'expected one Linux qB validator header, found {sh.count(old_header)}')
          sh = sh.replace(old_header, new_header)
          start = sh.index('validate_qb_webui_config_file() {')
          end = sh.index('\n}\n\nconfigure_qb_webui_file() {', start) + 3
          block = sh[start:end]
          block = block.replace('$expected_root', '$validate_expected_root')
          block = block.replace('$require_values', '$validate_require_values')
          block = block.replace('$cfg', '$validate_cfg')
          sh = sh[:start] + block + sh[end:]
          sh_path.write_text(sh, encoding='utf-8')

          platform_path = Path('tests/platform-contract.mjs')
          platform = platform_path.read_text(encoding='utf-8')
          old_platform = r"assert.match(sh,/WebUI\\\\RootFolder=%s/,'Linux installer must persist qB-visible RootFolder');"
          new_platform = r"assert.match(sh,/WebUI\\\\RootFolder=/,'Linux installer must persist qB-visible RootFolder');"
          if platform.count(old_platform) != 1:
              raise SystemExit(f'expected one legacy Linux RootFolder source-shape assertion, found {platform.count(old_platform)}')
          platform_path.write_text(platform.replace(old_platform, new_platform), encoding='utf-8')
          PY
          rm -f .weigg-apply/patch-candidate-hardening.py
          rm -f .github/workflows/weigg-fix-windows-fixture.yml
          rm -f .github/workflows/weigg-apply-candidate-hardening.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No changes to commit' >&2; exit 1; }
          git commit -m 'fix: enforce qB config ownership and parallelize full audit [candidate]'
          git push origin HEAD:dev
