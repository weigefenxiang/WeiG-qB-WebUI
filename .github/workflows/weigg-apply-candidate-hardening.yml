name: Export verified candidate payload

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/weigg-apply-candidate-hardening.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Rebuild exact previously verified candidate
        run: |
          set -euo pipefail
          git show 680e28d3b8d34cc7634101c70890ae788fa19c9b:tools/qb-locale-source.mjs > tools/qb-locale-source.mjs
          python .weigg-apply/patch-candidate-hardening.py
          python .weigg-apply/post-candidate-adapter.py
          rm -f .weigg-apply/patch-candidate-hardening.py .weigg-apply/post-candidate-adapter.py
          rmdir .weigg-apply 2>/dev/null || true
          rm -f .github/workflows/weigg-fix-windows-fixture.yml
          rm -f .github/workflows/weigg-apply-candidate-hardening.yml
          git diff --check
          git add -A
          git diff --cached --name-status > candidate-status.txt
          git diff --cached --name-only --diff-filter=D > candidate-delete.txt
          git diff --cached --name-only --diff-filter=ACMRTUXB -z > /tmp/candidate-files.z
          if [ -s /tmp/candidate-files.z ]; then
            xargs -0 git ls-files -s -- < /tmp/candidate-files.z > candidate-index.txt
            tar --null -T /tmp/candidate-files.z -czf candidate-files.tar.gz
          else
            : > candidate-index.txt
            tar -czf candidate-files.tar.gz --files-from /dev/null
          fi
          git diff --cached --binary > candidate.patch
          printf '%s\n' "$GITHUB_SHA" > candidate-parent.txt
          cat candidate-status.txt
      - uses: actions/upload-artifact@v7
        with:
          name: verified-candidate-${{ github.sha }}
          path: |
            candidate-files.tar.gz
            candidate-delete.txt
            candidate-index.txt
            candidate-status.txt
            candidate.patch
            candidate-parent.txt
          if-no-files-found: error
          retention-days: 1
