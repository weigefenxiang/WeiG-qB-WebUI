name: Dev bootstrap 0.3.101 settings grid fix

on:
  push:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: dev-bootstrap-0.3.101-grid
  cancel-in-progress: false

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'chore: bootstrap 0.3.101 settings grid fix' }}"
    runs-on: ubuntu-24.04
    env:
      EXPECTED_PARENT: 76f7536b9d79dce7eba2177b6a8e994bb6e6d5e4
      BASE_PRODUCT_SHA: 76f7536b9d79dce7eba2177b6a8e994bb6e6d5e4
      PAYLOAD_SHA256: 49f42e67f3cfc217e0bdb8416b2f0889128ee5a3bf44d9423ebd765cfd8973e4
      WEIGG_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify exact bootstrap source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev"
          test "$(git rev-parse "$GITHUB_SHA^")" = "$EXPECTED_PARENT"

      - name: Reassemble exact final tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .weigg-bootstrap/0.3.101-grid -maxdepth 1 -type f -name 'part-*' | wc -l)" -eq 4
          cat .weigg-bootstrap/0.3.101-grid/part-* > /tmp/fix-03101.tar.xz
          printf '%s  %s\n' "$PAYLOAD_SHA256" /tmp/fix-03101.tar.xz | sha256sum -c -
          tar -xJf /tmp/fix-03101.tar.xz -C .
          rm -rf .weigg-bootstrap
          rm -f .github/workflows/dev-bootstrap-0.3.101.yml

      - name: Validate repository and browser regression
        shell: bash
        run: |
          set -euo pipefail
          node --check webui/private/scripts/settings.js
          npm ci --no-audit --no-fund --prefer-offline
          npm test
          command -v google-chrome >/dev/null
          google-chrome --version
          node tests/browser-runtime.mjs
          sh -n installers/install.sh
          bash tests/linux-config-section.sh
          sh -n tests/live.sh
          bash -n tests/live-api.sh
          git diff --check "$BASE_PRODUCT_SHA" --

      - name: Finalize exact dev product commit
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected-files <<'EOF'
          VERSION
          package-lock.json
          package.json
          webui/VERSION
          webui/private/css/settings.css
          webui/private/scripts/settings.js
          EOF
          LC_ALL=C sort -o /tmp/expected-files /tmp/expected-files
          git -c core.quotePath=false diff --name-only "$BASE_PRODUCT_SHA" -- | LC_ALL=C sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files

          test "$(cat VERSION)" = "0.3.101"
          test "$(cat webui/VERSION)" = "0.3.101"
          test "$(node -p "require('./package.json').version")" = "0.3.101"
          test "$(node -p "require('./package-lock.json').version")" = "0.3.101"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "0.3.101"

          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "$GITHUB_SHA"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: keep compound settings rows in grid cells [ui]"
          git push origin HEAD:dev
