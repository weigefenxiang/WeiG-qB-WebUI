name: A62 Focused

on:
  push:
    branches:
      - fix-A62

permissions:
  contents: write

concurrency:
  group: a62-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Materialize deterministic gzip fallback owner
        run: node tools/a62-copy-gzip-prototype.mjs --in-place
      - name: A62 focused contracts
        run: |
          node tests/syntax-contract.mjs
          node tests/runtime-contract.mjs
          node tests/capability-contract.mjs
          node tests/private-bootstrap-contract.mjs
          node tests/route-module-loading-contract.mjs
          node tests/a62-runtime-asset-budget-contract.mjs
          node tests/i18n-runtime-owner-contract.mjs
          node tests/qb-weig-locale-sharding-contract.mjs
          node tests/qb-runtime-copy-materialization-contract.mjs tests/fixtures/qb-release-catalog.lkg.json webui/private/data
          node tests/qb-copy-sharding-repo-contract.mjs
          node tests/qb-copy-semantic-fingerprint-contract.mjs
          node tests/qb-qm-first-routing-contract.mjs
          node audits/qb-settings-native-bundle-contract.mjs
          node audits/qb-webui-catalog-contract.mjs
          node tests/qb-locale-pipeline-contract.mjs
          node tests/distribution-artifact-set-contract.mjs
          node tests/dev-distribution-contract.mjs
          node tests/change-classifier-contract.mjs
          node tests/pages-cache-freshness-contract.mjs

      - name: SAFE-REF materialize gzip outputs
        shell: bash
        run: |
          set -euo pipefail
          git add -A webui/private/data/qb-copy-fallback
          if git diff --cached --quiet; then
            exit 0
          fi
          remote_sha="$(git ls-remote origin refs/heads/fix-A62 | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "a62.7: materialize gzip fallback owner"
          git push origin HEAD:fix-A62

  browser:
    name: browser · ${{ matrix.suite.name }}
    needs: focused
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        suite:
          - name: route-modules
            script: tests/browser-route-module-loading.mjs
          - name: runtime
            script: tests/browser-runtime.mjs
          - name: settings-fidelity
            script: tests/browser-settings-fidelity.mjs
          - name: feature-parity
            script: tests/browser-feature-parity.mjs
          - name: torrent-workspace
            script: tests/browser-torrent-workspace.mjs
          - name: adaptive-ui
            script: tests/browser-adaptive-ui.mjs
    env:
      WEIG_BROWSER_CHANNEL: chrome
      WEIG_BROWSER_FETCH_TIMEOUT_MS: '15000'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund --prefer-offline
      - name: Materialize deterministic gzip fallback owner
        run: node tools/a62-copy-gzip-prototype.mjs --in-place
      - name: Verify hosted Chrome
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome >/dev/null
          google-chrome --version
          node -p "require('playwright/package.json').version"
      - name: A62 representative browser acceptance
        run: node "${{ matrix.suite.script }}"
