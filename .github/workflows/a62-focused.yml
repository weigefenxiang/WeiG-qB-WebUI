name: A62 Focused

on:
  push:
    branches:
      - fix-A62

permissions:
  contents: read

concurrency:
  group: a62-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: A62 focused contracts
        run: |
          node tests/syntax-contract.mjs
          node tests/runtime-contract.mjs
          node tests/private-bootstrap-contract.mjs
          node tests/i18n-runtime-owner-contract.mjs
          node tests/qb-runtime-copy-materialization-contract.mjs webui/private/data/qb-releases.json webui/private/data/qb-settings-native.txt
