name: Installer Lifecycle

on:
  push:
    branches:
      - dev
    paths:
      - 'installers/**'
      - 'webui/**'
      - 'tools/qb-webui-catalog.mjs'
      - 'tests/fixtures/qb-release-catalog.lkg.json'
      - 'tests/installer-lifecycle.sh'
      - 'tests/installer-lifecycle.ps1'
      - 'tests/installer-docker-lifecycle.sh'
      - 'tests/installer-lifecycle-browser.mjs'
      - 'tests/browser-driver.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/install-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux install upgrade rollback
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Installer syntax
        run: sh -n installers/install.sh
      - name: Isolated install upgrade rollback lifecycle
        shell: bash
        run: bash tests/installer-lifecycle.sh
      - name: Upload exact-SHA lifecycle evidence
        uses: actions/upload-artifact@v7
        with:
          name: linux-installer-lifecycle-${{ github.sha }}
          path: artifacts/install-lifecycle/linux.json
          if-no-files-found: error
          retention-days: 30

  docker:
    name: Official qB Docker install upgrade rollback
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install browser test dependency
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Verify hosted Chrome runtime
        run: |
          set -euo pipefail
          command -v google-chrome >/dev/null || { echo 'Hosted Google Chrome Stable is missing.' >&2; exit 1; }
          google-chrome --version
          node -p "require('playwright/package.json').version"
      - name: Docker lifecycle syntax
        run: |
          bash -n tests/installer-docker-lifecycle.sh
          node --check tests/installer-lifecycle-browser.mjs
      - name: Official qB Docker install upgrade rollback lifecycle
        shell: bash
        run: bash tests/installer-docker-lifecycle.sh
      - name: Upload exact-SHA lifecycle evidence
        uses: actions/upload-artifact@v7
        with:
          name: docker-installer-lifecycle-${{ github.sha }}
          path: artifacts/install-lifecycle/docker.json
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows install upgrade rollback
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Installer syntax
        shell: pwsh
        run: |
          $null = [scriptblock]::Create((Get-Content 'installers/install.ps1' -Raw))
          $null = [scriptblock]::Create((Get-Content 'tests/installer-lifecycle.ps1' -Raw))
          Write-Host 'Windows installer lifecycle syntax parsed.'
      - name: Isolated install upgrade rollback lifecycle
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File tests/installer-lifecycle.ps1
      - name: Upload exact-SHA lifecycle evidence
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-lifecycle-${{ github.sha }}
          path: artifacts/install-lifecycle/windows.json
          if-no-files-found: error
          retention-days: 30
