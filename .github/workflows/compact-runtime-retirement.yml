name: Compact runtime closure

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/compact-runtime-retirement.yml'

permissions:
  contents: write

env:
  EXPECTED_PARENT: ${{ github.sha }}

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Verify exact dev owner
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/dev'
          test "$(git rev-parse HEAD)" = "$EXPECTED_PARENT"
          test "$(cat VERSION)" = '0.3.99'
          test -f .bootstrap/close_0_3_99.py
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Apply current-authority closure
        shell: bash
        run: |
          set -euo pipefail
          python3 .bootstrap/close_0_3_99.py
      - name: Enforce closure boundaries
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .bootstrap/close_0_3_99.py
          test ! -e .bootstrap/0.3.99
          test ! -e webui/private/scripts/release-profile.js
          test ! -e webui/private/data/qb-releases.json
          test ! -e webui/private/data/qb-release-profiles
          grep -q "runtimeCompatibility!=='compact-contracts-only'" .github/workflows/pages.yml
          grep -q 'test ! -e "$RUNNER_TEMP/virtual-qb-site/dev/app/__source/private/data/qb-releases.json"' .github/workflows/pages.yml
      - name: Validate final closure tree
        shell: bash
        run: |
          set -euo pipefail
          git add -u
          git diff --cached --check
          npm test
          node tests/release-compat.mjs
      - name: Commit docs and bootstrap cleanup
        shell: bash
        run: |
          set -euo pipefail
          git add -u
          git restore --staged .github/workflows/pages.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Closure produced no non-workflow changes.' >&2
            exit 1
          fi
          REMOTE_SHA="$(git ls-remote origin refs/heads/dev | awk '{print $1}')"
          if [ "$REMOTE_SHA" != "$EXPECTED_PARENT" ]; then
            echo "Refusing stale write: expected dev=$EXPECTED_PARENT actual=$REMOTE_SHA" >&2
            exit 1
          fi
          git config user.name 'weigefenxiang'
          git config user.email '119787190+weigefenxiang@users.noreply.github.com'
          git commit -m 'docs: close compact runtime migration'
          git push origin HEAD:dev
          echo "Committed docs/bootstrap closure $(git rev-parse HEAD)"
