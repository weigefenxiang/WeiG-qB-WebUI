name: Render exact-SHA candidate installer supply chain

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/weigg-exact-candidate-installers.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify staging contains no product changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 6458bed31fefb44c9ab0b7dca6dccb02b7a117ed "$GITHUB_SHA"
          git diff --quiet 6458bed31fefb44c9ab0b7dca6dccb02b7a117ed "$GITHUB_SHA" -- . \
            ':(exclude).github/workflows/weigg-exact-candidate-installers.yml' \
            ':(exclude).weigg-apply/**'
          test -s .weigg-apply/exact_candidate_patch.py

      - name: Patch, validate, and render exact files
        shell: bash
        run: |
          set -euo pipefail
          python3 .weigg-apply/exact_candidate_patch.py
          git diff --check
          bash -n tests/candidate-deployment.sh
          bash -n tests/promotion-release-rehearsal.sh
          bash -n installers/install.sh
          node --check tests/release-candidate-evidence.mjs
          grep -Fq 'sha256sum WeiG-qB-WebUI.zip weigg-install.sh weigg-install.ps1 > SHA256SUMS' .github/workflows/ci.yml
          grep -Fq 'bash "$LINUX_INSTALLER" --version "$VERSION" --configure' tests/candidate-deployment.sh
          grep -Fq 'exactCandidateInstallers:true' tests/candidate-deployment.sh
          grep -Fq 'releaseInstallerByteIdentity:true' tests/promotion-release-rehearsal.sh
          grep -Fq "schemaVersion===2" tests/release-candidate-evidence.mjs
          grep -Fq 'candidate/weigg-install.ps1' .github/workflows/promote.yml
          grep -Fq 'release/weigg-install.ps1' .github/workflows/release.yml
          rm -rf "$RUNNER_TEMP/weigg-rendered"
          mkdir -p "$RUNNER_TEMP/weigg-rendered"
          cp .github/workflows/ci.yml "$RUNNER_TEMP/weigg-rendered/ci.yml"
          cp .github/workflows/promote.yml "$RUNNER_TEMP/weigg-rendered/promote.yml"
          cp .github/workflows/release.yml "$RUNNER_TEMP/weigg-rendered/release.yml"
          cp tests/candidate-deployment.sh "$RUNNER_TEMP/weigg-rendered/candidate-deployment.sh"
          cp tests/promotion-release-rehearsal.sh "$RUNNER_TEMP/weigg-rendered/promotion-release-rehearsal.sh"
          cp tests/release-candidate-evidence.mjs "$RUNNER_TEMP/weigg-rendered/release-candidate-evidence.mjs"
          sha256sum "$RUNNER_TEMP"/weigg-rendered/*

          git reset --hard "$GITHUB_SHA"
          rm -rf .weigg-apply/rendered
          mkdir -p .weigg-apply/rendered
          for file in "$RUNNER_TEMP"/weigg-rendered/*; do
            name=$(basename "$file")
            base64 -w0 "$file" > ".weigg-apply/rendered/$name.b64"
            sha256sum "$file" | awk '{print $1}' > ".weigg-apply/rendered/$name.sha256"
          done

      - name: Push only validated render staging data
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .weigg-apply/rendered
          git diff --cached --quiet && { echo 'No rendered files to stage.' >&2; exit 1; }
          git commit -m 'chore: stage validated supply-chain render'
          git push origin HEAD:dev
