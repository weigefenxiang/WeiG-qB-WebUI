name: Assemble exact-SHA candidate installer supply chain

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/weigg-exact-candidate-installers.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify validated render staging
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 6458bed31fefb44c9ab0b7dca6dccb02b7a117ed "$GITHUB_SHA"
          git diff --quiet 6458bed31fefb44c9ab0b7dca6dccb02b7a117ed "$GITHUB_SHA" -- . \
            ':(exclude).github/workflows/weigg-exact-candidate-installers.yml' \
            ':(exclude).weigg-apply/**'
          for name in ci.yml promote.yml release.yml candidate-deployment.sh promotion-release-rehearsal.sh release-candidate-evidence.mjs; do
            test -s ".weigg-apply/rendered/$name.b64"
            test -s ".weigg-apply/rendered/$name.sha256"
            base64 -d ".weigg-apply/rendered/$name.b64" > "$RUNNER_TEMP/$name"
            test "$(sha256sum "$RUNNER_TEMP/$name" | awk '{print $1}')" = "$(tr -d '\r\n' < ".weigg-apply/rendered/$name.sha256")"
          done
          bash -n "$RUNNER_TEMP/candidate-deployment.sh"
          bash -n "$RUNNER_TEMP/promotion-release-rehearsal.sh"
          node --check "$RUNNER_TEMP/release-candidate-evidence.mjs"

      - name: Create unattached exact final Git commit
        id: final
        shell: bash
        run: |
          set -euo pipefail
          entries='[]'
          add_blob() {
            local staged="$1" target="$2" mode blob payload
            mode=$(git ls-files -s "$target" | awk '{print $1}')
            test -n "$mode"
            jq -n --arg content "$(cat ".weigg-apply/rendered/$staged.b64")" '{content:$content,encoding:"base64"}' > "$RUNNER_TEMP/blob.json"
            blob=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$RUNNER_TEMP/blob.json" --jq .sha)
            test "$blob" = "$(git hash-object "$RUNNER_TEMP/$staged")"
            entries=$(jq -c --arg path "$target" --arg mode "$mode" --arg sha "$blob" '. + [{path:$path,mode:$mode,type:"blob",sha:$sha}]' <<<"$entries")
          }
          add_blob ci.yml .github/workflows/ci.yml
          add_blob promote.yml .github/workflows/promote.yml
          add_blob release.yml .github/workflows/release.yml
          add_blob candidate-deployment.sh tests/candidate-deployment.sh
          add_blob promotion-release-rehearsal.sh tests/promotion-release-rehearsal.sh
          add_blob release-candidate-evidence.mjs tests/release-candidate-evidence.mjs

          while IFS= read -r path; do
            test -n "$path" || continue
            mode=$(git ls-files -s "$path" | awk '{print $1}')
            entries=$(jq -c --arg path "$path" --arg mode "$mode" '. + [{path:$path,mode:$mode,type:"blob",sha:null}]' <<<"$entries")
          done < <(printf '%s\n' '.github/workflows/weigg-exact-candidate-installers.yml'; git ls-files .weigg-apply)

          base_tree=$(git rev-parse "$GITHUB_SHA^{tree}")
          jq -n --arg base "$base_tree" --argjson tree "$entries" '{base_tree:$base,tree:$tree}' > "$RUNNER_TEMP/tree.json"
          tree_sha=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/trees" --input "$RUNNER_TEMP/tree.json" --jq .sha)
          jq -n --arg message 'ci: seal exact-SHA candidate installers' --arg tree "$tree_sha" --arg parent "$GITHUB_SHA" '{message:$message,tree:$tree,parents:[$parent]}' > "$RUNNER_TEMP/commit.json"
          final_sha=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/commits" --input "$RUNNER_TEMP/commit.json" --jq .sha)
          test -n "$final_sha"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$final_sha" --jq .parents[0].sha)" = "$GITHUB_SHA"
          printf 'FINAL_TREE_SHA=%s\n' "$tree_sha"
          printf 'FINAL_COMMIT_SHA=%s\n' "$final_sha"
