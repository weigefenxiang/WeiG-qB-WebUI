name: Virtual qB Pages

on:
  workflow_dispatch:
    inputs:
      validation_profile:
        description: Live validation profile
        required: false
        default: full
        type: choice
        options:
          - full
          - installer
          - payload
          - ui
          - settings
          - native
      force_deploy:
        description: Force a fresh Pages deployment even when this exact SHA is already live
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  # One owner may publish at a time. Never cancel an in-flight deploy-pages call: cancellation
  # cannot atomically revoke an external Pages write, so queued newer owners must publish after it.
  group: virtual-qb-pages-dispatch
  cancel-in-progress: false

env:
  # workflow_dispatch is deliberately run on dev/main itself. For this event GitHub sets
  # GITHUB_SHA/github.sha to the selected ref's commit, so deploy-pages pages_build_version
  # and WeiG source identity are the same exact SHA. Do not restore workflow_run here.
  WEIG_PAGES_SOURCE_SHA: ${{ github.sha }}
  WEIG_PAGES_SOURCE_BRANCH: ${{ github.ref_name }}
  WEIG_PAGES_VERIFY_PROFILE: ${{ inputs.validation_profile }}

jobs:
  build:
    if: ${{ github.ref_name == 'dev' }}
    runs-on: ubuntu-latest
    outputs:
      verify_matrix: ${{ steps.verify_plan.outputs.matrix }}
      reuse_deployed: ${{ steps.deployed_identity.outputs.reuse }}
      page_url: ${{ steps.deployed_identity.outputs.page_url }}
    steps:
      - name: Checkout exact WeiG source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.WEIG_PAGES_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Plan exact change-aware live verification
        id: verify_plan
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(node tools/pages-verify-plan.mjs --profile="$WEIG_PAGES_VERIFY_PROFILE")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Pages verification profile: $WEIG_PAGES_VERIFY_PROFILE"
          node -e 'const value=JSON.parse(process.argv[1]); console.log("Live lanes: "+value.include.map(item=>item.name).join(", "));' "$matrix"

      - name: Probe deployed exact-SHA Pages identity
        id: deployed_identity
        shell: bash
        env:
          FORCE_DEPLOY: ${{ inputs.force_deploy }}
        run: |
          set -euo pipefail
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          PAGE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/"
          echo "page_url=$PAGE_URL" >> "$GITHUB_OUTPUT"
          if [ "$FORCE_DEPLOY" = "true" ]; then
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "Forced fresh Pages deployment for $WEIG_PAGES_SOURCE_SHA"
            exit 0
          fi

          SITE_JSON="$RUNNER_TEMP/deployed-site.json"
          PROBE_URL="${PAGE_URL}metadata/site.json?reuse=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${WEIG_PAGES_SOURCE_SHA}"
          if curl -fsSL --retry 2 --retry-delay 1 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$PROBE_URL" -o "$SITE_JSON"; then
            LIVE_SHA="$(jq -r '.simulatorSha // empty' "$SITE_JSON")"
            LIVE_DEV_SHA="$(jq -r '.branches.dev.exactSha // empty' "$SITE_JSON")"
            if [ "$LIVE_SHA" = "$WEIG_PAGES_SOURCE_SHA" ] && [ "$LIVE_DEV_SHA" = "$WEIG_PAGES_SOURCE_SHA" ]; then
              echo "reuse=true" >> "$GITHUB_OUTPUT"
              echo "Reusing already deployed exact-SHA Pages site: $WEIG_PAGES_SOURCE_SHA"
              exit 0
            fi
            echo "Live Pages identity differs: simulatorSha=$LIVE_SHA dev=$LIVE_DEV_SHA expected=$WEIG_PAGES_SOURCE_SHA"
          else
            echo "Live Pages identity probe unavailable; a fresh deploy remains required."
          fi
          echo "reuse=false" >> "$GITHUB_OUTPUT"

      - name: Install contract dependencies
        if: ${{ steps.deployed_identity.outputs.reuse != 'true' }}
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Validate full repository contracts
        if: ${{ steps.deployed_identity.outputs.reuse != 'true' && inputs.validation_profile == 'full' }}
        run: npm test

      - name: Validate focused Pages build contracts
        if: ${{ steps.deployed_identity.outputs.reuse != 'true' && inputs.validation_profile != 'full' }}
        run: |
          node tests/dev-distribution-contract.mjs
          node tests/pages-relevance-contract.mjs
          node tests/pages-source-drain-contract.mjs
          node tests/pages-cache-freshness-contract.mjs
          node tests/pages-stable-index-contract.mjs
          node tests/syntax-contract.mjs

      - name: Load prepared exact-SHA qB Settings translation evidence
        if: ${{ steps.deployed_identity.outputs.reuse != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node tools/qb-settings-translation-artifact.mjs \
            --repo="$GITHUB_REPOSITORY" \
            --branch=dev \
            --source-sha="$WEIG_PAGES_SOURCE_SHA" \
            --out="$RUNNER_TEMP/qb-settings-translation-lkg.json" \
            --certified-only
          test -s "$RUNNER_TEMP/qb-settings-translation-lkg.json"

      - name: Build exact dev/main Virtual qB site from Frozen LKG
        if: ${{ steps.deployed_identity.outputs.reuse != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "dev"
          test "$(git rev-parse HEAD)" = "$WEIG_PAGES_SOURCE_SHA"

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

          DEV_SHA="$WEIG_PAGES_SOURCE_SHA"
          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          DEV_VERSION="$(git show "$DEV_SHA":VERSION | tr -d '\r\n')"
          MAIN_VERSION="$(git show refs/remotes/origin/main:VERSION | tr -d '\r\n')"

          rm -rf "$RUNNER_TEMP/weig-dev-webui" "$RUNNER_TEMP/weig-main-webui" "$RUNNER_TEMP/virtual-qb-site"
          mkdir -p "$RUNNER_TEMP/weig-dev-webui" "$RUNNER_TEMP/weig-main-webui"
          git archive --format=tar "$DEV_SHA":webui | tar -xf - -C "$RUNNER_TEMP/weig-dev-webui"
          git archive --format=tar refs/remotes/origin/main:webui | tar -xf - -C "$RUNNER_TEMP/weig-main-webui"

          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';

          const manifestPath='tools/data/qb-stable-lkg.json';
          const manifest=JSON.parse(fs.readFileSync(manifestPath,'utf8'));
          if(manifest.schemaVersion!==1)throw new Error(`Unsupported Frozen LKG schema ${manifest.schemaVersion}`);
          if(manifest.catalogPath!=='tests/fixtures/qb-release-catalog.lkg.json')throw new Error(`Unexpected Frozen LKG catalog path ${manifest.catalogPath}`);
          const text=fs.readFileSync(manifest.catalogPath,'utf8').replace(/\r\n?/g,'\n');
          const bytes=Buffer.from(text,'utf8');
          const digest=crypto.createHash('sha256').update(bytes).digest('hex');
          if(digest!==manifest.catalogSha256)throw new Error(`Frozen LKG SHA-256 mismatch: ${digest} != ${manifest.catalogSha256}`);
          const catalog=JSON.parse(text);
          if(catalog.length!==manifest.profileCount)throw new Error(`Frozen LKG profile count mismatch: ${catalog.length} != ${manifest.profileCount}`);
          if(catalog[0]?.qbVersion!==manifest.supportFloor)throw new Error(`Frozen LKG floor mismatch: ${catalog[0]?.qbVersion} != ${manifest.supportFloor}`);
          if(catalog.at(-1)?.qbVersion!==manifest.latestAdmittedStable)throw new Error(`Frozen LKG latest mismatch: ${catalog.at(-1)?.qbVersion} != ${manifest.latestAdmittedStable}`);
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/qb-releases.json`,bytes);
          console.log(`Pages consumes LF-canonical hash-bound Frozen LKG: ${catalog.length} profiles ${catalog[0].qbVersion} -> ${catalog.at(-1).qbVersion}, sha256:${digest}`);
          NODE
          cmp tests/fixtures/qb-release-catalog.lkg.json "$RUNNER_TEMP/qb-releases.json"

          node simulator/build/build-site.mjs \
            --out="$RUNNER_TEMP/virtual-qb-site" \
            --catalog="$RUNNER_TEMP/qb-releases.json" \
            --settings-translation-lkg="$RUNNER_TEMP/qb-settings-translation-lkg.json" \
            --simulator-sha="$WEIG_PAGES_SOURCE_SHA" \
            --dev-webui="$RUNNER_TEMP/weig-dev-webui" \
            --dev-sha="$DEV_SHA" \
            --dev-version="$DEV_VERSION" \
            --main-webui="$RUNNER_TEMP/weig-main-webui" \
            --main-sha="$MAIN_SHA" \
            --main-version="$MAIN_VERSION"

          test -f "$RUNNER_TEMP/virtual-qb-site/lab/index.html"
          test -f "$RUNNER_TEMP/virtual-qb-site/dev/app/service-worker.js"
          test -f "$RUNNER_TEMP/virtual-qb-site/main/app/service-worker.js"
          test -s "$RUNNER_TEMP/virtual-qb-site/metadata/qb-stable-index.json"
          test ! -e "$RUNNER_TEMP/virtual-qb-site/metadata/qb-releases.json"
          test ! -e "$RUNNER_TEMP/virtual-qb-site/dev/app/__source/private/data/qb-releases.json"
          test ! -e "$RUNNER_TEMP/virtual-qb-site/dev/app/__source/private/data/qb-release-profiles"
          test ! -e "$RUNNER_TEMP/virtual-qb-site/dev/app/__source/private/scripts/release-profile.js"
          test ! -e "$RUNNER_TEMP/virtual-qb-site/dev/app/__simulator/versions/catalog.source.json"
          test ! -e "$RUNNER_TEMP/virtual-qb-site/main/app/__simulator/versions/catalog.source.json"
          test ! -e "$RUNNER_TEMP/virtual-qb-site/main/app/__simulator/versions/catalog.generated.json"
          SITE_BYTES="$(du -sb "$RUNNER_TEMP/virtual-qb-site" | cut -f1)"
          if [ "$SITE_BYTES" -ge 950000000 ]; then
            echo "Virtual qB Pages site exceeds 950 MB deployment budget: $SITE_BYTES bytes" >&2
            exit 1
          fi
          echo "Virtual qB Pages deployment footprint: $SITE_BYTES bytes"
          node tools/qb-runtime-copy-product.mjs validate "$RUNNER_TEMP/virtual-qb-site/dev/app/__source/private/data" >/dev/null
          find "$RUNNER_TEMP/virtual-qb-site/dev/app/__source/translations" -type f -name 'webui_*.qm' -print -quit | grep -q .

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const sha=process.env.WEIG_PAGES_SOURCE_SHA;
          const site=JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/virtual-qb-site/metadata/site.json`,'utf8'));
          const dev=JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/virtual-qb-site/dev/app/virtual-qb-build.json`,'utf8'));
          const stableIndex=JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/virtual-qb-site/metadata/qb-stable-index.json`,'utf8'));
          const generatedCatalog=JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/virtual-qb-site/dev/app/__simulator/versions/catalog.generated.json`,'utf8'));
          const dist=JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/virtual-qb-site/downloads/dev/manifest.json`,'utf8'));
          const manifest=JSON.parse(fs.readFileSync('tools/data/qb-stable-lkg.json','utf8'));
          const admittedProfiles=manifest.profileCount;
          if(!Number.isSafeInteger(admittedProfiles)||admittedProfiles<1)throw new Error('Frozen manifest has an invalid certified profile count.');
          if(stableIndex.sourceCatalogSha256!==manifest.catalogSha256||stableIndex.latestAdmittedStable!==manifest.latestAdmittedStable)throw new Error('Pages stable index must match the admitted Frozen source hash and newest release.');
          if(site.simulatorSha!==sha||site.branches?.dev?.exactSha!==sha||dev.branch!=='dev'||dev.exactSha!==sha||dev.simulatorSha!==sha)throw new Error('Exact dev Pages identity mismatch before artifact upload.');
          if(site.localeCatalog?.profiles!==admittedProfiles||!Array.isArray(generatedCatalog)||generatedCatalog.length!==admittedProfiles||generatedCatalog.some(profile=>!Array.isArray(profile.webuiLocales)||!profile.webuiLocales.length))throw new Error('Frozen Locale overlay was not applied to all ${admittedProfiles} simulator profiles.');
          if(stableIndex.schemaVersion!==1||stableIndex.profileCount!==admittedProfiles||stableIndex.profiles?.length!==admittedProfiles||site.stableIndex?.sourceCatalogSha256!==stableIndex.sourceCatalogSha256||site.stableIndex?.bytes>=64*1024)throw new Error('Compact hash-bound Pages stable index identity/performance contract failed.');
          if(site.settingsTranslationCatalog?.profiles!==admittedProfiles||site.settingsTranslationCatalog?.mappedPreferences<1||site.settingsTranslationCatalog?.translationRoutes<1||site.settingsTranslationCatalog?.translationSets<1)throw new Error('Certified qB Settings translation LKG was not applied to all stable profiles.');
          if(dist.runtimeCompatibility!=='compact-contracts-only'||dist.legacyReleaseRuntime!==false||dist.ownedCopyLayout!=='private/data/qb-copy-{routes,bindings,fallback}'||dist.ownedCopyCompression!=='gzip-routes+fallback'||dist.legacySettingsAssets!==false||Number(dist.qmAssets)<1||!Number.isFinite(Number(dist.ownedCopyFiles))||Number(dist.ownedCopyFiles)<3||!Number.isFinite(Number(dist.ownedCopyBytes))||Number(dist.ownedCopyBytes)<=0)throw new Error('Materialized dev installer payload is missing the sharded qB copy runtime.');
          console.log(`Exact Pages identity PASS: ${sha}; Locale profiles=${site.localeCatalog.profiles}, Settings mappings=${site.settingsTranslationCatalog.mappedPreferences}, QM assets=${dist.qmAssets}`);
          NODE

      - name: Publish exact reusable dev Pages site
        if: ${{ steps.deployed_identity.outputs.reuse != 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: virtual-qb-pages-site-${{ env.WEIG_PAGES_SOURCE_SHA }}
          path: ${{ runner.temp }}/virtual-qb-site
          if-no-files-found: error
          retention-days: 14

      - name: Configure GitHub Pages
        if: ${{ steps.deployed_identity.outputs.reuse != 'true' }}
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: ${{ steps.deployed_identity.outputs.reuse != 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/virtual-qb-site

  deploy:
    if: ${{ github.ref_name == 'dev' && needs.build.outputs.reuse_deployed != 'true' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages-dev
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout canonical change-classification owner
        uses: actions/checkout@v6
        with:
          ref: ${{ env.WEIG_PAGES_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js for canonical change classification
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Refuse stale dev Pages deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXACT_SHA: ${{ env.WEIG_PAGES_SOURCE_SHA }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "dev"
          REMOTE_SHA="$(gh api "/repos/$GITHUB_REPOSITORY/commits/dev" --jq '.sha')"
          if [ "$REMOTE_SHA" = "$EXACT_SHA" ]; then
            echo "Fresh dev Pages deployment owner confirmed: $EXACT_SHA"
            exit 0
          fi

          COMPARE_JSON="$RUNNER_TEMP/pages-head-compare.json"
          gh api "/repos/$GITHUB_REPOSITORY/compare/$EXACT_SHA...$REMOTE_SHA" > "$COMPARE_JSON"
          STATUS="$(jq -r '.status // empty' "$COMPARE_JSON")"
          FILE_COUNT="$(jq '.files | length' "$COMPARE_JSON")"
          if [ "$STATUS" != "ahead" ] || [ "$FILE_COUNT" -lt 1 ] || [ "$FILE_COUNT" -ge 300 ]; then
            echo "Refusing stale dev Pages deployment: candidate=$EXACT_SHA current=$REMOTE_SHA compare_status=$STATUS files=$FILE_COUNT" >&2
            exit 1
          fi

          CHANGE_JSON="$(jq -j '.files[] | .filename, "\u0000"' "$COMPARE_JSON" | node tools/change-classifier.mjs --stdin0)"
          if [ "$(jq -r '.pagesPayload' <<<"$CHANGE_JSON")" = "true" ]; then
            echo "Pages-relevant public payload/materialization head advance blocks stale deployment: $(jq -r '.paths | join(", ")' <<<"$CHANGE_JSON")" >&2
            echo "Refusing stale dev Pages deployment: candidate=$EXACT_SHA current=$REMOTE_SHA" >&2
            exit 1
          fi
          echo "Current dev HEAD $REMOTE_SHA is newer only by non-payload changes; deployment owner $EXACT_SHA remains valid."
          echo "Non-payload advance classes: $(jq -c '{installer,ui,settingsUi,settingsSource,nativeSource,pagesPayload,pagesLive}' <<<"$CHANGE_JSON")"

      - name: Deploy exact dev Virtual qB Lab
        id: deployment
        uses: actions/deploy-pages@v5

  verify:
    name: verify ${{ matrix.name }}
    if: ${{ always() && github.ref_name == 'dev' && needs.build.result == 'success' && (needs.deploy.result == 'success' || needs.build.outputs.reuse_deployed == 'true') }}
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.build.outputs.verify_matrix) }}
    env:
      WEIG_BROWSER_CHANNEL: chrome
      WEIG_BROWSER_FETCH_TIMEOUT_MS: '15000'
      WEIG_PAGES_PROFILE_TIMEOUT_MS: '45000'
      WEIG_RELEASE_PROFILE_LANE_TIMEOUT_MS: '210000'
      WEIG_PAGES_URL: ${{ needs.build.outputs.page_url }}
      WEIG_EXPECTED_SIMULATOR_SHA: ${{ github.sha }}
      WEIG_VERIFY_SCRIPT: ${{ matrix.script }}
      WEIG_RELEASE_PROFILE_MODE: ${{ matrix.release_mode }}
      WEIG_SERVICES_CORE_MODE: ${{ matrix.service_mode }}
      WEIG_PAGES_SESSION_TIMEOUT_MS: '20000'
      WEIG_PAGES_PREF_MODE: ${{ matrix.pref_mode }}
      WEIG_PAGES_PREF_SHARD_INDEX: ${{ matrix.pref_index }}
      WEIG_PAGES_PREF_SHARD_TOTAL: ${{ matrix.pref_total }}
    steps:
      - name: Checkout exact WeiG source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.WEIG_PAGES_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install repository-locked browser dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Log live browser identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$WEIG_PAGES_SOURCE_SHA"
          node -e "console.log('Playwright ' + require('playwright/package.json').version)"
          google-chrome --version
          echo "Pages build/deployment version: $GITHUB_SHA"
          echo "Verify shard: ${{ matrix.name }} -> $WEIG_VERIFY_SCRIPT (release-mode=$WEIG_RELEASE_PROFILE_MODE service-mode=${WEIG_SERVICES_CORE_MODE:-none})"

      - name: Verify deployed Virtual qB Pages runtime (${{ matrix.name }})
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 240s node "$WEIG_VERIFY_SCRIPT"
