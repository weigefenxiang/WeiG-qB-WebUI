name: Phase D Docs Finalize

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/phase-d-docs-finalize.yml'
      - 'tools/phase-d-docs-finalize.py'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Patch exact checkout documentation
        run: python tools/phase-d-docs-finalize.py
      - name: Validate documentation-only patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ACTUAL="$(git diff --name-only | sort)"
          EXPECTED="$(printf '%s\n' 'docs/001.项目总方案.md' 'docs/002.兼容与实现状态.md' 'docs/003.项目架构.md' 'docs/006.发布与晋级流程.md' 'docs/010.真实qB产品兼容路线.md' | sort)"
          test "$ACTUAL" = "$EXPECTED"
          grep -q '46cdd9c6691fb478c5339e1f2da13525f2156317' docs/002.兼容与实现状态.md
          grep -q 'Phase D — Future Stable Discovery / Automation       DONE' docs/001.项目总方案.md
          grep -q 'Phase E — Torrent Fields / Columns provenance        NEXT' docs/010.真实qB产品兼容路线.md
      - name: Safe atomic docs checkpoint and self-cleanup
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "$GITHUB_SHA" || { echo 'dev moved during docs finalization; refusing to write.' >&2; exit 1; }
          rm .github/workflows/phase-d-docs-finalize.yml tools/phase-d-docs-finalize.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/001.项目总方案.md docs/002.兼容与实现状态.md docs/003.项目架构.md docs/006.发布与晋级流程.md docs/010.真实qB产品兼容路线.md .github/workflows/phase-d-docs-finalize.yml tools/phase-d-docs-finalize.py
          git diff --cached --check
          git commit -m 'docs: close Phase D and hand off Phase E'
          git push origin HEAD:dev
