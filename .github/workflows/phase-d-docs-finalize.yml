          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path,text): Path(path).write_text(text,encoding='utf-8')
          def replace_once(text, old, new, label):
              if text.count(old)!=1:
                  raise SystemExit(f'{label}: expected exactly one match, found {text.count(old)}')
              return text.replace(old,new,1)
          def replace_between(text,start,end,new,label):
              a=text.find(start)
              if a<0: raise SystemExit(f'{label}: start heading not found')
              b=text.find(end,a+len(start))
              if b<0: raise SystemExit(f'{label}: end heading not found')
              return text[:a]+new+text[b:]

