name: Promote validated dev to main

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character current dev SHA with a successful full candidate artifact
        required: true
        type: string
      confirmation:
        description: Type PROMOTE-VALIDATED-DEV to fast-forward main
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: promote-main
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve exact validated dev candidate
        id: verify
        uses: actions/github-script@v9
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PROMOTION_CONFIRMATION: ${{ inputs.confirmation }}
        with:
          script: |
            const sha = String(process.env.CANDIDATE_SHA || '').trim().toLowerCase();
            const confirmation = String(process.env.PROMOTION_CONFIRMATION || '').trim();
            if (context.ref !== 'refs/heads/dev') {
              core.setFailed('Run this promotion workflow from the dev branch only.');
              return;
            }
            if (!/^[0-9a-f]{40}$/.test(sha)) {
              core.setFailed('candidate_sha must be exactly 40 hexadecimal characters.');
              return;
            }
            if (confirmation !== 'PROMOTE-VALIDATED-DEV') {
              core.setFailed('Promotion confirmation is missing.');
              return;
            }

            const {owner, repo} = context.repo;
            const dev = await github.rest.repos.getBranch({owner, repo, branch: 'dev'});
            const main = await github.rest.repos.getBranch({owner, repo, branch: 'main'});
            const devSha = dev.data.commit.sha.toLowerCase();
            const mainSha = main.data.commit.sha.toLowerCase();
            if (devSha !== sha) {
              core.setFailed(`Candidate ${sha} is not the current dev HEAD ${devSha}.`);
              return;
            }

            const compare = await github.rest.repos.compareCommits({owner, repo, base: mainSha, head: sha});
            if (compare.data.behind_by !== 0 || !['ahead', 'identical'].includes(compare.data.status)) {
              core.setFailed(`main cannot be fast-forwarded safely to ${sha}; status=${compare.data.status}, behind_by=${compare.data.behind_by}.`);
              return;
            }

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: 'ci.yml',
              branch: 'dev',
              status: 'success',
              per_page: 100
            });
            const exactRuns = runs.filter(run => run.head_sha && run.head_sha.toLowerCase() === sha && run.conclusion === 'success');
            const artifactName = `release-candidate-${sha}`;
            let validated = null;
            let artifact = null;
            for (const run of exactRuns) {
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner,
                repo,
                run_id: run.id,
                per_page: 100
              });
              const candidate = artifacts.find(item => item.name === artifactName && !item.expired);
              if (candidate) {
                validated = run;
                artifact = candidate;
                break;
              }
            }
            if (!validated || !artifact) {
              core.setFailed(`No successful dev full-candidate artifact ${artifactName} exists for exact SHA ${sha}.`);
              return;
            }

            core.info(`Validated dev candidate CI run #${validated.run_number}: ${validated.html_url}`);
            core.info(`Reusable artifact: ${artifact.name} (${artifact.id})`);
            core.setOutput('sha', sha);
            core.setOutput('run_id', String(validated.id));
            core.setOutput('artifact_name', artifactName);
            core.setOutput('artifact_id', String(artifact.id));

      - name: Download exact validated dev candidate
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.verify.outputs.artifact_name }}
          path: candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.verify.outputs.run_id }}

      - name: Verify reusable candidate integrity before promotion
        env:
          CANDIDATE_SHA: ${{ steps.verify.outputs.sha }}
        run: |
          set -euo pipefail
          test -f candidate/WeiG-qB-WebUI.zip
          test -f candidate/SHA256SUMS
          test -f candidate/CANDIDATE_SHA
          test "$(tr -d '\r\n' < candidate/CANDIDATE_SHA)" = "$CANDIDATE_SHA"
          (cd candidate && sha256sum -c SHA256SUMS)
          test "$(unzip -p candidate/WeiG-qB-WebUI.zip WeiG-qB-WebUI/GIT_SHA | tr -d '\r\n')" = "$CANDIDATE_SHA"

      - name: Checkout main for authenticated fast-forward
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Fast-forward main to exact validated dev SHA
        env:
          CANDIDATE_SHA: ${{ steps.verify.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main dev
          test "$(git rev-parse origin/dev)" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor origin/main "$CANDIDATE_SHA"
          git push origin "$CANDIDATE_SHA:refs/heads/main"

      - name: Promotion summary
        run: |
          echo "main now points to the exact validated dev state: ${{ steps.verify.outputs.sha }}"
          echo "Reused dev candidate CI run: ${{ steps.verify.outputs.run_id }}"
          echo "Reused validated artifact: ${{ steps.verify.outputs.artifact_name }}"
          echo "No main candidate rebuild is required; create the stable tag only after confirming main still equals this exact SHA."
