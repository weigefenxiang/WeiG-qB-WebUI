name: Promote validated dev to main

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character current dev SHA with successful Candidate CI and Candidate Deployment evidence
        required: true
        type: string
      confirmation:
        description: Type PROMOTE-VALIDATED-DEV to fast-forward main
        required: true
        type: string
      publish_after:
        description: After certified Promotion, create stable tag and explicitly dispatch Release
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: write

concurrency:
  group: promote-main
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve exact candidate and deployment evidence
        id: verify
        uses: actions/github-script@v9
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PROMOTION_CONFIRMATION: ${{ inputs.confirmation }}
        with:
          script: |
            const sha = String(process.env.CANDIDATE_SHA || '').trim().toLowerCase();
            const confirmation = String(process.env.PROMOTION_CONFIRMATION || '').trim();
            if (context.ref !== 'refs/heads/dev') {
              core.setFailed('Run this promotion workflow from the dev branch only.');
              return;
            }
            if (!/^[0-9a-f]{40}$/.test(sha)) {
              core.setFailed('candidate_sha must be exactly 40 hexadecimal characters.');
              return;
            }
            if (confirmation !== 'PROMOTE-VALIDATED-DEV') {
              core.setFailed('Promotion confirmation is missing.');
              return;
            }

            const {owner, repo} = context.repo;
            const versionFile = await github.rest.repos.getContent({owner, repo, path: 'VERSION', ref: sha});
            if (Array.isArray(versionFile.data) || versionFile.data.type !== 'file' || !versionFile.data.content) {
              core.setFailed(`Candidate VERSION is not a readable file at ${sha}.`);
              return;
            }
            const version = Buffer.from(versionFile.data.content, versionFile.data.encoding || 'base64').toString('utf8').trim();
            if (!/^\d+\.\d+\.\d+$/.test(version)) {
              core.setFailed(`Candidate VERSION is invalid: ${version}`);
              return;
            }

            const dev = await github.rest.repos.getBranch({owner, repo, branch: 'dev'});
            const main = await github.rest.repos.getBranch({owner, repo, branch: 'main'});
            const devSha = String(dev.data.commit.sha || '').toLowerCase();
            const mainSha = String(main.data.commit.sha || '').toLowerCase();
            if (devSha !== sha) {
              core.setFailed(`Candidate ${sha} is not the current dev HEAD ${devSha}.`);
              return;
            }
            const compare = await github.rest.repos.compareCommits({owner, repo, base: mainSha, head: sha});
            if (compare.data.behind_by !== 0 || !['ahead', 'identical'].includes(compare.data.status)) {
              core.setFailed(`main cannot be fast-forwarded safely to ${sha}; status=${compare.data.status}, behind_by=${compare.data.behind_by}.`);
              return;
            }

            const candidateRuns = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'ci.yml', branch: 'dev', status: 'success', per_page: 100
            });
            const artifactName = `release-candidate-${sha}`;
            let validated = null;
            let candidateArtifact = null;
            for (const run of candidateRuns.filter(run => run.head_sha && run.head_sha.toLowerCase() === sha && run.conclusion === 'success')) {
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {owner, repo, run_id: run.id, per_page: 100});
              const candidate = artifacts.find(item => item.name === artifactName && !item.expired);
              if (candidate) {
                validated = run;
                candidateArtifact = candidate;
                break;
              }
            }
            if (!validated || !candidateArtifact) {
              core.setFailed(`No successful Candidate CI run contains ${artifactName} for exact SHA ${sha}.`);
              return;
            }

            const evidenceName = `candidate-deployment-${sha}`;
            const deploymentRuns = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'candidate-deployment-only.yml', branch: 'dev', status: 'success', per_page: 100
            });
            let evidenceRun = null;
            let evidenceArtifact = null;
            for (const run of deploymentRuns.filter(run => run.conclusion === 'success' && run.event === 'workflow_dispatch')) {
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {owner, repo, run_id: run.id, per_page: 100});
              const evidence = artifacts.find(item => item.name === evidenceName && !item.expired);
              if (evidence) {
                evidenceRun = run;
                evidenceArtifact = evidence;
                break;
              }
            }
            if (!evidenceRun || !evidenceArtifact) {
              core.setFailed(`No successful Candidate Deployment run contains ${evidenceName} for exact SHA ${sha}.`);
              return;
            }

            core.info(`Validated Candidate CI run #${validated.run_number}: ${validated.html_url}`);
            core.info(`Validated Candidate Deployment run #${evidenceRun.run_number}: ${evidenceRun.html_url}`);
            core.setOutput('sha', sha);
            core.setOutput('version', version);
            core.setOutput('main_sha', mainSha);
            core.setOutput('run_id', String(validated.id));
            core.setOutput('deployment_run_id', String(evidenceRun.id));
            core.setOutput('artifact_name', artifactName);
            core.setOutput('evidence_name', evidenceName);

      - name: Checkout exact candidate evidence policy
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.verify.outputs.sha }}
          persist-credentials: false

      - name: Download exact validated candidate
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.verify.outputs.artifact_name }}
          path: candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.verify.outputs.run_id }}

      - name: Download exact Candidate Deployment evidence
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.verify.outputs.evidence_name }}
          path: evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.verify.outputs.deployment_run_id }}

      - name: Verify exact candidate and deployment evidence
        env:
          CANDIDATE_SHA: ${{ steps.verify.outputs.sha }}
          MAIN_BEFORE: ${{ steps.verify.outputs.main_sha }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          test -f candidate/weig-qb-webui.zip
          test -f candidate/weig-qb-webui.tar.gz
          test -f candidate/manifest.json
          test -f candidate/SHA256SUMS
          test -f candidate/CANDIDATE_SHA
          test -f candidate/install.sh
          test -f candidate/install.ps1
          test -f evidence/candidate.json
          test "$(tr -d '\r\n' < candidate/CANDIDATE_SHA)" = "$CANDIDATE_SHA"
          (cd candidate && sha256sum -c SHA256SUMS)
          cmp -s candidate/install.sh installers/install.sh
          cmp -s candidate/install.ps1 installers/install.ps1
          bash -n candidate/install.sh
          test "$(unzip -p candidate/weig-qb-webui.zip weig-qb-webui/GIT_SHA | tr -d '\r\n')" = "$CANDIDATE_SHA"
          test "$(unzip -p candidate/weig-qb-webui.zip weig-qb-webui/VERSION | tr -d '\r\n')" = "$VERSION"
          node tests/release-candidate-evidence.mjs \
            --mode=promotion \
            --evidence=evidence/candidate.json \
            --package=candidate/weig-qb-webui.zip \
            --sha="$CANDIDATE_SHA" \
            --version="$VERSION" \
            --main-before="$MAIN_BEFORE"

      - name: Build lean release certification
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.verify.outputs.sha }}
          MAIN_BEFORE: ${{ steps.verify.outputs.main_sha }}
          CANDIDATE_RUN_ID: ${{ steps.verify.outputs.run_id }}
          CANDIDATE_ARTIFACT: ${{ steps.verify.outputs.artifact_name }}
          DEPLOYMENT_RUN_ID: ${{ steps.verify.outputs.deployment_run_id }}
          DEPLOYMENT_ARTIFACT: ${{ steps.verify.outputs.evidence_name }}
        run: |
          set -euo pipefail
          mkdir -p certification
          VERSION="$(tr -d '\r\n' < VERSION)"
          export VERSION
          node <<'NODE'
          const crypto=require('node:crypto'),fs=require('node:fs');
          const hash=file=>crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const sha=process.env.CANDIDATE_SHA;
          if(!/^[0-9a-f]{40}$/.test(sha))throw new Error('Certification SHA identity is invalid.');
          const certification={
            schemaVersion:3,
            kind:'weig-release-certification',
            candidateSha:sha,
            version:process.env.VERSION,
            mainBefore:process.env.MAIN_BEFORE,
            promotionRunId:Number(process.env.GITHUB_RUN_ID),
            candidate:{
              runId:Number(process.env.CANDIDATE_RUN_ID),
              artifact:process.env.CANDIDATE_ARTIFACT,
              packageSha256:hash('candidate/weig-qb-webui.zip'),
              tarGzSha256:hash('candidate/weig-qb-webui.tar.gz'),
              manifestSha256:hash('candidate/manifest.json'),
              sumsSha256:hash('candidate/SHA256SUMS')
            },
            deployment:{
              runId:Number(process.env.DEPLOYMENT_RUN_ID),
              artifact:process.env.DEPLOYMENT_ARTIFACT,
              evidenceSha256:hash('evidence/candidate.json')
            }
          };
          for(const value of [certification.candidate.packageSha256,certification.candidate.tarGzSha256,certification.candidate.manifestSha256,certification.candidate.sumsSha256,certification.deployment.evidenceSha256]){
            if(!/^[0-9a-f]{64}$/.test(value))throw new Error('Certification evidence digest is invalid.');
          }
          fs.writeFileSync('certification/release-certification.json',JSON.stringify(certification,null,2)+'\n');
          console.log(JSON.stringify(certification,null,2));
          NODE

      - name: Upload immutable release certification
        uses: actions/upload-artifact@v7
        with:
          name: release-certification-${{ steps.verify.outputs.sha }}
          path: certification/release-certification.json
          if-no-files-found: error
          retention-days: 90

      - name: Checkout main for authenticated fast-forward
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Fast-forward main to exact validated dev SHA
        env:
          CANDIDATE_SHA: ${{ steps.verify.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main dev
          test "$(git rev-parse origin/dev)" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor origin/main "$CANDIDATE_SHA"
          git push origin "$CANDIDATE_SHA:refs/heads/main"

      - name: Create stable release tag after certified Promotion
        if: ${{ inputs.publish_after == true }}
        uses: actions/github-script@v9
        env:
          CANDIDATE_SHA: ${{ steps.verify.outputs.sha }}
          VERSION: ${{ steps.verify.outputs.version }}
        with:
          script: |
            const sha = String(process.env.CANDIDATE_SHA || '').trim().toLowerCase();
            const version = String(process.env.VERSION || '').trim();
            const tag = `v${version}`;
            const {owner, repo} = context.repo;
            const main = await github.rest.repos.getBranch({owner, repo, branch: 'main'});
            const mainSha = String(main.data.commit.sha || '').toLowerCase();
            if (mainSha !== sha) {
              core.setFailed(`Current main ${mainSha} does not equal certified candidate ${sha}.`);
              return;
            }
            let existingSha = '';
            try {
              const existing = await github.rest.git.getRef({owner, repo, ref: `tags/${tag}`});
              existingSha = String(existing.data.object.sha || '').toLowerCase();
            } catch (error) {
              if (error?.status !== 404) throw error;
            }
            if (existingSha && existingSha !== sha) {
              core.setFailed(`Stable tag ${tag} already points to ${existingSha}, expected ${sha}.`);
              return;
            }
            if (!existingSha) await github.rest.git.createRef({owner, repo, ref: `refs/tags/${tag}`, sha});
            await github.rest.actions.createWorkflowDispatch({owner, repo, workflow_id: 'release.yml', ref: tag});

      - name: Promotion summary
        run: |
          echo "main now points to exact validated dev SHA: ${{ steps.verify.outputs.sha }}"
          echo "Candidate CI run: ${{ steps.verify.outputs.run_id }}"
          echo "Candidate artifact: ${{ steps.verify.outputs.artifact_name }}"
          echo "Candidate Deployment run: ${{ steps.verify.outputs.deployment_run_id }}"
          echo "Deployment evidence: ${{ steps.verify.outputs.evidence_name }}"
          echo "Compatibility Audits are independent and are not Promotion prerequisites."
          echo "publish_after defaults false; Tag/Release remains a separate explicit choice."
