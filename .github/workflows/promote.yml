name: Promote validated dev to main

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character current dev SHA with successful candidate, Full Frozen Matrix and Locale evidence
        required: true
        type: string
      compat_evidence_sha:
        description: Optional prior SHA with successful Full Frozen + Locale evidence; reuse is allowed only across validation-only changes
        required: false
        type: string
      confirmation:
        description: Type PROMOTE-VALIDATED-DEV to fast-forward main
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: promote-main
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve exact validated dev evidence
        id: verify
        uses: actions/github-script@v9
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          COMPAT_EVIDENCE_SHA: ${{ inputs.compat_evidence_sha }}
          PROMOTION_CONFIRMATION: ${{ inputs.confirmation }}
        with:
          script: |
            const sha = String(process.env.CANDIDATE_SHA || '').trim().toLowerCase();
            const requestedCompatSha = String(process.env.COMPAT_EVIDENCE_SHA || '').trim().toLowerCase();
            const confirmation = String(process.env.PROMOTION_CONFIRMATION || '').trim();
            if (context.ref !== 'refs/heads/dev') {
              core.setFailed('Run this promotion workflow from the dev branch only.');
              return;
            }
            if (!/^[0-9a-f]{40}$/.test(sha)) {
              core.setFailed('candidate_sha must be exactly 40 hexadecimal characters.');
              return;
            }
            if (confirmation !== 'PROMOTE-VALIDATED-DEV') {
              core.setFailed('Promotion confirmation is missing.');
              return;
            }

            const {owner, repo} = context.repo;
            const dev = await github.rest.repos.getBranch({owner, repo, branch: 'dev'});
            const main = await github.rest.repos.getBranch({owner, repo, branch: 'main'});
            const devSha = dev.data.commit.sha.toLowerCase();
            const mainSha = main.data.commit.sha.toLowerCase();
            if (devSha !== sha) {
              core.setFailed(`Candidate ${sha} is not the current dev HEAD ${devSha}.`);
              return;
            }

            const compare = await github.rest.repos.compareCommits({owner, repo, base: mainSha, head: sha});
            if (compare.data.behind_by !== 0 || !['ahead', 'identical'].includes(compare.data.status)) {
              core.setFailed(`main cannot be fast-forwarded safely to ${sha}; status=${compare.data.status}, behind_by=${compare.data.behind_by}.`);
              return;
            }

            const compatSha = requestedCompatSha || sha;
            if (!/^[0-9a-f]{40}$/.test(compatSha)) {
              core.setFailed('compat_evidence_sha must be blank or exactly 40 hexadecimal characters.');
              return;
            }
            if (compatSha !== sha) {
              const compatCompare = await github.rest.repos.compareCommits({owner, repo, base: compatSha, head: sha});
              if (compatCompare.data.behind_by !== 0 || !['ahead', 'identical'].includes(compatCompare.data.status)) {
                core.setFailed(`Compatibility evidence SHA ${compatSha} is not an ancestor of candidate ${sha}.`);
                return;
              }
              const validationOnly = new Set([
                '.github/workflows/ci.yml',
                '.github/workflows/promote.yml',
                'tests/ci-contract.mjs',
                'tests/full-stable-product-compat.mjs',
                'tests/qb-locale-pipeline-contract.mjs',
                '.github/workflows/release.yml',
                'tests/release-evidence-contract.mjs',
                'tests/compatibility-governance-contract.mjs',
                'tests/upstream-workflow-contract.mjs',
                'tests/release-candidate-evidence.mjs',
                'tests/candidate-deployment.sh',
                'tests/installer-lifecycle-browser.mjs',
                'tests/qb-recovery-ci-contract.mjs',
                '.github/workflows/candidate-deployment-only.yml',
                'tests/release-compat-evidence.mjs',
                'tests/release-compat-evidence-contract.mjs'
              ]);
              const blocked = (compatCompare.data.files || []).map(file => file.filename).filter(file =>
                !validationOnly.has(file) && !file.startsWith('docs/') && !file.endsWith('.md') && file !== 'LICENSE'
              );
              if (blocked.length) {
                core.setFailed(`Compatibility evidence reuse refused: changes since ${compatSha} affect non-validation paths: ${blocked.join(', ')}`);
                return;
              }
              core.info(`Reusing Full Frozen/Locale evidence from ${compatSha}; all intervening changes are validation-only.`);
            }

            const candidateRuns = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'ci.yml', branch: 'dev', status: 'success', per_page: 100
            });
            const artifactName = `release-candidate-${sha}`;
            const evidenceName = `candidate-deployment-${sha}`;
            let validated = null;
            let candidateArtifact = null;
            for (const run of candidateRuns.filter(run => run.head_sha && run.head_sha.toLowerCase() === sha && run.conclusion === 'success')) {
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {owner, repo, run_id: run.id, per_page: 100});
              const candidate = artifacts.find(item => item.name === artifactName && !item.expired);
              if (candidate) {
                validated = run;
                candidateArtifact = candidate;
                break;
              }
            }
            if (!validated || !candidateArtifact) {
              core.setFailed(`No successful dev CI run contains ${artifactName} for exact SHA ${sha}.`);
              return;
            }

            const deploymentRuns = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'candidate-deployment-only.yml', branch: 'dev', status: 'success', per_page: 100
            });
            let evidenceRun = null;
            let evidenceArtifact = null;
            for (const run of deploymentRuns.filter(run => run.conclusion === 'success' && run.event === 'workflow_dispatch')) {
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {owner, repo, run_id: run.id, per_page: 100});
              const evidence = artifacts.find(item => item.name === evidenceName && !item.expired);
              if (evidence) {
                evidenceRun = run;
                evidenceArtifact = evidence;
                break;
              }
            }
            if (!evidenceRun || !evidenceArtifact) {
              core.setFailed(`No successful isolated deployment acceptance contains ${evidenceName} for exact SHA ${sha}.`);
              return;
            }

            async function resolveManualAggregate(workflowId, artifactName, label, evidenceSha) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner, repo, workflow_id: workflowId, branch: 'dev', status: 'success', per_page: 100
              });
              for (const run of runs.filter(run => run.head_sha && run.head_sha.toLowerCase() === evidenceSha && run.conclusion === 'success' && run.event === 'workflow_dispatch')) {
                const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {owner, repo, run_id: run.id, per_page: 100});
                const artifact = artifacts.find(item => item.name === artifactName && !item.expired);
                if (artifact) return {run, artifact};
              }
              core.setFailed(`No successful manually dispatched ${label} run contains ${artifactName} for compatibility evidence SHA ${evidenceSha}.`);
              return null;
            }

            const gfmArtifactName = `real-qb-full-aggregate-${compatSha}`;
            const localeArtifactName = `real-qb-current-locale-aggregate-${compatSha}`;
            const gfm = await resolveManualAggregate('real-qb-full.yml', gfmArtifactName, 'Real qB Full Frozen Matrix', compatSha);
            if (!gfm) return;
            const locale = await resolveManualAggregate('real-qb-locale.yml', localeArtifactName, 'Real qB Current Stable Locale Matrix', compatSha);
            if (!locale) return;

            core.info(`Validated dev candidate CI run #${validated.run_number}: ${validated.html_url}`);
            core.info(`Reusable artifact: ${candidateArtifact.name} (${candidateArtifact.id})`);
            core.info(`Deployment evidence: ${evidenceArtifact.name} (${evidenceArtifact.id}) from isolated run #${evidenceRun.run_number}`);
            core.info(`Validated Full Frozen Matrix run #${gfm.run.run_number}: ${gfm.run.html_url}`);
            core.info(`Validated Locale Matrix run #${locale.run.run_number}: ${locale.run.html_url}`);
            core.setOutput('sha', sha);
            core.setOutput('compat_sha', compatSha);
            core.setOutput('main_sha', mainSha);
            core.setOutput('run_id', String(validated.id));
            core.setOutput('deployment_run_id', String(evidenceRun.id));
            core.setOutput('artifact_name', artifactName);
            core.setOutput('evidence_name', evidenceName);
            core.setOutput('gfm_run_id', String(gfm.run.id));
            core.setOutput('gfm_artifact_name', gfmArtifactName);
            core.setOutput('locale_run_id', String(locale.run.id));
            core.setOutput('locale_artifact_name', localeArtifactName);

      - name: Checkout exact candidate evidence policy
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.verify.outputs.sha }}
          persist-credentials: false

      - name: Download exact validated dev candidate
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.verify.outputs.artifact_name }}
          path: candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.verify.outputs.run_id }}

      - name: Download exact candidate deployment evidence
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.verify.outputs.evidence_name }}
          path: evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.verify.outputs.deployment_run_id }}

      - name: Download exact 65-version G-FM aggregate
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.verify.outputs.gfm_artifact_name }}
          path: gfm
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.verify.outputs.gfm_run_id }}

      - name: Download exact current-stable Locale aggregate
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.verify.outputs.locale_artifact_name }}
          path: locale
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.verify.outputs.locale_run_id }}

      - name: Verify release-grade compatibility evidence
        env:
          COMPAT_EVIDENCE_SHA: ${{ steps.verify.outputs.compat_sha }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          node tests/release-compat-evidence.mjs \
            --gfm="gfm/${COMPAT_EVIDENCE_SHA}.json" \
            --locale="locale/${COMPAT_EVIDENCE_SHA}.json" \
            --sha="$COMPAT_EVIDENCE_SHA" \
            --version="$VERSION"

      - name: Verify reusable candidate and rehearsal evidence before promotion
        env:
          CANDIDATE_SHA: ${{ steps.verify.outputs.sha }}
          MAIN_BEFORE: ${{ steps.verify.outputs.main_sha }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          test -f candidate/WeiG-qB-WebUI.zip
          test -f candidate/SHA256SUMS
          test -f candidate/CANDIDATE_SHA
          test -f candidate/weigg-install.sh
          test -f candidate/weigg-install.ps1
          test -f evidence/candidate.json
          test "$(tr -d '\r\n' < candidate/CANDIDATE_SHA)" = "$CANDIDATE_SHA"
          (cd candidate && sha256sum -c SHA256SUMS)
          cmp -s candidate/weigg-install.sh installers/install.sh
          cmp -s candidate/weigg-install.ps1 installers/install.ps1
          bash -n candidate/weigg-install.sh
          test "$(unzip -p candidate/WeiG-qB-WebUI.zip WeiG-qB-WebUI/GIT_SHA | tr -d '\r\n')" = "$CANDIDATE_SHA"
          test "$(unzip -p candidate/WeiG-qB-WebUI.zip WeiG-qB-WebUI/VERSION | tr -d '\r\n')" = "$VERSION"
          node tests/release-candidate-evidence.mjs \
            --mode=promotion \
            --evidence=evidence/candidate.json \
            --package=candidate/WeiG-qB-WebUI.zip \
            --sha="$CANDIDATE_SHA" \
            --version="$VERSION" \
            --main-before="$MAIN_BEFORE"

      - name: Build release certification
        id: certification
        shell: bash
        env:
          CANDIDATE_SHA: ${{ steps.verify.outputs.sha }}
          COMPAT_SHA: ${{ steps.verify.outputs.compat_sha }}
          MAIN_BEFORE: ${{ steps.verify.outputs.main_sha }}
          CANDIDATE_RUN_ID: ${{ steps.verify.outputs.run_id }}
          CANDIDATE_ARTIFACT: ${{ steps.verify.outputs.artifact_name }}
          DEPLOYMENT_RUN_ID: ${{ steps.verify.outputs.deployment_run_id }}
          DEPLOYMENT_ARTIFACT: ${{ steps.verify.outputs.evidence_name }}
          GFM_RUN_ID: ${{ steps.verify.outputs.gfm_run_id }}
          GFM_ARTIFACT: ${{ steps.verify.outputs.gfm_artifact_name }}
          LOCALE_RUN_ID: ${{ steps.verify.outputs.locale_run_id }}
          LOCALE_ARTIFACT: ${{ steps.verify.outputs.locale_artifact_name }}
        run: |
          set -euo pipefail
          mkdir -p certification
          VERSION="$(tr -d '\r\n' < VERSION)"
          export VERSION
          node <<'NODE'
          const crypto=require('node:crypto'),fs=require('node:fs');
          const hash=file=>crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const sha=process.env.CANDIDATE_SHA,compat=process.env.COMPAT_SHA;
          if(!/^[0-9a-f]{40}$/.test(sha)||!/^[0-9a-f]{40}$/.test(compat))throw new Error('Certification SHA identity is invalid.');
          const certification={
            schemaVersion:1,
            kind:'weig-release-certification',
            candidateSha:sha,
            compatEvidenceSha:compat,
            version:process.env.VERSION,
            mainBefore:process.env.MAIN_BEFORE,
            promotionRunId:Number(process.env.GITHUB_RUN_ID),
            candidate:{
              runId:Number(process.env.CANDIDATE_RUN_ID),
              artifact:process.env.CANDIDATE_ARTIFACT,
              packageSha256:hash('candidate/WeiG-qB-WebUI.zip')
            },
            deployment:{
              runId:Number(process.env.DEPLOYMENT_RUN_ID),
              artifact:process.env.DEPLOYMENT_ARTIFACT,
              evidenceSha256:hash('evidence/candidate.json')
            },
            fullFrozen:{
              runId:Number(process.env.GFM_RUN_ID),
              artifact:process.env.GFM_ARTIFACT,
              evidenceSha256:hash(`gfm/${compat}.json`)
            },
            locale:{
              runId:Number(process.env.LOCALE_RUN_ID),
              artifact:process.env.LOCALE_ARTIFACT,
              evidenceSha256:hash(`locale/${compat}.json`)
            }
          };
          for(const value of [certification.candidate.packageSha256,certification.deployment.evidenceSha256,certification.fullFrozen.evidenceSha256,certification.locale.evidenceSha256]){
            if(!/^[0-9a-f]{64}$/.test(value))throw new Error('Certification evidence digest is invalid.');
          }
          fs.writeFileSync('certification/release-certification.json',JSON.stringify(certification,null,2)+'\n');
          console.log(JSON.stringify(certification,null,2));
          NODE

      - name: Upload immutable release certification
        uses: actions/upload-artifact@v7
        with:
          name: release-certification-${{ steps.verify.outputs.sha }}
          path: certification/release-certification.json
          if-no-files-found: error
          retention-days: 90

      - name: Checkout main for authenticated fast-forward
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Fast-forward main to exact validated dev SHA
        env:
          CANDIDATE_SHA: ${{ steps.verify.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin main dev
          test "$(git rev-parse origin/dev)" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor origin/main "$CANDIDATE_SHA"
          git push origin "$CANDIDATE_SHA:refs/heads/main"

      - name: Promotion summary
        run: |
          echo "main now points to the exact validated dev state: ${{ steps.verify.outputs.sha }}"
          echo "Reused dev candidate CI run: ${{ steps.verify.outputs.run_id }}"
          echo "Reused validated artifact: ${{ steps.verify.outputs.artifact_name }}"
          echo "Reused deployment/rehearsal evidence: ${{ steps.verify.outputs.evidence_name }}"
          echo "Deployment evidence run: ${{ steps.verify.outputs.deployment_run_id }}"
          echo "Release certification: release-certification-${{ steps.verify.outputs.sha }}"
          echo "Compatibility evidence SHA: ${{ steps.verify.outputs.compat_sha }}"
          echo "Reused manual Full Frozen Matrix run: ${{ steps.verify.outputs.gfm_run_id }}"
          echo "Reused G-FM aggregate: ${{ steps.verify.outputs.gfm_artifact_name }}"
          echo "Reused manual Locale Matrix run: ${{ steps.verify.outputs.locale_run_id }}"
          echo "Reused Locale aggregate: ${{ steps.verify.outputs.locale_artifact_name }}"
          echo "No main candidate rebuild is required; create the stable tag only after confirming main still equals this exact SHA."
