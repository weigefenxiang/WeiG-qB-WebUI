name: Virtual qB Pages Source

# Strict main promotion reuses only an exact-SHA validated dev Pages artifact; no legacy artifact fallback is allowed.
# Only Pages-owned inputs and the admitted Frozen LKG redeploy automatically; unrelated final-gate SHAs can be seeded explicitly.
# Manual dispatch exists so the final validated dev SHA can always produce reusable Pages evidence before promotion.
# Release-orchestration workflow changes are Pages-owned because exact-SHA promotion depends on their evidence chain.
on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main
    paths:
      - 'webui/**'
      - 'simulator/**'
      - 'tools/data/qb-stable-lkg.json'
      - 'tests/fixtures/qb-release-catalog.lkg.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/pages-*.mjs'
      - 'tests/browser-driver.mjs'
      - '.github/workflows/pages.yml'
      - '.github/workflows/pages-source.yml'
      - '.github/workflows/promote.yml'
      - '.github/workflows/real-qb-full.yml'

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - name: Publish Pages source signal
        run: echo "Virtual qB Pages source $GITHUB_REF_NAME@$GITHUB_SHA is ready for the default-branch deployment workflow."
