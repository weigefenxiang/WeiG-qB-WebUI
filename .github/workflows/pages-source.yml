name: Virtual qB Pages Source

# Strict main promotion reuses only an exact-SHA validated dev Pages artifact; no legacy artifact fallback is allowed.
# Only Pages-owned inputs and the admitted Frozen LKG redeploy; unrelated tests and qB source-parser changes have their own owners.
# A main-validation candidate intentionally changes this owner file so the exact dev SHA has a reusable Pages artifact before promotion.
# Benchmark marker: exercise the default-branch Frozen LKG Pages build without changing product behavior.
on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'webui/**'
      - 'simulator/**'
      - 'tools/data/qb-stable-lkg.json'
      - 'tests/fixtures/qb-release-catalog.lkg.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/pages-*.mjs'
      - 'tests/browser-driver.mjs'
      - '.github/workflows/pages.yml'
      - '.github/workflows/pages-source.yml'

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - name: Publish Pages source signal
        run: echo "Virtual qB Pages source $GITHUB_REF_NAME@$GITHUB_SHA is ready for the default-branch deployment workflow."
