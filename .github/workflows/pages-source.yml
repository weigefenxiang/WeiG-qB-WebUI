name: Virtual qB Pages Source

# Source relay owns trigger choreography only. It never owns Pages deployment permissions.
# Every dev/main push reaches this lightweight relay, but Virtual qB Pages is dispatched only
# when a Pages/runtime input changed. Documentation and unrelated repository metadata must not
# rebuild/redeploy the simulator or the materialized dev payload.
on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main

permissions:
  actions: write
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect Pages-relevant source changes
        id: relevance
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch explicitly requests a Pages owner run."
            exit 0
          fi

          BEFORE="$BEFORE_SHA"
          case "$BEFORE" in
            ''|0000000000000000000000000000000000000000)
              echo "relevant=true" >> "$GITHUB_OUTPUT"
              echo "Push has no usable before SHA; fail closed by requiring a Pages owner run."
              exit 0
              ;;
          esac

          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Before SHA is unavailable locally; fail closed by requiring a Pages owner run."
            exit 0
          fi

          relevant=false
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case "$path" in
              webui/*|simulator/*|installers/*|tools/*|tests/*|translations/*|VERSION|package.json|package-lock.json|.github/workflows/pages.yml|.github/workflows/pages-source.yml)
                echo "Pages-relevant change: $path"
                relevant=true
                break
                ;;
              *)
                echo "Pages-irrelevant change: $path"
                ;;
            esac
          done < <(git diff --name-only "$BEFORE" "$GITHUB_SHA")

          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          if [ "$relevant" != "true" ]; then
            echo "No Pages/runtime inputs changed; Virtual qB Pages will not be dispatched."
          fi

      - name: Dispatch exact-ref Pages owner
        if: ${{ steps.relevance.outputs.relevant == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="$GITHUB_REF_NAME"
          case "$BRANCH" in
            dev|main) ;;
            *) echo "Unsupported Pages source branch: $BRANCH" >&2; exit 1 ;;
          esac

          REMOTE_SHA="$(gh api "/repos/$GITHUB_REPOSITORY/commits/$BRANCH" --jq '.sha')"
          if [ "$REMOTE_SHA" != "$GITHUB_SHA" ]; then
            echo "Pages source $BRANCH@$GITHUB_SHA is stale; current head is $REMOTE_SHA. A newer source run owns deployment."
            exit 0
          fi

          gh api --method POST \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/dispatches" \
            -f ref="$BRANCH" >/dev/null

          echo "Dispatched Virtual qB Pages on $BRANCH@$GITHUB_SHA because a Pages/runtime input changed."
