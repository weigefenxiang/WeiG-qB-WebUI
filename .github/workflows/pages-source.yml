name: Virtual qB Pages Source

# Source relay owns trigger choreography only. It never owns Pages deployment permissions.
# Pages deployment is dispatched on the same dev/main ref so actions/deploy-pages receives that ref's real GITHUB_SHA.
# This avoids workflow_run's default-branch GITHUB_SHA alias and keeps Pages build_version tied to the dispatched ref.
on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main
    paths:
      - 'webui/**'
      - 'simulator/**'
      - 'tools/data/qb-stable-lkg.json'
      - 'tools/data/qb-locale-lkg.json'
      - 'tools/qb-locale-overlay.mjs'
      - 'tests/fixtures/qb-release-catalog.lkg.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/pages-*.mjs'
      - 'tests/browser-driver.mjs'
      - '.github/workflows/pages.yml'
      - '.github/workflows/pages-source.yml'
      - '.github/workflows/promote.yml'
      - '.github/workflows/real-qb-full.yml'

permissions:
  actions: write
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact-ref Pages owner
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="$GITHUB_REF_NAME"
          case "$BRANCH" in
            dev|main) ;;
            *) echo "Unsupported Pages source branch: $BRANCH" >&2; exit 1 ;;
          esac

          REMOTE_SHA="$(gh api "/repos/$GITHUB_REPOSITORY/commits/$BRANCH" --jq '.sha')"
          if [ "$REMOTE_SHA" != "$GITHUB_SHA" ]; then
            echo "Pages source $BRANCH@$GITHUB_SHA is stale; current head is $REMOTE_SHA. A newer source run owns deployment."
            exit 0
          fi

          gh api --method POST \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/dispatches" \
            -f ref="$BRANCH" >/dev/null

          echo "Dispatched Virtual qB Pages on $BRANCH@$GITHUB_SHA. The deployment workflow now owns exact-SHA build/deploy/verify."
