name: Virtual qB Pages Source

# Source relay owns trigger choreography only. It never owns Pages deployment permissions.
# Every dev/main push reaches this lightweight relay and is classified from the full checked-out
# history. Everything unknown defaults to Pages-relevant so runtime/build changes cannot silently
# bypass deployment because of GitHub native path-filter diff limits.
on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main

permissions:
  actions: write
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect Pages-relevant source changes
        id: relevance
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch explicitly requests a Pages owner run."
            exit 0
          fi

          BEFORE="$BEFORE_SHA"
          case "$BEFORE" in
            ''|0000000000000000000000000000000000000000)
              echo "relevant=true" >> "$GITHUB_OUTPUT"
              echo "Push has no usable before SHA; fail closed by requiring a Pages owner run."
              exit 0
              ;;
          esac

          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Before SHA is unavailable locally; fail closed by requiring a Pages owner run."
            exit 0
          fi

          relevant=false
          # -z is required: repository docs use non-ASCII names and default git path quoting
          # would turn e.g. docs/中文.md into a quoted octal escape that no longer matches docs/*.
          while IFS= read -r -d '' path; do
            [ -n "$path" ] || continue
            case "$path" in
              docs/*|*.md|LICENSE|.github/workflows/ci.yml|.github/workflows/promote.yml|.github/workflows/real-qb-full.yml|.github/workflows/release.yml)
                echo "Pages-irrelevant change: $path"
                ;;
              *)
                echo "Pages-relevant change: $path"
                relevant=true
                break
                ;;
            esac
          done < <(git -c core.quotePath=false diff --name-only -z "$BEFORE" "$GITHUB_SHA")

          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          if [ "$relevant" != "true" ]; then
            echo "Only documentation/repository-only paths changed; Virtual qB Pages will not be dispatched."
          fi

      - name: Recover stale Pages browser verification
        if: ${{ steps.relevance.outputs.relevant == 'true' && github.ref_name == 'dev' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          NOW="$(date -u +%s)"
          mapfile -t RUNS < <(gh api \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/runs?branch=dev&event=workflow_dispatch&status=in_progress&per_page=20" \
            --jq '.workflow_runs[] | [.id, .head_sha, .created_at] | @tsv')

          for ROW in "${RUNS[@]}"; do
            IFS=$'\t' read -r RUN_ID RUN_SHA CREATED_AT <<< "$ROW"
            [ -n "$RUN_ID" ] || continue
            [ "$RUN_SHA" != "$GITHUB_SHA" ] || continue

            CREATED_EPOCH="$(date -u -d "$CREATED_AT" +%s)"
            AGE_SECONDS="$((NOW - CREATED_EPOCH))"
            if [ "$AGE_SECONDS" -lt 900 ]; then
              echo "Pages run $RUN_ID ($RUN_SHA) is only ${AGE_SECONDS}s old; preserving it."
              continue
            fi

            JOBS_JSON="$RUNNER_TEMP/pages-jobs-$RUN_ID.json"
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" > "$JOBS_JSON"
            DEPLOY_OK="$(jq '[.jobs[] | select(.name == "deploy" and .status == "completed" and .conclusion == "success")] | length' "$JOBS_JSON")"
            VERIFY_ACTIVE="$(jq '[.jobs[] | select(.name == "verify" and .status == "in_progress")] | length' "$JOBS_JSON")"

            if [ "$DEPLOY_OK" -eq 1 ] && [ "$VERIFY_ACTIVE" -eq 1 ]; then
              echo "Canceling stale Pages run $RUN_ID ($RUN_SHA): deploy already succeeded, verify has remained active for ${AGE_SECONDS}s."
              gh api --method POST "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/cancel" >/dev/null
            else
              echo "Preserving Pages run $RUN_ID ($RUN_SHA): it is not a post-deploy stale verify (deploy_ok=$DEPLOY_OK verify_active=$VERIFY_ACTIVE)."
            fi
          done

      - name: Dispatch exact-ref Pages owner
        if: ${{ steps.relevance.outputs.relevant == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="$GITHUB_REF_NAME"
          case "$BRANCH" in
            dev|main) ;;
            *) echo "Unsupported Pages source branch: $BRANCH" >&2; exit 1 ;;
          esac

          REMOTE_SHA="$(gh api "/repos/$GITHUB_REPOSITORY/commits/$BRANCH" --jq '.sha')"
          if [ "$REMOTE_SHA" != "$GITHUB_SHA" ]; then
            echo "Pages source $BRANCH@$GITHUB_SHA is stale; current head is $REMOTE_SHA. A newer source run owns deployment."
            exit 0
          fi

          gh api --method POST \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/dispatches" \
            -f ref="$BRANCH" >/dev/null

          echo "Dispatched Virtual qB Pages on $BRANCH@$GITHUB_SHA because a Pages/runtime input changed."
