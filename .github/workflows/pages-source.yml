name: Virtual qB Pages Source

# Source relay owns trigger choreography only. It never owns Pages deployment permissions.
# Pure documentation pushes are filtered before runner allocation. Every other dev/main push
# reaches this lightweight relay and is classified again; everything unknown defaults to
# Pages-relevant so a new runtime/build input cannot silently bypass deployment.
on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'

permissions:
  actions: write
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect Pages-relevant source changes
        id: relevance
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch explicitly requests a Pages owner run."
            exit 0
          fi

          BEFORE="$BEFORE_SHA"
          case "$BEFORE" in
            ''|0000000000000000000000000000000000000000)
              echo "relevant=true" >> "$GITHUB_OUTPUT"
              echo "Push has no usable before SHA; fail closed by requiring a Pages owner run."
              exit 0
              ;;
          esac

          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Before SHA is unavailable locally; fail closed by requiring a Pages owner run."
            exit 0
          fi

          relevant=false
          # -z is required: repository docs use non-ASCII names and default git path quoting
          # would turn e.g. docs/中文.md into a quoted octal escape that no longer matches docs/*.
          while IFS= read -r -d '' path; do
            [ -n "$path" ] || continue
            case "$path" in
              docs/*|*.md|LICENSE|.github/workflows/ci.yml|.github/workflows/promote.yml|.github/workflows/real-qb-full.yml|.github/workflows/release.yml)
                echo "Pages-irrelevant change: $path"
                ;;
              *)
                echo "Pages-relevant change: $path"
                relevant=true
                break
                ;;
            esac
          done < <(git -c core.quotePath=false diff --name-only -z "$BEFORE" "$GITHUB_SHA")

          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          if [ "$relevant" != "true" ]; then
            echo "Only documentation/repository-only paths changed; Virtual qB Pages will not be dispatched."
          fi

      - name: Dispatch exact-ref Pages owner
        if: ${{ steps.relevance.outputs.relevant == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="$GITHUB_REF_NAME"
          case "$BRANCH" in
            dev|main) ;;
            *) echo "Unsupported Pages source branch: $BRANCH" >&2; exit 1 ;;
          esac

          REMOTE_SHA="$(gh api "/repos/$GITHUB_REPOSITORY/commits/$BRANCH" --jq '.sha')"
          if [ "$REMOTE_SHA" != "$GITHUB_SHA" ]; then
            echo "Pages source $BRANCH@$GITHUB_SHA is stale; current head is $REMOTE_SHA. A newer source run owns deployment."
            exit 0
          fi

          gh api --method POST \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/dispatches" \
            -f ref="$BRANCH" >/dev/null

          echo "Dispatched Virtual qB Pages on $BRANCH@$GITHUB_SHA because a Pages/runtime input changed."
