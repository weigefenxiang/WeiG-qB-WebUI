name: A72 Test Prerelease

on:
  push:
    branches:
      - test/A72

permissions:
  contents: write
  actions: read

concurrency:
  group: a72-test-publication
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ contains(github.event.head_commit.message, '[A72-publish]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact test-branch SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Verify final complete A72 test source
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test
          npm run test:compat
          npm run test:simulator
          test "$(cat VERSION)" = "1.2.1"
          test "$(cat webui/VERSION)" = "1.2.1"
      - name: Require successful exact-SHA push CI before creating any prerelease Tag
        timeout-minutes: 35
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          validated=0
          for attempt in $(seq 1 120); do
            record="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=test%2FA72&event=push&per_page=60" \
              | jq -c --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .event == "push")] | sort_by(.id) | last // empty')"
            if [ -z "$record" ]; then sleep 10; continue; fi
            status="$(jq -r '.status' <<<"$record")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$record")"
            if [ "$status" = completed ]; then
              if [ "$conclusion" != success ]; then
                echo "A72 exact-SHA CI is not successful: $conclusion" >&2
                exit 1
              fi
              validated=1
              break
            fi
            sleep 10
          done
          if [ "$validated" -ne 1 ]; then
            echo 'No successful completed CI for exact A72 publish SHA; Tag creation is blocked.' >&2
            exit 1
          fi
      - name: Materialize exact-SHA WebUI archive with canonical builder
        run: |
          set -euo pipefail
          node tools/build-webui-dist.mjs --webui-root=webui --out=release --sha="$GITHUB_SHA" --version=1.2.1
          cp release/weig-qb-webui.zip release/A72.zip
          (cd release && sha256sum A72.zip >> SHA256SUMS && sha256sum -c SHA256SUMS)
          test "$(unzip -p release/A72.zip weig-qb-webui/GIT_SHA | tr -d '\r\n')" = "$GITHUB_SHA"
          test "$(unzip -p release/A72.zip weig-qb-webui/VERSION | tr -d '\r\n')" = '1.2.1'
          test "$(jq -r .gitSha release/manifest.json)" = "$GITHUB_SHA"
      - name: Publish immutable A72 Prerelease only at final verified SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          actual="$(gh api "repos/$GITHUB_REPOSITORY/branches/test/A72" --jq '.commit.sha')"
          test "$actual" = "$GITHUB_SHA" || { echo 'test/A72 advanced; refusing stale publication' >&2; exit 1; }
          if gh release view test-A72 >/dev/null 2>&1; then
            echo 'test-A72 Prerelease exists; refusing to replace immutable test assets' >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/test-A72" >/dev/null 2>&1; then
            echo 'test-A72 tag exists; refusing to repoint or attach assets to an existing tag' >&2
            exit 1
          fi
          # Atomically reserve the previously unused Tag at the already-verified exact SHA.
          # If the asset upload fails, the Tag remains for explicit recovery; never silently rewrite it.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref='refs/tags/test-A72' -f sha="$GITHUB_SHA" >/dev/null
          gh release create test-A72 \
            release/A72.zip \
            release/weig-qb-webui.zip \
            release/weig-qb-webui.tar.gz \
            release/manifest.json \
            release/SHA256SUMS \
            release/install.sh \
            release/install.ps1 \
            --target "$GITHUB_SHA" \
            --title "WeiG WebUI A72 (1.2.1 test)" \
            --notes "A72 isolated test build, exact Git SHA $GITHUB_SHA. This is not a stable release." \
            --prerelease --latest=false --verify-tag
          echo "A72: https://github.com/$GITHUB_REPOSITORY/releases/download/test-A72/A72.zip"
