name: Fix Windows fixture newline

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/weigg-fix-windows-fixture.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Patch newline-stable Windows fixture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/windows-config-encoding.ps1')
          data = path.read_bytes()
          old = b'@ -replace "`n","`r`n"'
          new = br'''@ -replace '\r?\n',"`r`n"'''
          if data.count(old) != 1:
              raise SystemExit(f'expected exactly one fixture newline target, found {data.count(old)}')
          path.write_bytes(data.replace(old, new))
          PY
          git diff --check

      - name: Validate qB config safety contract on Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File 'tests\windows-config-encoding.ps1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit verified fixture fix
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "$GITHUB_SHA"
          rm .github/workflows/weigg-fix-windows-fixture.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No changes to commit' >&2; exit 1; }
          git commit -m 'test: normalize Windows qB fixture newlines [candidate]'
          git push origin HEAD:dev
