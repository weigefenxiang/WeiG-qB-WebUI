name: qB Stable Source Admission Review

# Source-only admission staging. This workflow never promotes Frozen/Product assets
# and never writes Git refs; semantic census and real-qB product gates remain separate.
on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/qb-stable-source-review.yml
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Run containing a source-only stable candidate artifact
        required: true
        default: '37708522138'
        type: string
      candidate_artifact:
        description: Exact source-only candidate artifact name
        required: true
        default: qb-5.2.4-source-candidate-c661820919ac5f401a9b4390dcf304b9e5372805
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: qb-stable-source-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  review:
    name: Stage exact official source candidate without admission
    if: ${{ github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact public dev source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Checkout official qB release tags
        uses: actions/checkout@v7
        with:
          repository: qbittorrent/qBittorrent
          path: upstream-qb
          fetch-depth: 0
          fetch-tags: true
          filter: blob:none
          persist-credentials: false
      - name: Reuse existing source-only candidate evidence
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.candidate_artifact || 'qb-5.2.4-source-candidate-c661820919ac5f401a9b4390dcf304b9e5372805' }}
          run-id: ${{ inputs.candidate_run_id || '37708522138' }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: source-candidate
      - name: Verify and stage only official-source identity
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t source_files < <(find source-candidate -maxdepth 1 -type f -name 'qb-*-admission-candidate.json' -print | sort)
          if [ "${#source_files[@]}" -ne 1 ]; then
            echo "Expected exactly one official source candidate in the downloaded artifact." >&2
            exit 1
          fi
          SOURCE="${source_files[0]}"
          test -s "$SOURCE"
          node tools/qb-stable-admission.mjs verify
          node audits/qb-stable-admission-contract.mjs
          node tools/qb-stable-admission.mjs verify-candidate-source upstream-qb --candidate="$SOURCE" --output="$RUNNER_TEMP/source-identity.json"
          node tools/qb-stable-admission.mjs stage-candidate upstream-qb --candidate="$SOURCE" --out="$RUNNER_TEMP/admission-stage"
          node tools/qb-stable-admission.mjs review-upstream upstream-qb --candidate="$SOURCE" --output="$RUNNER_TEMP/admission-stage/upstream-inventory.json"
          node tools/qb-stable-admission.mjs report --candidate="$SOURCE" --output="$RUNNER_TEMP/admission-stage/source-diff.md"
          cp "$RUNNER_TEMP/source-identity.json" "$RUNNER_TEMP/admission-stage/source-identity.json"
          echo "### Official source identity: verified" >> "$GITHUB_STEP_SUMMARY"
          echo "Frozen/Locale/Settings/Action/Torrent/Detail/RSS/Copy and real-qB WeiG product admission: **PENDING**" >> "$GITHUB_STEP_SUMMARY"
      - name: Enrich only newly discovered official release source facts
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/admission-stage"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const stage=path.join(process.env.RUNNER_TEMP,'admission-stage');
          const catalog=JSON.parse(fs.readFileSync(path.join(stage,'qb-release-catalog.lkg.json'),'utf8'));
          if(!Array.isArray(catalog)||!catalog.length)throw new Error('Candidate stage has no exact official release profile.');
          fs.writeFileSync(path.join(stage,'latest-source-only.json'),JSON.stringify([catalog.at(-1)],null,2)+'\n');
          NODE
          node tools/qb-locale-source.mjs upstream-qb "$STAGE/latest-source-only.json" "$STAGE/latest-enriched.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {assertEnrichedCatalogBinding} from './tools/qb-stable-admission.mjs';
          const stage=path.join(process.env.RUNNER_TEMP,'admission-stage');
          const source=JSON.parse(fs.readFileSync(path.join(stage,'latest-source-only.json'),'utf8'));
          const enriched=JSON.parse(fs.readFileSync(path.join(stage,'latest-enriched.json'),'utf8'));
          const verified=assertEnrichedCatalogBinding(source,enriched);
          fs.writeFileSync(path.join(stage,'latest-enriched-verification.json'),JSON.stringify(verified,null,2)+'\n');
          console.log(JSON.stringify(verified));
          NODE
          echo "Latest stable official Locale/Settings/qB-owned Copy source enrichment: **SOURCE VERIFIED; NOT YET ADMITTED**" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve source-only staging evidence
        uses: actions/upload-artifact@v7
        with:
          name: qb-stable-source-staged-${{ github.sha }}
          path: ${{ runner.temp }}/admission-stage
          if-no-files-found: error
          retention-days: 7
