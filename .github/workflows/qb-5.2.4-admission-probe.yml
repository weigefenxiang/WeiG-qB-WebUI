name: qB 5.2.4 Admission Probe

on:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: qb-5-2-4-admission-${{ github.sha }}
  cancel-in-progress: false

jobs:
  exact-source:
    name: qB 5.2.4 exact source / WebAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/checkout@v7
        with:
          repository: qbittorrent/qBittorrent
          ref: release-5.2.4
          path: upstream-qb
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Verify exact release identity and WebAPI
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream-qb describe --tags --exact-match HEAD)" = "release-5.2.4"
          grep -Eq 'API_VERSION[[:space:]]*\{[[:space:]]*2[[:space:]]*,[[:space:]]*15[[:space:]]*,[[:space:]]*1[[:space:]]*\}' upstream-qb/src/webui/webapplication.h
          git -C upstream-qb fetch --force origin refs/tags/release-4.1.0:refs/tags/release-4.1.0
          node tests/upstream-release-audit.mjs upstream-qb --refs=release-4.1.0,release-5.2.4

  real-webapi:
    name: qB 5.2.4 real daemon identity / WebAPI
    runs-on: ubuntu-latest
    steps:
      - name: Probe official qB 5.2.4 container
        shell: bash
        run: |
          set -euo pipefail
          image='qbittorrentofficial/qbittorrent-nox:5.2.4-1'
          docker pull "$image"
          net="weig-qb-524-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          name="weig-qb-524-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup(){ docker rm -f "$name" >/dev/null 2>&1 || true; docker network rm "$net" >/dev/null 2>&1 || true; }
          trap cleanup EXIT INT TERM
          docker network create --internal "$net" >/dev/null
          docker run -d --name "$name" --network "$net" -e QBT_LEGAL_NOTICE=confirm "$image" --webui-port=8080 >/dev/null
          ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$name")"
          if [ -z "$ip" ]; then
            echo 'Container has no assigned internal Docker IP' >&2
            docker inspect -f 'state={{.State.Status}} exit={{.State.ExitCode}} networks={{json .NetworkSettings.Networks}}' "$name" >&2
            docker logs "$name" 2>&1 | sed -E 's/(temporary password is provided for this session: ).*/\\1[REDACTED]/' >&2 || true
            exit 1
          fi
          echo "qB internal-network IP assigned; starting readiness checks"
          # The official container generates its temporary password asynchronously.
          # A 403/404 response does not prove the authenticated daemon is ready.
          password=''
          code=''
          for i in $(seq 1 120); do
            if [ "$(docker inspect -f '{{.State.Running}}' "$name")" != true ]; then
              echo 'qB container exited during initialization' >&2
              docker logs "$name" 2>&1 | sed -E 's/(temporary password is provided for this session: ).*/\\1[REDACTED]/' >&2
              exit 1
            fi
            password="$({ docker logs "$name" 2>&1 || true; } | sed -n 's/.*temporary password is provided for this session: //p' | tail -n 1 | tr -d '\r')"
            if [ -n "$password" ]; then
              code="$(curl -sS --max-time 2 -o /dev/null -w '%{http_code}' -H 'Host: localhost' "http://$ip:8080/api/v2/app/version" 2>/dev/null || true)"
              if [ "$code" != 000 ] && [ -n "$code" ]; then break; fi
            fi
            sleep 1
          done
          if [ -z "$password" ] || [ -z "${code:-}" ] || [ "$code" = 000 ]; then
            echo 'qB 5.2.4 did not reach password-and-HTTP readiness' >&2
            docker logs "$name" 2>&1 | sed -E 's/(temporary password is provided for this session: ).*/\\1[REDACTED]/' >&2
            exit 1
          fi
          headers="$(mktemp)"
          body="$(mktemp)"
          code="$(curl -sS --max-time 5 -D "$headers" -o "$body" -w '%{http_code}' -H 'Host: localhost' -X POST --data-urlencode 'username=admin' --data-urlencode "password=$password" "http://$ip:8080/api/v2/auth/login")"
          case "$code" in 200|204) ;; *) echo "qB login HTTP $code" >&2; exit 1;; esac
          sid="$(tr -d '\r' < "$headers" | grep -i '^set-cookie:' | grep -oiE '(QBT_SID_[0-9]+|SID)=[^;[:space:]]+' | head -n 1 || true)"
          if [ -z "$sid" ]; then
            echo "qB login HTTP $code returned no SID cookie" >&2
            echo "Set-Cookie header count: $(grep -ic '^Set-Cookie:' "$headers" || true)" >&2
            sed -nE 's/^[Ss]et-[Cc]ookie:[[:space:]]*([^=;[:space:]]+)=.*/Cookie key: \1/p' "$headers" >&2
            exit 1
          fi
          if ! qb="$(curl -fsS --max-time 5 -H 'Host: localhost' -H "Cookie: $sid" "http://$ip:8080/api/v2/app/version" | tr -d '\r\n')"; then
            echo 'Authenticated qB app/version request failed' >&2; exit 1
          fi
          if ! api="$(curl -fsS --max-time 5 -H 'Host: localhost' -H "Cookie: $sid" "http://$ip:8080/api/v2/app/webapiVersion" | tr -d '\r\n')"; then
            echo 'Authenticated qB app/webapiVersion request failed' >&2; exit 1
          fi
          printf 'Authenticated qB identity: qb=%s webapi=%s\n' "$qb" "$api"
          case "$qb" in 5.2.4|v5.2.4) ;; *) echo "unexpected qB identity: $qb" >&2; exit 1;; esac
          test "$api" = "2.15.1"
          printf 'QB_5_2_4_REAL_WEBAPI_PASS qb=%s webapi=%s image=%s\n' "$qb" "$api" "$image"
