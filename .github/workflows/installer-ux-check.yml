name: Installer UX Check

on:
  push:
    branches:
      - installer-ux-20260907

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Product and installer contracts
        run: npm test
      - name: Linux shell syntax and CLI
        shell: bash
        run: |
          set -euo pipefail
          sh -n installers/install.sh
          sh installers/install.sh --help | grep -F -- '--version VERSION'
          sh installers/install.sh --help | grep -F -- '--configure'
          if sh installers/install.sh --dev --version 0.3.60 >/tmp/out 2>/tmp/err; then
            echo 'Expected --dev + --version to fail.' >&2
            exit 1
          fi
          grep -F -- '--version and --dev' /tmp/err
          if sh installers/install.sh --version nope >/tmp/out 2>/tmp/err; then
            echo 'Expected invalid --version to fail.' >&2
            exit 1
          fi
          grep -F -- 'Invalid Release version' /tmp/err

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $null = [scriptblock]::Create((Get-Content 'installers/install.ps1' -Raw))
          Write-Host 'PowerShell installer syntax parsed.'
      - name: PowerShell CLI help and conflict checks
        shell: powershell
        run: |
          $help = & powershell -NoProfile -ExecutionPolicy Bypass -File .\installers\install.ps1 -help 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'Installer -help failed.' }
          if ($help -notmatch '-version VERSION') { throw 'Missing -version help.' }
          if ($help -notmatch '-configure') { throw 'Missing -configure help.' }
          $stdout = Join-Path $env:TEMP 'weigg-conflict-out.txt'
          $stderr = Join-Path $env:TEMP 'weigg-conflict-err.txt'
          $p = Start-Process powershell -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File','.\installers\install.ps1','-dev','-version','0.3.60') -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if ($p.ExitCode -eq 0) { throw 'Expected -dev + -version to fail.' }
          $conflict = ((Get-Content $stdout -Raw -ErrorAction SilentlyContinue) + (Get-Content $stderr -Raw -ErrorAction SilentlyContinue))
          if ($conflict -notmatch '-version and -dev') { throw 'Expected version/dev conflict message.' }
