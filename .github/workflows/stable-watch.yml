name: Future Stable Watch

on:
  schedule:
    - cron: '26 19 * * 5'
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/stable-watch.yml'
      - 'tools/qb-stable-admission.mjs'
      - 'tools/qb-product-capability-diff.mjs'
      - 'tools/qb-release-catalog.mjs'
      - 'tools/qb-release-tags.mjs'
      - 'tools/qb-catalog-evolution.mjs'
      - 'tests/upstream-release-audit.mjs'
      - 'tests/full-stable-product-compat.mjs'
      - 'tests/compat-architecture-contract.mjs'

permissions:
  contents: write

concurrency:
  group: future-stable-watch-dev
  cancel-in-progress: false

jobs:
  stable_watch:
    name: Discover and admit future official stable releases
    if: ${{ github.repository == 'weigefenxiang/WeiG-qB-WebUI' && (github.event_name != 'push' || github.ref == 'refs/heads/dev') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'dev' }}
          fetch-depth: 0
      - name: Capture exact dev source SHA
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify frozen last-known-good catalog
        run: node tools/qb-stable-admission.mjs verify
      - name: Fetch official stable tag names only
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --refs --tags https://github.com/qbittorrent/qBittorrent.git 'refs/tags/release-*' \
            | awk '{sub("refs/tags/", "", $2); print $2}' \
            > "$RUNNER_TEMP/upstream-stable-tags.txt"
      - name: Discover official stable tags after LKG
        id: discover
        shell: bash
        run: |
          set -euo pipefail
          node tools/qb-stable-admission.mjs discover-tags "$RUNNER_TEMP/upstream-stable-tags.txt" --output="$RUNNER_TEMP/stable-discovery.json"
          HAS_NEW="$(node -e "const x=require(process.argv[1]);process.stdout.write(String(x.hasNew))" "$RUNNER_TEMP/stable-discovery.json")"
          NEW_TAGS="$(node -e "const x=require(process.argv[1]);process.stdout.write(x.newTags.join(','))" "$RUNNER_TEMP/stable-discovery.json")"
          NEW_VERSIONS="$(node -e "const x=require(process.argv[1]);process.stdout.write(x.newVersions.join(','))" "$RUNNER_TEMP/stable-discovery.json")"
          if [ -n "$NEW_TAGS" ]; then AUDIT_REFS="release-4.1.0,$NEW_TAGS"; else AUDIT_REFS="release-4.1.0"; fi
          printf 'has_new=%s\nnew_tags=%s\nnew_versions=%s\naudit_refs=%s\n' "$HAS_NEW" "$NEW_TAGS" "$NEW_VERSIONS" "$AUDIT_REFS" >> "$GITHUB_OUTPUT"
      - name: No new official stable summary
        if: ${{ steps.discover.outputs.has_new != 'true' }}
        run: echo 'No new qBittorrent official stable tag after the frozen LKG; exiting immediately without upstream source checkout, historical product regression, source extraction, or repository write.' >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout qBittorrent upstream source only after discovery
        if: ${{ steps.discover.outputs.has_new == 'true' }}
        uses: actions/checkout@v7
        with:
          repository: qbittorrent/qBittorrent
          path: upstream-qb
          fetch-depth: 0
          fetch-tags: true
          filter: blob:none
      - name: Source-extract only new stable profiles onto frozen LKG
        if: ${{ steps.discover.outputs.has_new == 'true' }}
        run: node tools/qb-release-catalog.mjs upstream-qb --base-catalog=tests/fixtures/qb-release-catalog.lkg.json --output="$RUNNER_TEMP/qb-release-catalog.candidate.json"
      - name: Audit minimum floor plus newly discovered stable source refs
        if: ${{ steps.discover.outputs.has_new == 'true' }}
        run: node tests/upstream-release-audit.mjs upstream-qb --refs=${{ steps.discover.outputs.audit_refs }}
      - name: Build focused admission product catalog
        if: ${{ steps.discover.outputs.has_new == 'true' }}
        run: node tools/qb-stable-admission.mjs product-catalog --candidate="$RUNNER_TEMP/qb-release-catalog.candidate.json" --output="$RUNNER_TEMP/qb-release-catalog.admission-product.json"
      - name: Product compatibility gate for floor previous LKG and new profiles
        if: ${{ steps.discover.outputs.has_new == 'true' }}
        run: node tests/full-stable-product-compat.mjs "$RUNNER_TEMP/qb-release-catalog.admission-product.json"
      - name: Repository contracts and architecture guard before admission
        if: ${{ steps.discover.outputs.has_new == 'true' }}
        run: npm test
      - name: Build upstream and product capability diffs
        if: ${{ steps.discover.outputs.has_new == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          node tools/qb-stable-admission.mjs report --candidate="$RUNNER_TEMP/qb-release-catalog.candidate.json" --output="$RUNNER_TEMP/upstream-stable-diff.md"
          node tools/qb-product-capability-diff.mjs --base=tests/fixtures/qb-release-catalog.lkg.json --candidate="$RUNNER_TEMP/qb-release-catalog.candidate.json" --output="$RUNNER_TEMP/product-capability-diff.md"
          cat "$RUNNER_TEMP/upstream-stable-diff.md" "$RUNNER_TEMP/product-capability-diff.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare next LKG manifest only after all gates pass
        if: ${{ steps.discover.outputs.has_new == 'true' }}
        env:
          WEIGG_VALIDATION_SHA: ${{ steps.source.outputs.sha }}
        run: node tools/qb-stable-admission.mjs promote-manifest --candidate="$RUNNER_TEMP/qb-release-catalog.candidate.json" --output="$RUNNER_TEMP/qb-stable-lkg.next.json"
      - name: Upload admission evidence
        if: ${{ steps.discover.outputs.has_new == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: stable-admission-${{ steps.source.outputs.sha }}-${{ steps.discover.outputs.new_versions }}
          path: |
            ${{ runner.temp }}/stable-discovery.json
            ${{ runner.temp }}/qb-release-catalog.candidate.json
            ${{ runner.temp }}/qb-release-catalog.admission-product.json
            ${{ runner.temp }}/upstream-stable-diff.md
            ${{ runner.temp }}/product-capability-diff.md
            ${{ runner.temp }}/qb-stable-lkg.next.json
          if-no-files-found: error
          retention-days: 30
      - name: Safe fast-forward admission to dev
        if: ${{ steps.discover.outputs.has_new == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/qb-release-catalog.candidate.json" tests/fixtures/qb-release-catalog.lkg.json
          cp "$RUNNER_TEMP/qb-stable-lkg.next.json" tools/data/qb-stable-lkg.json
          node tools/qb-stable-admission.mjs verify
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "${{ steps.source.outputs.sha }}" || { echo 'dev moved during stable admission; LKG remains unchanged on remote.' >&2; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/fixtures/qb-release-catalog.lkg.json tools/data/qb-stable-lkg.json
          git diff --cached --quiet && { echo 'No LKG change to admit.'; exit 0; }
          git commit -m "Phase D: admit qB stable ${{ steps.discover.outputs.new_versions }}"
          git push origin HEAD:dev
      - name: Mark failed new stable as PENDING_REVIEW
        if: ${{ failure() && steps.discover.outputs.has_new == 'true' }}
        shell: bash
        run: |
          {
            echo '## PENDING_REVIEW'
            echo
            echo 'A new official stable was discovered, but at least one source/parser/product/repository/admission gate failed. The candidate was not admitted and the Last Known Good catalog remains the release baseline.'
          } >> "$GITHUB_STEP_SUMMARY"
