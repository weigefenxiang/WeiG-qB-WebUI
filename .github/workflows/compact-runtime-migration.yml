name: Compact runtime migration

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/compact-runtime-migration.yml'
      - '.bootstrap/0.3.99/**'

permissions:
  contents: write

env:
  EXPECTED_PARENT: ${{ github.sha }}

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Verify exact dev owner
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/dev'
          test "$(git rev-parse HEAD)" = "$EXPECTED_PARENT"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Apply Registry evidence migration
        run: |
          python3 .bootstrap/0.3.99/migrate_phase_a.py
          python3 .bootstrap/0.3.99/migrate_phase_a_fix1.py
          python3 .bootstrap/0.3.99/migrate_phase_a_fix2.py
      - name: Validate syntax and repository contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check tools/qb-compact-runtime.mjs
          node --check tools/qb-product-capability-diff.mjs
          npm test
          node tests/release-compat.mjs
      - name: Validate frozen 65-profile product owners
        shell: bash
        run: |
          set -euo pipefail
          CATALOG=tests/fixtures/qb-release-catalog.lkg.json
          node tests/full-stable-product-compat.mjs "$CATALOG"
          node tests/full-stable-core-write-compat.mjs "$CATALOG"
          node tests/full-stable-app-aux-compat.mjs "$CATALOG"
          node tests/full-stable-baseline-write-compat.mjs "$CATALOG"
          node tests/full-stable-detail-compat.mjs "$CATALOG"
          node tests/full-stable-torrent-creator-compat.mjs "$CATALOG"
      - name: Validate migrated Chrome evidence
        shell: bash
        env:
          WEIGG_BROWSER_CHANNEL: chrome
        run: |
          set -euo pipefail
          command -v google-chrome
          node tests/browser-feature-parity.mjs
          node tests/browser-adaptive-ui.mjs
          node tests/browser-sidebar-capability-visual.mjs
          node tests/browser-torrent-field-provenance.mjs
      - name: Commit only after all validation passes
        shell: bash
        run: |
          set -euo pipefail
          git add tools/qb-compact-runtime.mjs tools/qb-product-capability-diff.mjs tests
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Migration produced no changes.' >&2
            exit 1
          fi
          REMOTE_SHA="$(git ls-remote origin refs/heads/dev | awk '{print $1}')"
          if [ "$REMOTE_SHA" != "$EXPECTED_PARENT" ]; then
            echo "Refusing stale write: expected dev=$EXPECTED_PARENT actual=$REMOTE_SHA" >&2
            exit 1
          fi
          git config user.name 'weigefenxiang'
          git config user.email '119787190+weigefenxiang@users.noreply.github.com'
          git commit -m 'test: migrate compatibility evidence to registry'
          git push origin HEAD:dev
          echo "Committed validated migration $(git rev-parse HEAD)"
