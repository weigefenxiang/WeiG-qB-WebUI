name: Upstream Compatibility Audit

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  representative_qb_baselines:
    name: qB minimum + latest 5.x.0 compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WeiG qB WebUI
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Checkout qBittorrent upstream tip
        uses: actions/checkout@v7
        with:
          repository: qbittorrent/qBittorrent
          path: upstream-qb
          fetch-depth: 1
      - name: Resolve latest qB 5.x.0 generations
        id: generations
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t generations < <(
            git -C upstream-qb ls-remote --refs --tags origin 'refs/tags/release-5.*.0' \
              | awk '{sub("refs/tags/","",$2); print $2}' \
              | sort -V
          )
          test "${#generations[@]}" -ge 1
          latest="${generations[${#generations[@]}-1]}"
          if [ "${#generations[@]}" -ge 2 ]; then
            previous="${generations[${#generations[@]}-2]}"
          else
            previous="$latest"
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          printf 'Latest qB generation: %s; previous: %s\n' "$latest" "$previous"
      - name: Fetch representative qB releases
        shell: bash
        run: |
          set -euo pipefail
          min=release-4.1.9.1
          previous='${{ steps.generations.outputs.previous }}'
          latest='${{ steps.generations.outputs.latest }}'
          git -C upstream-qb fetch --depth=1 origin \
            "refs/tags/$min:refs/tags/$min" \
            "refs/tags/$previous:refs/tags/$previous" \
            "refs/tags/$latest:refs/tags/$latest"
      - name: Audit minimum and current qB generations
        shell: bash
        run: |
          set -euo pipefail
          min=release-4.1.9.1
          previous='${{ steps.generations.outputs.previous }}'
          latest='${{ steps.generations.outputs.latest }}'
          refs="$min,$previous,$latest"
          node tests/upstream-release-audit.mjs upstream-qb "--refs=$refs"
