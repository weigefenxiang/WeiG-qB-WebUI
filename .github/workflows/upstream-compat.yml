name: Upstream Compatibility Audit

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/upstream-compat.yml'
      - 'tools/qb-release-catalog.mjs'
      - 'tools/qb-release-tags.mjs'
      - 'tools/qb-source-parsers.mjs'
      - 'tools/qb-preference-semantics.mjs'
      - 'tools/qb-torrent-surface-parsers.mjs'
      - 'tools/qb-torrent-fields-parser.mjs'
      - 'tools/qb-detail-surface-parsers.mjs'
      - 'tools/qb-action-surface-parsers.mjs'
      - 'tools/qb-catalog-evolution.mjs'
      - 'tools/qb-catalog-quality.mjs'
      - 'tools/qb-webapi-evolution.mjs'
      - 'tools/qb-webapi-evolution-audit.mjs'
      - 'tools/data/qb-webapi-evolution-ledger.json'
      - 'tests/upstream-release-audit.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full_qb_stable_history:
    name: Full qB stable WebAPI evolution audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WeiG qB WebUI
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Checkout qBittorrent upstream with full stable history
        uses: actions/checkout@v7
        with:
          repository: qbittorrent/qBittorrent
          path: upstream-qb
          fetch-depth: 0
          fetch-tags: true
          filter: blob:none
      - name: Generate source-derived catalog for every supported stable release
        run: node tools/qb-release-catalog.mjs upstream-qb --output=/tmp/qb-release-catalog.json
      - name: Audit every official stable qB release from 4.1.0
        run: node tests/upstream-release-audit.mjs upstream-qb
      - name: Audit WebAPI evolution chronology and classification coverage
        run: node tools/qb-webapi-evolution-audit.mjs upstream-qb /tmp/qb-release-catalog.json
