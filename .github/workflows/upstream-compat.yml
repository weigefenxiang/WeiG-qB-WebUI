name: Upstream Compatibility Audit

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  representative_qb_baselines:
    name: qB 4.1.9.1 + 5.2.0 compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WeiG qB WebUI
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Checkout qBittorrent upstream tip
        uses: actions/checkout@v4
        with:
          repository: qbittorrent/qBittorrent
          path: upstream-qb
          fetch-depth: 1
      - name: Fetch representative qB release tags only
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream-qb fetch --depth=1 origin \
            refs/tags/release-4.1.9.1:refs/tags/release-4.1.9.1 \
            refs/tags/release-5.2.0:refs/tags/release-5.2.0
      - name: Audit legacy and modern baselines
        run: node tests/upstream-release-audit-v037.mjs upstream-qb --refs=release-4.1.9.1,release-5.2.0
