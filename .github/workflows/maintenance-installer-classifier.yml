name: Maintenance Installer Classifier Repair

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ contains(github.event.head_commit.message, '[installer-classifier-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact staging commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply classifier repair
        run: python3 tools/maintenance-installer-classifier.py

      - name: Validate repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          bash -n installers/install.sh
          node tests/dev-distribution-contract.mjs
          npm test

      - name: Commit repair on current dev head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "$GITHUB_SHA"
          git rm .github/workflows/maintenance-installer-classifier.yml tools/maintenance-installer-classifier.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add installers/install.ps1 installers/install.sh .github/workflows/pages.yml tests/dev-distribution-contract.mjs
          git diff --cached --check
          git commit -m 'fix: align installer Pages payload classifier'
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "$GITHUB_SHA"
          git push origin HEAD:dev
