name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve exact reusable dev candidate artifact
        id: verify
        uses: actions/github-script@v9
        env:
          RELEASE_SHA: ${{ github.sha }}
        with:
          script: |
            const sha = String(process.env.RELEASE_SHA || '').trim().toLowerCase();
            if (!/^[0-9a-f]{40}$/.test(sha)) {
              core.setFailed(`Release SHA is invalid: ${sha}`);
              return;
            }

            const {owner, repo} = context.repo;
            const main = await github.rest.repos.getBranch({owner, repo, branch: 'main'});
            const mainSha = main.data.commit.sha.toLowerCase();
            if (mainSha !== sha) {
              core.setFailed(`Tag ${context.ref.replace('refs/tags/', '')} points to ${sha}, but current main is ${mainSha}. Refusing to publish a non-current stable commit.`);
              return;
            }

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: 'ci.yml',
              branch: 'dev',
              status: 'success',
              per_page: 100
            });
            const exactRuns = runs.filter(run => run.head_sha && run.head_sha.toLowerCase() === sha && run.conclusion === 'success');
            const artifactName = `release-candidate-${sha}`;
            let validated = null;
            let artifact = null;
            for (const run of exactRuns) {
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner,
                repo,
                run_id: run.id,
                per_page: 100
              });
              const candidate = artifacts.find(item => item.name === artifactName && !item.expired);
              if (candidate) {
                validated = run;
                artifact = candidate;
                break;
              }
            }
            if (!validated || !artifact) {
              core.setFailed(`No successful dev full-candidate artifact ${artifactName} exists for exact release SHA ${sha}.`);
              return;
            }

            core.info(`Reusing dev candidate CI run #${validated.run_number}: ${validated.html_url}`);
            core.info(`Reusing validated artifact ${artifact.name} (${artifact.id})`);
            core.setOutput('run_id', String(validated.id));
            core.setOutput('artifact_name', artifactName);
            core.setOutput('artifact_id', String(artifact.id));

      - name: Checkout exact release source for version identity only
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download validated dev release candidate
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.verify.outputs.artifact_name }}
          path: release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.verify.outputs.run_id }}

      - name: Verify version, candidate integrity and exact SHA
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          test -f release/WeiG-qB-WebUI.zip
          test -f release/SHA256SUMS
          test -f release/CANDIDATE_SHA
          test "$(tr -d '\r\n' < release/CANDIDATE_SHA)" = "$GITHUB_SHA"
          (cd release && sha256sum -c SHA256SUMS)
          test "$(unzip -p release/WeiG-qB-WebUI.zip WeiG-qB-WebUI/GIT_SHA | tr -d '\r\n')" = "$GITHUB_SHA"
          test "$(unzip -p release/WeiG-qB-WebUI.zip WeiG-qB-WebUI/VERSION | tr -d '\r\n')" = "$VERSION"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          gh release create "${GITHUB_REF_NAME}" \
            release/WeiG-qB-WebUI.zip \
            release/SHA256SUMS \
            --verify-tag \
            --latest \
            --generate-notes \
            --notes $'Latest stable release of WeiG qB WebUI.\n\nVerified compatibility: qBittorrent 4.1.0–5.2.3.' \
            --title "WeiG qB WebUI ${VERSION}"
