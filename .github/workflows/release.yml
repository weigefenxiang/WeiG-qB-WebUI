name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve successful promotion certification
        id: resolve
        uses: actions/github-script@v9
        env:
          RELEASE_SHA: ${{ github.sha }}
        with:
          script: |
            const sha=String(process.env.RELEASE_SHA||'').trim().toLowerCase();
            if(!/^[0-9a-f]{40}$/.test(sha)){core.setFailed(`Release SHA is invalid: ${sha}`);return;}
            const {owner,repo}=context.repo;
            const main=await github.rest.repos.getBranch({owner,repo,branch:'main'});
            const mainSha=main.data.commit.sha.toLowerCase();
            if(mainSha!==sha){
              core.setFailed(`Tag ${context.ref.replace('refs/tags/','')} points to ${sha}, but current main is ${mainSha}.`);
              return;
            }
            const certName=`release-certification-${sha}`;
            const runs=await github.paginate(github.rest.actions.listWorkflowRuns,{
              owner,repo,workflow_id:'promote.yml',branch:'dev',status:'success',per_page:100
            });
            let promotionRun=null,certArtifact=null;
            for(const run of runs.filter(run=>run.conclusion==='success'&&run.event==='workflow_dispatch')){
              const artifacts=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{owner,repo,run_id:run.id,per_page:100});
              const artifact=artifacts.find(item=>item.name===certName&&!item.expired);
              if(artifact){promotionRun=run;certArtifact=artifact;break;}
            }
            if(!promotionRun||!certArtifact){
              core.setFailed(`No successful promotion contains ${certName} for exact release SHA ${sha}.`);
              return;
            }
            core.info(`Using promotion run #${promotionRun.run_number}: ${promotionRun.html_url}`);
            core.setOutput('promotion_run_id',String(promotionRun.id));
            core.setOutput('certification_name',certName);

      - name: Checkout exact release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download immutable promotion certification
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.resolve.outputs.certification_name }}
          path: certification
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.resolve.outputs.promotion_run_id }}

      - name: Verify certification identity
        id: certification
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          export VERSION
          node <<'NODE'
          const fs=require('node:fs');
          const cert=JSON.parse(fs.readFileSync('certification/release-certification.json','utf8'));
          const sha=String(process.env.GITHUB_SHA||'').toLowerCase(),version=process.env.VERSION;
          const fail=msg=>{throw new Error(msg);};
          if(cert.schemaVersion!==1||cert.kind!=='weig-release-certification')fail('Unsupported release certification.');
          if(String(cert.candidateSha||'').toLowerCase()!==sha)fail('Certification candidate SHA mismatch.');
          if(cert.version!==version)fail('Certification VERSION mismatch.');
          if(!/^[0-9a-f]{40}$/.test(String(cert.compatEvidenceSha||'')))fail('Certification compatibility SHA is invalid.');
          if(!Number.isInteger(cert.candidate?.runId)||cert.candidate.runId<1)fail('Certification candidate run id is invalid.');
          if(cert.candidate.artifact!==`release-candidate-${sha}`)fail('Certification candidate artifact name mismatch.');
          if(!/^[0-9a-f]{64}$/.test(String(cert.candidate.packageSha256||'')))fail('Certification package digest is invalid.');
          if(!Number.isInteger(cert.deployment?.runId)||cert.deployment.artifact!==`candidate-deployment-${sha}`)fail('Certification deployment evidence identity mismatch.');
          for(const owner of ['deployment','fullFrozen','locale']){
            if(!/^[0-9a-f]{64}$/.test(String(cert[owner]?.evidenceSha256||'')))fail(`Certification ${owner} digest is invalid.`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`candidate_run_id=${cert.candidate.runId}\nartifact_name=${cert.candidate.artifact}\npackage_sha256=${cert.candidate.packageSha256}\n`);
          console.log(`Certification PASS: candidate ${sha}, compat ${cert.compatEvidenceSha}, promotion run ${cert.promotionRunId}`);
          NODE

      - name: Download certified release candidate
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.certification.outputs.artifact_name }}
          path: release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.certification.outputs.candidate_run_id }}

      - name: Verify certified candidate bytes
        env:
          CERTIFIED_PACKAGE_SHA256: ${{ steps.certification.outputs.package_sha256 }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          test -f release/WeiG-qB-WebUI.zip
          test -f release/SHA256SUMS
          test -f release/CANDIDATE_SHA
          test -f release/weig-install.sh
          test -f release/weig-install.ps1
          test "$(tr -d '\r\n' < release/CANDIDATE_SHA)" = "$GITHUB_SHA"
          (cd release && sha256sum -c SHA256SUMS)
          ACTUAL="$(sha256sum release/WeiG-qB-WebUI.zip | awk '{print $1}')"
          test "$ACTUAL" = "$CERTIFIED_PACKAGE_SHA256"
          cmp -s release/weig-install.sh installers/install.sh
          cmp -s release/weig-install.ps1 installers/install.ps1
          bash -n release/weig-install.sh
          test "$(unzip -p release/WeiG-qB-WebUI.zip WeiG-qB-WebUI/GIT_SHA | tr -d '\r\n')" = "$GITHUB_SHA"
          test "$(unzip -p release/WeiG-qB-WebUI.zip WeiG-qB-WebUI/VERSION | tr -d '\r\n')" = "$VERSION"
          echo "Certified candidate bytes PASS: $ACTUAL"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          gh release create "${GITHUB_REF_NAME}" \
            release/WeiG-qB-WebUI.zip \
            release/weig-install.sh \
            release/weig-install.ps1 \
            release/SHA256SUMS \
            --verify-tag \
            --latest \
            --generate-notes \
            --notes $'Latest stable release of WeiG qB WebUI.\n\nPromotion certification already verified release-grade Full Frozen 65/65, current-stable Locale 61/61, and exact candidate deployment acceptance.' \
            --title "WeiG qB WebUI ${VERSION}"
