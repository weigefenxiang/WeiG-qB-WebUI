name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve exact reusable main candidate artifact
        id: verify
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ github.sha }}
        with:
          script: |
            const sha = String(process.env.RELEASE_SHA || '').trim().toLowerCase();
            if (!/^[0-9a-f]{40}$/.test(sha)) {
              core.setFailed(`Release SHA is invalid: ${sha}`);
              return;
            }

            const {owner, repo} = context.repo;
            const main = await github.rest.repos.getBranch({owner, repo, branch: 'main'});
            const mainSha = main.data.commit.sha.toLowerCase();
            if (mainSha !== sha) {
              core.setFailed(`Tag ${context.ref.replace('refs/tags/', '')} points to ${sha}, but current main is ${mainSha}. Refusing to publish a non-current stable commit.`);
              return;
            }

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: 'ci.yml',
              branch: 'main',
              event: 'workflow_dispatch',
              status: 'success',
              per_page: 100
            });
            const exactRuns = runs.filter(run => run.head_sha && run.head_sha.toLowerCase() === sha && run.conclusion === 'success');
            const artifactName = `release-candidate-${sha}`;
            let validated = null;
            let artifact = null;
            for (const run of exactRuns) {
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner,
                repo,
                run_id: run.id,
                per_page: 100
              });
              const candidate = artifacts.find(item => item.name === artifactName && !item.expired);
              if (candidate) {
                validated = run;
                artifact = candidate;
                break;
              }
            }
            if (!validated || !artifact) {
              core.setFailed(`No successful main Release-candidate CI run with reusable artifact ${artifactName} exists for exact SHA ${sha}.`);
              return;
            }

            const upstreamRuns = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: 'upstream-compat.yml',
              branch: 'dev',
              event: 'push',
              status: 'success',
              per_page: 100
            });
            const upstreamValidated = upstreamRuns.find(run => run.head_sha && run.head_sha.toLowerCase() === sha && run.conclusion === 'success');
            if (!upstreamValidated) {
              core.setFailed(`No successful upstream compatibility audit exists for exact release SHA ${sha}.`);
              return;
            }

            core.info(`Reusing main Release-candidate CI run #${validated.run_number}: ${validated.html_url}`);
            core.info(`Verified upstream compatibility audit #${upstreamValidated.run_number}: ${upstreamValidated.html_url}`);
            core.info(`Reusing artifact ${artifact.name} (${artifact.id})`);
            core.setOutput('run_id', String(validated.id));
            core.setOutput('upstream_run_id', String(upstreamValidated.id));
            core.setOutput('artifact_name', artifactName);
            core.setOutput('artifact_id', String(artifact.id));

      - name: Download validated main release candidate
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.verify.outputs.artifact_name }}
          path: release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.verify.outputs.run_id }}

      - name: Verify candidate integrity and exact SHA
        run: |
          set -euo pipefail
          test -f release/WeiG-qB-WebUI.zip
          test -f release/SHA256SUMS
          test -f release/CANDIDATE_SHA
          test "$(tr -d '\r\n' < release/CANDIDATE_SHA)" = "$GITHUB_SHA"
          (cd release && sha256sum -c SHA256SUMS)
          test "$(unzip -p release/WeiG-qB-WebUI.zip WeiG-qB-WebUI/GIT_SHA | tr -d '\r\n')" = "$GITHUB_SHA"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/WeiG-qB-WebUI.zip \
            release/SHA256SUMS \
            --generate-notes \
            --title "WeiG qB WebUI ${GITHUB_REF_NAME}"
