name: "Bug feedback"
description: "Report a WeiG qB WebUI problem."
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: "What happened?"
      description: "Describe the problem, the expected result, and how to reproduce it."
      placeholder: "Example: After generating an API key, the page jumps down; it should stay in place."
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: "Interface"
      description: "Choose the layout where you saw the problem."
      options:
        - Mobile
        - Desktop
        - Other or unsure
    validations:
      required: true
  - type: input
    id: other_environment
    attributes:
      label: "Other environment (optional)"
      description: "Only needed if you selected Other or unsure."
      placeholder: "TV browser, tablet, embedded browser"
  - type: input
    id: weig_version
    attributes:
      label: "WeiG WebUI version"
      description: "Find this under Settings → About."
      placeholder: "1.2.2-A74(abcdef0)"
    validations:
      required: true
  - type: input
    id: qb_version
    attributes:
      label: "qBittorrent version"
      placeholder: "5.2.4"
    validations:
      required: true
  - type: input
    id: browser_os
    attributes:
      label: "Browser and OS (optional)"
      placeholder: "Chrome 154 · Windows 11"
  - type: input
    id: webui_locale
    attributes:
      label: "WebUI language (optional)"
      description: "Filled automatically when reporting from WebUI; no need to change it."
      placeholder: "en"
  - type: upload
    id: attachments
    attributes:
      label: "Screenshot or log (optional)"
      description: "Attach a screenshot or short log if it helps."
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.log,.txt,.json,.zip"
