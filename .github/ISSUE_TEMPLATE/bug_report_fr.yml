name: "Bug feedback / Signaler un bug"
description: "Report a WeiG qB WebUI problem. / Signalez un problème rencontré dans WeiG WebUI."
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: "What happened? / Que s’est-il passé ?"
      description: "Describe the problem, the expected result, and how to reproduce it. / Décrivez le problème, le résultat attendu et les étapes pour le reproduire."
      placeholder: "Example: After generating an API key, the page jumps down; it should stay in place. / Exemple : après la création d’une clé API, la page défile vers le bas."
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: "Interface / Interface"
      description: "Choose the layout where you saw the problem. / Choisissez l’affichage dans lequel le problème apparaît."
      options:
        - Mobile
        - Desktop
        - Other or unsure
    validations:
      required: true
  - type: input
    id: other_environment
    attributes:
      label: "Other environment (optional) / Autre environnement (facultatif)"
      description: "Only needed if you selected Other or unsure. / À remplir seulement si Other or unsure est sélectionné."
      placeholder: "TV browser, tablet, embedded browser / Navigateur TV, tablette, navigateur intégré"
  - type: input
    id: weig_version
    attributes:
      label: "WeiG WebUI version / Version de WeiG WebUI"
      description: "Find this under Settings → About. / Disponible dans Paramètres → À propos."
      placeholder: "1.2.2-A74(abcdef0)"
    validations:
      required: true
  - type: input
    id: qb_version
    attributes:
      label: "qBittorrent version / Version de qBittorrent"
      placeholder: "5.2.4"
    validations:
      required: true
  - type: input
    id: browser_os
    attributes:
      label: "Browser and OS (optional) / Navigateur et système (facultatif)"
      placeholder: "Chrome 154 · Windows 11 / Chrome 154 · Windows 11"
  - type: input
    id: webui_locale
    attributes:
      label: "WebUI language (optional) / Langue de WebUI (facultatif)"
      description: "Filled automatically when reporting from WebUI; no need to change it. / Renseignée automatiquement depuis WebUI."
      placeholder: "fr"
  - type: upload
    id: attachments
    attributes:
      label: "Screenshot or log (optional) / Capture d’écran ou journal (facultatif)"
      description: "Attach a screenshot or short log if it helps. / Joignez-les uniquement s’ils permettent de comprendre le problème."
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.log,.txt,.json,.zip"
