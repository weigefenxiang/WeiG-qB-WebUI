name: "Bug feedback / Informar de un error"
description: "Report a WeiG qB WebUI problem. / Notifica un problema de WeiG WebUI."
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: "What happened? / ¿Qué ha ocurrido?"
      description: "Describe the problem, the expected result, and how to reproduce it. / Describe el problema, el resultado esperado y cómo reproducirlo."
      placeholder: "Example: After generating an API key, the page jumps down; it should stay in place. / Ejemplo: al generar una clave API, la página se desplaza hacia abajo."
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: "Interface / Interfaz"
      description: "Choose the layout where you saw the problem. / Elige el diseño donde encontraste el problema."
      options:
        - Mobile
        - Desktop
        - Other or unsure
    validations:
      required: true
  - type: input
    id: other_environment
    attributes:
      label: "Other environment (optional) / Otro entorno (opcional)"
      description: "Only needed if you selected Other or unsure. / Rellénalo solo si seleccionaste Other or unsure."
      placeholder: "TV browser, tablet, embedded browser / Navegador de TV, tableta, navegador integrado"
  - type: input
    id: weig_version
    attributes:
      label: "WeiG WebUI version / Versión de WeiG WebUI"
      description: "Find this under Settings → About. / Consúltala en Ajustes → Acerca de."
      placeholder: "1.2.2-A74(abcdef0)"
    validations:
      required: true
  - type: input
    id: qb_version
    attributes:
      label: "qBittorrent version / Versión de qBittorrent"
      placeholder: "5.2.4"
    validations:
      required: true
  - type: input
    id: browser_os
    attributes:
      label: "Browser and OS (optional) / Navegador y sistema operativo (opcional)"
      placeholder: "Chrome 154 · Windows 11 / Chrome 154 · Windows 11"
  - type: input
    id: webui_locale
    attributes:
      label: "WebUI language (optional) / Idioma de WebUI (opcional)"
      description: "Filled automatically when reporting from WebUI; no need to change it. / Se rellena automáticamente al abrir desde WebUI."
      placeholder: "es"
  - type: upload
    id: attachments
    attributes:
      label: "Screenshot or log (optional) / Captura o registro (opcional)"
      description: "Attach a screenshot or short log if it helps. / Adjunta una captura o un registro breve solo si ayuda."
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.log,.txt,.json,.zip"
