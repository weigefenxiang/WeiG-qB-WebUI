name: "Bug feedback / 버그 신고"
description: "Report a WeiG qB WebUI problem. / WeiG WebUI에서 발생한 문제를 신고합니다."
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: "What happened? / 어떤 문제가 발생했나요?"
      description: "Describe the problem, the expected result, and how to reproduce it. / 문제, 예상한 동작, 재현 방법을 설명해 주세요."
      placeholder: "Example: After generating an API key, the page jumps down; it should stay in place. / 예: API 키를 생성한 뒤 페이지가 아래로 이동합니다. 원래 위치를 유지해야 합니다."
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: "Interface / 화면 유형"
      description: "Choose the layout where you saw the problem. / 문제가 발생한 화면 레이아웃을 선택하세요."
      options:
        - Mobile
        - Desktop
        - Other or unsure
    validations:
      required: true
  - type: input
    id: other_environment
    attributes:
      label: "Other environment (optional) / 기타 환경(선택)"
      description: "Only needed if you selected Other or unsure. / Other or unsure를 선택한 경우에만 추가해 주세요."
      placeholder: "TV browser, tablet, embedded browser / TV 브라우저, 태블릿, 내장 브라우저"
  - type: input
    id: weig_version
    attributes:
      label: "WeiG WebUI version / WeiG WebUI 버전"
      description: "Find this under Settings → About. / 설정 → 정보에서 확인할 수 있습니다."
      placeholder: "1.2.2-A74(abcdef0)"
    validations:
      required: true
  - type: input
    id: qb_version
    attributes:
      label: "qBittorrent version / qBittorrent 버전"
      placeholder: "5.2.4"
    validations:
      required: true
  - type: input
    id: browser_os
    attributes:
      label: "Browser and OS (optional) / 브라우저 및 OS(선택)"
      placeholder: "Chrome 154 · Windows 11 / Chrome 154 · Windows 11"
  - type: input
    id: webui_locale
    attributes:
      label: "WebUI language (optional) / WebUI 언어(선택)"
      description: "Filled automatically when reporting from WebUI; no need to change it. / WebUI에서 열면 자동으로 입력됩니다."
      placeholder: "ko"
  - type: upload
    id: attachments
    attributes:
      label: "Screenshot or log (optional) / 스크린샷 또는 로그(선택)"
      description: "Attach a screenshot or short log if it helps. / 문제 설명에 도움이 되는 경우에만 첨부하세요."
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.log,.txt,.json,.zip"
