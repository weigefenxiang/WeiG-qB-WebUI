name: "Bug feedback / Fehler melden"
description: "Report a WeiG qB WebUI problem. / Melde ein Problem mit WeiG WebUI."
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: "What happened? / Was ist passiert?"
      description: "Describe the problem, the expected result, and how to reproduce it. / Beschreibe das Problem, das erwartete Verhalten und die Schritte zur Reproduktion."
      placeholder: "Example: After generating an API key, the page jumps down; it should stay in place. / Beispiel: Nach dem Erstellen eines API-Schlüssels springt die Seite nach unten."
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: "Interface / Oberfläche"
      description: "Choose the layout where you saw the problem. / Wähle das Layout, in dem der Fehler aufgetreten ist."
      options:
        - Mobile
        - Desktop
        - Other or unsure
    validations:
      required: true
  - type: input
    id: other_environment
    attributes:
      label: "Other environment (optional) / Andere Umgebung (optional)"
      description: "Only needed if you selected Other or unsure. / Nur ausfüllen, wenn Other or unsure ausgewählt wurde."
      placeholder: "TV browser, tablet, embedded browser / TV-Browser, Tablet, eingebetteter Browser"
  - type: input
    id: weig_version
    attributes:
      label: "WeiG WebUI version / WeiG-WebUI-Version"
      description: "Find this under Settings → About. / Unter Einstellungen → Über zu finden."
      placeholder: "1.2.2-A74(abcdef0)"
    validations:
      required: true
  - type: input
    id: qb_version
    attributes:
      label: "qBittorrent version / qBittorrent-Version"
      placeholder: "5.2.4"
    validations:
      required: true
  - type: input
    id: browser_os
    attributes:
      label: "Browser and OS (optional) / Browser und Betriebssystem (optional)"
      placeholder: "Chrome 154 · Windows 11 / Chrome 154 · Windows 11"
  - type: input
    id: webui_locale
    attributes:
      label: "WebUI language (optional) / WebUI-Sprache (optional)"
      description: "Filled automatically when reporting from WebUI; no need to change it. / Beim Öffnen aus der WebUI automatisch ausgefüllt."
      placeholder: "de"
  - type: upload
    id: attachments
    attributes:
      label: "Screenshot or log (optional) / Screenshot oder Protokoll (optional)"
      description: "Attach a screenshot or short log if it helps. / Füge nur bei Bedarf einen Screenshot oder kurzen Logauszug hinzu."
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.log,.txt,.json,.zip"
