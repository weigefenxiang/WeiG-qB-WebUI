name: "Bug feedback / 不具合報告"
description: "Report a WeiG qB WebUI problem. / WeiG WebUI で発生した問題を報告します。"
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: "What happened? / 何が起きましたか？"
      description: "Describe the problem, the expected result, and how to reproduce it. / 問題の内容、期待した動作、再現手順を記入してください。"
      placeholder: "Example: After generating an API key, the page jumps down; it should stay in place. / 例：API キーの生成後にページが下に移動する。元の位置に留まるはずです。"
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: "Interface / 画面の種類"
      description: "Choose the layout where you saw the problem. / 問題が発生した画面レイアウトを選んでください。"
      options:
        - Mobile
        - Desktop
        - Other or unsure
    validations:
      required: true
  - type: input
    id: other_environment
    attributes:
      label: "Other environment (optional) / その他の環境（任意）"
      description: "Only needed if you selected Other or unsure. / Other or unsure を選んだ場合のみ補足してください。"
      placeholder: "TV browser, tablet, embedded browser / テレビのブラウザー、タブレット、組み込みブラウザー"
  - type: input
    id: weig_version
    attributes:
      label: "WeiG WebUI version / WeiG WebUI のバージョン"
      description: "Find this under Settings → About. / 設定 → このアプリについて で確認できます。"
      placeholder: "1.2.2-A74(abcdef0)"
    validations:
      required: true
  - type: input
    id: qb_version
    attributes:
      label: "qBittorrent version / qBittorrent のバージョン"
      placeholder: "5.2.4"
    validations:
      required: true
  - type: input
    id: browser_os
    attributes:
      label: "Browser and OS (optional) / ブラウザーと OS（任意）"
      placeholder: "Chrome 154 · Windows 11 / Chrome 154 · Windows 11"
  - type: input
    id: webui_locale
    attributes:
      label: "WebUI language (optional) / WebUI の言語（任意）"
      description: "Filled automatically when reporting from WebUI; no need to change it. / WebUI から開いた場合は自動入力されます。"
      placeholder: "ja"
  - type: upload
    id: attachments
    attributes:
      label: "Screenshot or log (optional) / スクリーンショットまたはログ（任意）"
      description: "Attach a screenshot or short log if it helps. / 原因の説明に役立つ場合だけ添付してください。"
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.log,.txt,.json,.zip"
